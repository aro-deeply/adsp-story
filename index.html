<!-- ============ 6 ============ -->
<section class="ep" id="e6">
  <div class="eph"><span class="no">6화</span><h2>안 팔리는 건 짝도 안 팔린다: Apriori</h2><span class="pg">37쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>모든 조합을 다 세면 끝이 안 난다(1화). 그래서 <b>최소 지지도</b> 기준을 정하고, <b>자주 안 팔리는 품목이 들어간 조합은 세지도 않고 버린다</b>. 단어장이 2장밖에 안 팔렸으면 "단어장 + 무엇"은 2장을 넘을 수 없으니까.</div>
  <div class="fig">
    <svg viewBox="0 0 452 250" style="max-width:500px" role="img" aria-label="Apriori, 최소 지지도 3건: 단어장 2건 탈락이라 단어장이 든 묶음은 세지 않음. 문제집과 오답노트, 문제집과 형광펜 통과. 오답노트와 형광펜 1건 탈락. 세 개 묶음은 탈락한 짝을 품고 있어 세지 않음"><text class="svgmut" x="4" y="44">1개</text><text class="svgmut" x="4" y="124">2개</text><text class="svgmut" x="4" y="204">3개</text><rect x="32" y="24" width="100" height="32" rx="7" fill="var(--ok-soft)" stroke="var(--ok)" stroke-width="1.5"/><text class="svgtxt" x="82" y="38" text-anchor="middle" font-weight="700">문제집</text><text class="svgmut" x="82" y="51" text-anchor="middle">5건 통과</text><rect x="136" y="24" width="100" height="32" rx="7" fill="var(--ok-soft)" stroke="var(--ok)" stroke-width="1.5"/><text class="svgtxt" x="186" y="38" text-anchor="middle" font-weight="700">오답노트</text><text class="svgmut" x="186" y="51" text-anchor="middle">4건 통과</text><rect x="240" y="24" width="100" height="32" rx="7" fill="var(--ok-soft)" stroke="var(--ok)" stroke-width="1.5"/><text class="svgtxt" x="290" y="38" text-anchor="middle" font-weight="700">형광펜</text><text class="svgmut" x="290" y="51" text-anchor="middle">6건 통과</text><rect x="344" y="24" width="100" height="32" rx="7" fill="var(--omr-soft)" stroke="var(--omr)" stroke-width="1.5"/><text class="svgtxt" x="394" y="38" text-anchor="middle" font-weight="700">단어장</text><text class="svgmut" x="394" y="51" text-anchor="middle">2건 탈락</text><rect x="32" y="104" width="100" height="32" rx="7" fill="var(--ok-soft)" stroke="var(--ok)" stroke-width="1.5"/><text class="svgtxt" x="82" y="118" text-anchor="middle" font-weight="700">문제집+오답노트</text><text class="svgmut" x="82" y="131" text-anchor="middle">3건 통과</text><rect x="136" y="104" width="100" height="32" rx="7" fill="var(--ok-soft)" stroke="var(--ok)" stroke-width="1.5"/><text class="svgtxt" x="186" y="118" text-anchor="middle" font-weight="700">문제집+형광펜</text><text class="svgmut" x="186" y="131" text-anchor="middle">3건 통과</text><rect x="240" y="104" width="100" height="32" rx="7" fill="var(--omr-soft)" stroke="var(--omr)" stroke-width="1.5"/><text class="svgtxt" x="290" y="118" text-anchor="middle" font-weight="700">오답노트+형광펜</text><text class="svgmut" x="290" y="131" text-anchor="middle">1건 탈락</text><rect x="344" y="104" width="100" height="32" rx="7" fill="var(--sunk)" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/><text class="svgmut" x="394" y="118" text-anchor="middle" font-weight="700">단어장 든 짝 3개</text><text class="svgmut" x="394" y="131" text-anchor="middle">세지 않음</text><rect x="81" y="184" width="210" height="32" rx="7" fill="var(--sunk)" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/><text class="svgmut" x="186" y="198" text-anchor="middle" font-weight="700">문제집+오답노트+형광펜</text><text class="svgmut" x="186" y="211" text-anchor="middle">탈락한 짝을 품음 → 세지 않음</text><path d="M394 57 L394 103" stroke="var(--omr)" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/><path d="M280 137 L250 183" stroke="var(--omr)" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/><text class="svgmut" x="226" y="244" text-anchor="middle">기준: 최소 지지도 0.3 (10장 중 3장 이상)</text></svg>
    <p class="cap">초록 = 기준 통과(빈발) · 빨강 = 탈락 · 회색 점선 = 탈락한 걸 품고 있어서 세지도 않음</p>
  </div>
  <div class="link">
    <div class="row"><span class="term">Apriori</span><span>최소 지지도 이상인 <b>빈발 항목집합</b>만 남겨 다음 단계로. 라틴어로 "사전에(미리)": 미리 걸러 낸다.</span></div>
    <div class="row"><span class="term">핵심 원리</span><span><b>빈발하지 않은 항목집합의 상위집합도 빈발하지 않다.</b> 단어장(2장)이 탈락이면 단어장이 든 모든 묶음도 탈락.</span></div>
    <div class="row"><span class="term">빈발 항목집합</span><span>Frequent Itemset. 최소 지지도를 넘는, 자주 나오는 품목 묶음.</span></div>
  </div>
  <details><summary>그래도 Apriori가 느린 이유</summary><div class="in">
    <p>1개짜리 세고 → 통과한 것으로 2개짜리 후보 만들고 → 영수증 전체를 <b>다시 훑어</b> 세고 → 3개짜리 후보 만들고 → <b>또 훑고</b>. 단계마다 영수증 더미를 처음부터 다시 읽어요. 영수증이 수백만 장이면 이게 느려요.</p>
  </div></details>
</section>

<!-- ============ 7 ============ -->
<section class="ep" id="e7">
  <div class="eph"><span class="no">7화</span><h2>영수증을 나무 하나로 접기: FP-Growth</h2><span class="pg">37쪽</span></div>

<section class="ep" id="qz">
  <div class="eph"><span class="no">끝</span><h2>확인 8문제</h2></div>
  <p style="margin:0 0 10px;color:var(--muted)">계산 문제는 칸 세기로 먼저 떠올려 보고 눌러서 확인하세요.</p>
  <div class="quiz">
    <details><summary>A와 B가 동시에 포함된 거래 비율은? A 산 사람 중 B도 산 조건부 확률은?</summary><div class="in"><p>동시 포함 비율은 <b>지지도</b> P(A∩B). 조건부 확률은 <b>신뢰도</b> P(A∩B) ÷ P(A).</p></div></details>
    <details><summary>향상도가 1이면? 1보다 크면? 작으면?</summary><div class="in"><p>1이면 <b>서로 독립(상관없음)</b>, 1보다 크면 <b>양의 상관</b>, 작으면 <b>음의 상관</b>.</p></div></details>
    <details><summary>P(맥주) 0.5, P(치킨) 0.45, 둘 다 0.3일 때 맥주 → 치킨 신뢰도와 향상도는?</summary><div class="in"><p>신뢰도 0.3 ÷ 0.5 = <b>0.6</b>. 향상도 0.3 ÷ 0.225 ≈ <b>1.33</b> → 양의 상관.</p></div></details>
    <details><summary>전체 100, A 40, B 50, 둘 다 20일 때 A → B 신뢰도와 향상도는?</summary><div class="in"><p>신뢰도 20 ÷ 40 = <b>0.5</b>. 향상도 0.2 ÷ (0.4 × 0.5) = <b>1.0</b> → 독립.</p></div></details>
    <details><summary>이 단원 영수증 10장에서 "오답노트 → 문제집" 신뢰도는?</summary><div class="in"><p>오답노트 영수증 4장 중 문제집도 산 3장 → <b>0.75</b>. 반대 방향(0.6)과 달라요. 신뢰도는 방향이 있어요.</p></div></details>
    <details><summary>연관분석의 특징이 아닌 것: 품목이 늘어도 계산량 일정?</summary><div class="in"><p><b>틀린 설명</b>. 품목이 늘면 <b>기하급수적으로 증가</b>. IF-THEN 규칙이라 단순하고, 비목적성(비지도), 장바구니 분석이라고도 해요.</p></div></details>
    <details><summary>최소 지지도로 빈발 항목만 남기는 알고리즘은? 이걸 트리로 개선한 건?</summary><div class="in"><p><b>Apriori</b>(빈발하지 않은 것의 상위집합도 빈발하지 않음). 트리로 개선한 건 <b>FP-Growth</b>(FP-Tree).</p></div></details>
    <details><summary>연관분석에 시간 개념을 더한 분석은?</summary><div class="in"><p><b>순차패턴 분석</b>. 시계열 분석이 아니에요.</p></div></details>
  </div>

  var u=UNITS[i], tpl=document.getElementById("t-"+id);
  view.innerHTML=""; view.appendChild(tpl.content.cloneNode(true));
  var nav=view.querySelector(".nav"); chips.innerHTML=""; if(nav) chips.appendChild(nav);
  ttl.innerHTML='<span class="num">'+no(u)+'</span>'+esc(u.t);
  bar.hidden=false;
  var prev=UNITS[i-1], next=UNITS[i+1];
  var end=document.createElement("div");
  end.innerHTML='<div class="markread"><button type="button" id="mr" class="'+(st.read[id]?"on":"")+'">'+(st.read[id]?"읽음 표시됨 ✓":"다 읽었어요")+'</button></div>'+
    '<div class="unav"><button type="button" class="pv" '+(prev?'data-u="'+prev.id+'"':'hidden')+'><small>← 이전 단원</small><b>'+(prev?no(prev)+'. '+esc(prev.t):'')+'</b></button>'+
    '<button type="button" class="nx" '+(next?'data-u="'+next.id+'"':'hidden')+'><small>다음 단원 →</small><b>'+(next?no(next)+'. '+esc(next.t):'')+'</b></button></div>';
  view.appendChild(end);
  st.last=id; save();
  window.scrollTo(0,0);
  document.title=no(u)+". "+u.t+" · ADsP 이해 노트";
}

function route(){var h=(location.hash||"").slice(1); if(/^u\d\d$/.test(h)) unit(h); else home();}
function go(id){ if(location.hash==="#"+id) route(); else location.hash=id; }

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-u]"); if(b){e.preventDefault(); go(b.getAttribute("data-u")); return;}
  if(e.target.closest("#back")){e.preventDefault(); if(location.hash) location.hash=""; else home(); return;}
  var mr=e.target.closest("#mr"); if(mr){var id=st.last; st.read[id]=!st.read[id]; save(); mr.className=st.read[id]?"on":""; mr.textContent=st.read[id]?"읽음 표시됨 ✓":"다 읽었어요"; return;}
  var a=e.target.closest('a[href^="#"]');
  if(a){var t=a.getAttribute("href").slice(1); if(!/^u\d\d$/.test(t)){e.preventDefault(); var el=view.querySelector('[id="'+t+'"]'); if(el){ if(t==="e0") window.scrollTo({top:0}); else el.scrollIntoView({block:"start"}); }}}
});
window.addEventListener("hashchange",route);
route();
})();
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
