  <div class="link">
    <div class="row"><span class="term">시계열</span><span>기온, 주가, 월별 매출처럼 <b>시간 순서</b>로 기록된 데이터</span></div>
    <div class="row"><span class="term">추세 요인</span><span>장기적으로 증가·감소</span></div>
    <div class="row"><span class="term">계절 요인</span><span><b>고정된 주기</b> (요일, 월, 계절)</span></div>
    <div class="row"><span class="term">순환 요인</span><span><b>알려지지 않은 주기</b> (경기 순환)</span></div>
    <div class="row"><span class="term">불규칙 요인</span><span>위 셋으로 설명 안 되는 나머지</span></div>
  </div>
  <div class="memo"><b>"추운 계절의 순환이 불규칙하다"</b> = 추세, 계절, 순환, 불규칙. 계절은 달력에 있으니 주기를 <b>앎</b>, 순환은 경기라서 주기를 <b>모름</b>.</div>
</section>

<!-- ============ 6 ============ -->
<section class="ep" id="e6">
  <div class="eph"><span class="no">6화</span><h2>예측하려면 먼저 그래프를 평평하게</h2><span class="pg">27쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>시계열 모형은 "과거 패턴이 앞으로도 똑같이 반복된다"고 믿고 예측한다. 그러려면 <b>평균과 흩어짐이 시간이 지나도 일정</b>해야 한다(정상성). 아니면 <b>차분</b>(평균 맞추기)이나 <b>변환</b>(흩어짐 맞추기)으로 고쳐 쓴다.</div>
  <div class="fig">
    <div class="three">
      <div class="box"><span class="tag green">정상</span>
        <svg viewBox="0 0 160 80" style="max-width:200px;margin:6px auto" role="img" aria-label="평균선 주변에서 일정한 폭으로 흔들림"><rect x="8" y="26" width="144" height="28" fill="var(--ok-soft)"/><line x1="8" y1="40" x2="152" y2="40" stroke="var(--ok)" stroke-width="1.5" stroke-dasharray="5 3"/><polyline points="8,49 14,29 20,47 26,30 32,37 38,32 44,53 50,45 56,62 62,46 68,48 74,48 80,35 86,39 92,52 98,36 104,42 110,40 116,45 122,37 128,39 134,42 140,41 146,32 152,48" fill="none" stroke="var(--ink)" stroke-width="1.6"/></svg>
        <p>평균 일정, 흩어진 폭 일정. <b>예측 가능</b></p></div>
      <div class="box"><span class="tag red">평균이 변함</span>
        <svg viewBox="0 0 160 80" style="max-width:200px;margin:6px auto" role="img" aria-label="평균선 자체가 위로 기울어 올라감"><line x1="8" y1="60" x2="152" y2="16" stroke="var(--omr)" stroke-width="1.5" stroke-dasharray="5 3"/><polyline points="8,58 14,57 20,54 26,66 32,56 38,50 44,47 50,55 56,44 62,40 68,50 74,37 80,40 86,40 92,35 98,36 104,42 110,29 116,22 122,17 128,25 134,22 140,24 146,17 152,15" fill="none" stroke="var(--ink)" stroke-width="1.6"/></svg>
        <p>추세가 있음 → <b>차분</b></p></div>
      <div class="box"><span class="tag red">흩어짐이 변함</span>
        <svg viewBox="0 0 160 80" style="max-width:200px;margin:6px auto" role="img" aria-label="뒤로 갈수록 흔들림 폭이 나팔처럼 커짐"><path d="M8 38 L152 8 L152 72 L8 42 Z" fill="var(--omr-soft)"/><polyline points="8,39 14,39 20,40 26,39 32,40 38,50 44,43 50,28 56,54 62,43 68,31 74,50 80,40 86,32 92,31 98,26 104,41 110,57 116,34 122,48 128,76 134,16 140,45 146,33 152,16" fill="none" stroke="var(--ink)" stroke-width="1.6"/></svg>
        <p>폭이 커짐 → <b>변환</b>(로그 등)</p></div>
    </div>
  </div>
  <p class="linkh">차분 = "어제와의 차이"로 바꿔서 추세 없애기</p>
  <div class="fig">
    <div class="tblwrap">
      <table class="act">
        <tr><th></th><th>1월</th><th>2월</th><th>3월</th><th>4월</th><th>5월</th><th>6월</th></tr>
        <tr><td>등록생 수</td><td class="num">100</td><td class="num">105</td><td class="num">112</td><td class="num">118</td><td class="num">125</td><td class="num">131</td></tr>
        <tr><td>이번 달 − 지난달</td><td class="num">·</td><td class="num">5</td><td class="num">7</td><td class="num">6</td><td class="num">7</td><td class="num">6</td></tr>
      </table>
    </div>
    <svg viewBox="0 0 360 120" style="max-width:420px;margin-top:10px" role="img" aria-label="왼쪽 원래 값은 100에서 131로 계속 오르는 선, 오른쪽 차분 값은 5에서 7 사이에서 평평">
      <line x1="20" y1="100" x2="160" y2="100" stroke="var(--line)"/>
      <polyline points="25,90 52,80 79,66 106,54 133,40 160,28" fill="none" stroke="var(--omr)" stroke-width="2.5"/>
      <g fill="var(--omr)"><circle cx="25" cy="90" r="3.5"/><circle cx="52" cy="80" r="3.5"/><circle cx="79" cy="66" r="3.5"/><circle cx="106" cy="54" r="3.5"/><circle cx="133" cy="40" r="3.5"/><circle cx="160" cy="28" r="3.5"/></g>
      <text class="svgtxt" x="92" y="116" text-anchor="middle" font-weight="700">원래: 100 → 131 계속 오름</text>
      <text class="svgtxt" x="182" y="64" text-anchor="middle" font-weight="700">→</text>
      <line x1="205" y1="100" x2="345" y2="100" stroke="var(--line)"/>
      <rect x="205" y="54" width="140" height="24" fill="var(--ok-soft)"/>
      <polyline points="237,74 264,58 291,66 318,58 345,66" fill="none" stroke="var(--ok)" stroke-width="2.5"/>
      <g fill="var(--ok)"><circle cx="237" cy="74" r="3.5"/><circle cx="264" cy="58" r="3.5"/><circle cx="291" cy="66" r="3.5"/><circle cx="318" cy="58" r="3.5"/><circle cx="345" cy="66" r="3.5"/></g>
      <text class="svgtxt" x="275" y="116" text-anchor="middle" font-weight="700">차분 후: 5~7 사이 평평</text>
    </svg>
    <div class="calc">
      <div class="ln"><span>원래 값: 매달 평균이 올라감 (100에서 131)</span><span class="num">비정상</span></div>
      <div class="ln"><span>차분 값의 평균: (5+7+6+7+6) ÷ 5</span><span class="num">6.2명</span></div>
      <div class="ln"><span>뜻: "매달 약 6명씩 늘어난다"가 일정한 패턴이 됨</span><span class="num">정상에 가까움</span></div>
    </div>
  </div>
  <div class="say"><p>원래 값은 계속 올라가서 "평균"이 정해지지 않아요. 차이로 바꾸니 5~7을 오가는 평평한 그래프가 됐어요. 이렇게 <b>한 번 빼면 1차 차분</b>, 그래도 기울어 있으면 한 번 더 빼서 2차 차분.</p></div>
  <div class="link">
    <div class="row"><span class="term">정상성</span><span>모든 시점에서 <b>평균과 분산이 일정</b>, 공분산은 <b>시차에만 의존</b></span></div>
    <div class="row"><span class="term">공분산은 시차에만 의존</span><span>1월과 2월의 관계 = 7월과 8월의 관계. <b>몇 칸 떨어졌나</b>만 중요하고 언제인지는 상관없음</span></div>
    <div class="row"><span class="term">차분</span><span>평균이 일정하지 않을 때. <b>현재 − 이전</b></span></div>
    <div class="row"><span class="term">변환</span><span>분산이 일정하지 않을 때. <b>로그, 제곱근, Box-Cox</b></span></div>
  </div>
  <details><summary>로그 변환은 왜 흩어짐을 줄여 주나</summary><div class="in">
    <p>로그는 큰 수일수록 더 많이 눌러 줘요. log₁₀10 = 1, log₁₀100 = 2, log₁₀1000 = 3. 990이나 차이 나던 10과 1000이 1과 3, <b>2 차이</b>가 돼요. 그래서 뒤로 갈수록 커지던 흔들림 폭이 고르게 눌려요.</p>
  </div></details>
  <div class="memo"><b>평균 → 차분, 분산 → 변환.</b> "평차, 분변"으로 묶어 두세요.</div>
</section>

<!-- ============ 7 ============ -->
<section class="ep" id="e7">
  <div class="eph"><span class="no">7화</span><h2>들쭉날쭉한 그래프, 흐름만 보고 싶다</h2><span class="pg">28쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>불규칙한 출렁임을 걷어 내고 흐름만 보려고 <b>평균을 내서 부드럽게</b> 만든다(평활화). 최근 몇 달을 <b>똑같이</b> 평균 내면 이동평균법, <b>최근일수록 더 크게</b> 쳐 주면 지수평활법.</div>
  <div class="fig">
    <div class="tblwrap">

        <tr><th></th><th>1월</th><th>2월</th><th>3월</th><th>4월</th><th>5월</th><th>6월</th></tr>
        <tr><td>신규 상담 건수</td><td class="num">20</td><td class="num">26</td><td class="num">23</td><td class="num">29</td><td class="num">26</td><td class="num">32</td></tr>
        <tr><td>3개월 이동평균</td><td class="num">·</td><td class="num">·</td><td class="num">23</td><td class="num">26</td><td class="num">26</td><td class="num">29</td></tr>
      </table>
    </div>

      <div class="ln"><span>원래는 +6, −3이 반복되던 출렁임이, 이동평균에선 내려가는 달 없이 오르는 흐름으로</span><span class="num">23 → 29</span></div>

    <p class="linkh" style="margin-top:14px">최근 값에 주는 비중 비교 (지수평활 α = 0.5)</p>

      <g fill="var(--omr)"><rect x="210" y="89" width="28" height="6"/><rect x="250" y="83" width="28" height="12"/><rect x="290" y="71" width="28" height="24"/><rect x="330" y="35" width="28" height="60"/></g>

      <text class="svgtxt" x="285" y="126" text-anchor="middle" font-weight="700">지수평활: 최근일수록 크게</text>

  <div class="link">
    <div class="row"><span class="term">평활화</span><span>들쭉날쭉한 변동을 부드럽게 해서 흐름을 보기</span></div>
    <div class="row"><span class="term">이동평균법</span><span>일정 기간(예: 3개월)을 <b>똑같은 비중</b>으로 평균, 한 칸씩 밀며 계산</span></div>
    <div class="row"><span class="term">지수평활법</span><span><b>최근 데이터에 더 큰 가중치</b>. 과거로 갈수록 비중이 지수적으로(반씩) 줄어듦</span></div>
  </div>
  <div class="trap">8화의 <b>MA(이동평균) 모형</b>은 이름만 같고 여기 이동평균법과 다른 것이에요. 평활화의 이동평균은 "값의 평균", MA 모형은 "과거 잡음의 결합".</div>
</section>

<!-- ============ 8 ============ -->
<section class="ep" id="e8">
  <div class="eph"><span class="no">8화</span><h2>무엇으로 다음 달을 맞힐까: 과거 값, 과거 잡음</h2><span class="pg">28쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>패턴을 다 뽑아내고 남은 <b>아무 무늬 없는 잡음</b>이 백색잡음. 예측 재료는 둘. <b>내 과거 값</b>으로 맞히면 <b>AR</b>, <b>과거에 튄 잡음</b>으로 맞히면 <b>MA</b>. 어느 쪽인지는 <b>PACF, ACF 그래프가 뚝 끊기는 곳</b>으로 고른다.</div>
  <div class="fig">
    <svg viewBox="0 0 230 74" style="max-width:300px" role="img" aria-label="평균 0선 주변에서 무늬 없이 일정한 폭으로 흔들리는 백색잡음">
      <line x1="10" y1="40" x2="210" y2="40" stroke="var(--muted)" stroke-dasharray="4 3"/>
      <polyline points="10,30 17,40 24,44 31,35 38,41 44,47 51,43 58,49 65,45 72,45 79,58 86,46 93,41 100,47 107,31 113,37 120,48 127,46 134,55 141,40 148,25 155,59 162,51 169,29 176,54 182,40 189,22 196,36 203,35 210,56" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
      <text class="svgmut" x="214" y="44">0</text>
    </svg>
    <p class="cap">백색잡음: 평균 0, 폭 일정, 다음 값을 짐작할 단서 없음</p>
  </div>
  <div class="two" style="margin-top:10px">
    <div class="box"><span class="tag blue">AR(자기회귀)</span><h4>"지난달 많았으면 이번 달도 많다"</h4><p>이번 달 = 0.7 × 지난달 + 잡음. <b>자기 과거 값</b>으로 설명.</p></div>
    <div class="box"><span class="tag green">MA(이동평균)</span><h4>"지난달 튄 일의 여파가 남는다"</h4><p>이번 달 = 이번 잡음 + 0.7 × 지난달 잡음. <b>과거 백색잡음들의 선형결합</b>. 지난달 폭설 휴원의 보강 수업이 이번 달까지 영향.</p></div>
  </div>
  <p class="linkh">ACF, PACF: 몇 칸 전 값과 얼마나 닮았나 (계수 0.7인 1차 모형 예시)</p>
  <div class="fig">
    <div class="two">
      <div class="box"><h4>AR(1)의 ACF</h4>
        <svg viewBox="0 0 160 80" style="max-width:200px;margin:6px auto" role="img" aria-label="0.7, 0.49, 0.34, 0.24, 0.17로 서서히 줄어듦"><line x1="20" y1="50" x2="150" y2="50" stroke="var(--ink)"/><g fill="var(--muted)"><rect x="30" y="22" width="14" height="28"/><rect x="55" y="30.4" width="14" height="19.6"/><rect x="80" y="36.4" width="14" height="13.6"/><rect x="105" y="40.4" width="14" height="9.6"/><rect x="130" y="43.2" width="14" height="6.8"/></g><g class="svgmut" text-anchor="middle"><text x="37" y="64">1</text><text x="62" y="64">2</text><text x="87" y="64">3</text><text x="112" y="64">4</text><text x="137" y="64">5</text></g><text class="svgmut" x="85" y="78" text-anchor="middle">시차(몇 칸 전)</text></svg>
        <p>서서히 줄어듦</p></div>
      <div class="box" style="border-color:var(--blue);border-width:2px"><h4>AR(1)의 PACF</h4>
        <svg viewBox="0 0 160 80" style="max-width:200px;margin:6px auto" role="img" aria-label="시차 1만 0.7이고 2부터 0으로 뚝 끊김"><line x1="20" y1="50" x2="150" y2="50" stroke="var(--ink)"/><rect x="30" y="22" width="14" height="28" fill="var(--blue)"/><text x="100" y="40" text-anchor="middle" fill="var(--blue)" font-size="12" font-weight="700" font-family="var(--font)">2부터 뚝</text><g class="svgmut" text-anchor="middle"><text x="37" y="64">1</text><text x="62" y="64">2</text><text x="87" y="64">3</text><text x="112" y="64">4</text><text x="137" y="64">5</text></g><text class="svgmut" x="85" y="78" text-anchor="middle">시차(몇 칸 전)</text></svg>
        <p><b>p+1(=2) 시점부터 급격히 감소</b> → AR(1)</p></div>
      <div class="box" style="border-color:var(--ok);border-width:2px"><h4>MA(1)의 ACF</h4>
        <svg viewBox="0 0 160 80" style="max-width:200px;margin:6px auto" role="img" aria-label="시차 1만 0.47이고 2부터 0으로 뚝 끊김"><line x1="20" y1="50" x2="150" y2="50" stroke="var(--ink)"/><rect x="30" y="31.2" width="14" height="18.8" fill="var(--ok)"/><text x="100" y="40" text-anchor="middle" fill="var(--ok)" font-size="12" font-weight="700" font-family="var(--font)">2부터 뚝</text><g class="svgmut" text-anchor="middle"><text x="37" y="64">1</text><text x="62" y="64">2</text><text x="87" y="64">3</text><text x="112" y="64">4</text><text x="137" y="64">5</text></g><text class="svgmut" x="85" y="78" text-anchor="middle">시차(몇 칸 전)</text></svg>
        <p><b>q+1(=2) 시점부터 급격히 감소</b> → MA(1)</p></div>
      <div class="box"><h4>MA(1)의 PACF</h4>
        <svg viewBox="0 0 160 80" style="max-width:200px;margin:6px auto" role="img" aria-label="0.47, −0.28, 0.19, −0.13, 0.09로 부호를 바꾸며 서서히 줄어듦"><line x1="20" y1="50" x2="150" y2="50" stroke="var(--ink)"/><g fill="var(--muted)"><rect x="30" y="31.2" width="14" height="18.8"/><rect x="55" y="50" width="14" height="11.2"/><rect x="80" y="42.4" width="14" height="7.6"/><rect x="105" y="50" width="14" height="5.2"/><rect x="130" y="46.4" width="14" height="3.6"/></g><g class="svgmut" text-anchor="middle"><text x="37" y="72">1</text><text x="62" y="72">2</text><text x="87" y="72">3</text><text x="112" y="72">4</text><text x="137" y="72">5</text></g></svg>
        <p>오르내리며 서서히 줄어듦</p></div>
    </div>
    <p class="cap">"뚝 끊기는" 그래프가 어느 쪽이냐로 모형을 고르고, 끊기기 직전 칸 번호가 차수(p 또는 q)예요.</p>
  </div>
  <div class="link">
    <div class="row"><span class="term">백색잡음</span><span>평균 0, 분산 일정, <b>자기상관 없음</b>(정상성 만족). 시계열 모형의 오차항</span></div>
    <div class="row"><span class="term">가우시안 백색잡음</span><span>백색잡음이 <b>정규분포를 따를 때</b></span></div>
    <div class="row"><span class="term">ACF 자기상관함수</span><span>k칸 전 값과 얼마나 닮았나 (중간 칸 영향 포함)</span></div>
    <div class="row"><span class="term">PACF 부분자기상관함수</span><span>중간 칸 영향을 <b>빼고</b> k칸 전 값과 직접 닮은 정도</span></div>
    <div class="row"><span class="term">AR(p)</span><span>자기 과거 값으로 설명. <b>PACF</b>가 p+1 시점부터 급격히 감소</span></div>
    <div class="row"><span class="term">MA(q)</span><span>과거 백색잡음의 선형결합. <b>ACF</b>가 q+1 시점부터 급격히 감소</span></div>
  </div>
  <div class="fix">요약노트의 "평균이 0이면 가우시안 백색잡음"은 틀린 설명이에요. 평균 0은 <b>모든 백색잡음</b>의 조건이고, 가우시안은 그 백색잡음이 <b>정규분포(가우시안 분포)를 따를 때</b>예요.</div>
  <details><summary>AR(1)의 ACF는 왜 서서히 줄고, PACF는 뚝 끊기나</summary><div class="in">
    <p>이번 달이 지난달을 0.7만큼 닮고, 지난달은 그 전 달을 0.7만큼 닮아요. 그래서 2칸 전과는 0.7 × 0.7 = <b>0.49</b>, 3칸 전과는 약 <b>0.34</b>. 줄 서서 말 전달하듯 조금씩 남아 있으니 ACF는 서서히 줄어요.</p>
    <p>PACF는 "지난달을 거쳐 온 영향"을 빼고 봐요. AR(1)은 2칸 전 값이 <b>지난달을 통해서만</b> 영향을 주니, 그걸 빼면 남는 게 0. 그래서 2부터 뚝 끊겨요.</p>
  </div></details>
  <div class="memo"><b>글자가 엇갈린다</b>: AR ↔ <b>P</b>ACF, MA ↔ <b>A</b>CF. "AR은 P, MA는 A".</div>
</section>

<!-- ============ 9 ============ -->
<section class="ep" id="e9">
  <div class="eph"><span class="no">9화</span><h2>다 합친 모형, ARIMA(p, d, q)</h2><span class="pg">28쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>실제 등록생 그래프는 추세가 있어 평평하지 않다. 그래서 <b>d번 차분해서 평평하게 만든 뒤(I), 과거 값(AR)과 과거 잡음(MA)을 함께</b> 쓴다. 괄호 안 세 숫자는 각각 "몇 개, 몇 번, 몇 개".</div>
  <div class="fig">
    <div class="pipe">
      <div class="st"><span class="nm">AR</span><span class="rg">p</span><span class="ex">과거 <b>값</b>을<br>몇 개 쓰나</span></div>
      <div class="st hi"><span class="nm">I</span><span class="rg">d</span><span class="ex"><b>차분</b>을<br>몇 번 하나</span></div>
      <div class="st"><span class="nm">MA</span><span class="rg">q</span><span class="ex">과거 <b>잡음</b>을<br>몇 개 쓰나</span></div>
      <div class="st"><span class="nm">S</span><span class="rg">계절</span><span class="ex">계절 주기가<br>있으면 SARIMA</span></div>
    </div>
    <p class="arrowline">ARIMA = AR + I(Integrated, 누적: 차분의 반대말) + MA</p>
    <div class="tblwrap" style="margin-top:10px">
      <table class="act">
        <tr><th>어떤 글자가 0?</th><th>빠지는 것</th><th>이름</th><th>예</th></tr>
        <tr><td>d = 0</td><td>차분 안 함 (이미 평평)</td><td><b>ARMA</b>(p, q)</td><td>ARIMA(1, 0, 2) = ARMA(1, 2)</td></tr>
        <tr><td>p = 0</td><td>과거 값 안 씀</td><td><b>IMA</b>(d, q)</td><td>ARIMA(0, 1, 1) = IMA(1, 1)</td></tr>
        <tr><td>q = 0</td><td>과거 잡음 안 씀</td><td><b>ARI</b>(p, d)</td><td>ARIMA(2, 1, 0) = ARI(2, 1)</td></tr>
        <tr><td>계절성 있음</td><td>계절 주기를 따로 붙임</td><td><b>SARIMA</b></td><td>방학마다 반복되는 등록생</td></tr>
      </table>
    </div>
  </div>
  <div class="say"><p>이름 붙이는 법은 간단해요. <b>0이 된 글자를 이름에서 지우면</b> 돼요. d가 0이면 I를 지워서 ARMA, p가 0이면 AR을 지워서 IMA, q가 0이면 MA를 지워서 ARI.</p></div>
  <div class="link">
    <div class="row"><span class="term">ARIMA(p, d, q)</span><span>p = AR 차수, <b>d = 차분 횟수</b>, q = MA 차수. 비정상 시계열을 d번 차분하면 ARMA(p, q)가 됨</span></div>
    <div class="row"><span class="term">SARIMA</span><span>계절성(Seasonal)이 있을 때 쓰는 ARIMA</span></div>
  </div>
  <div class="trap">"ARIMA(p, d, q)에서 d의 의미는?" → <b>차분 횟수</b>. 계절 주기나 AR 차수로 바꾼 보기가 자주 나와요.</div>
  <div class="memo">순서 그대로 <b>"값, 빼기, 잡음"</b>: 과거 값(p), 차분(d), 과거 잡음(q).</div>
</section>

<!-- ============ quiz ============ -->
<section class="ep" id="qz">
  <div class="eph"><span class="no">끝</span><h2>확인 8문제</h2></div>
  <p style="margin:0 0 10px;color:var(--muted)">답을 떠올려 본 뒤 눌러서 확인하세요. 5개 이상 떠오르면 오늘은 충분해요.</p>
  <div class="quiz">
    <details><summary>순서 척도 자료, 비선형(단조) 관계도 잡는 상관계수는? 곡선인데 계속 증가하면 두 값은?</summary><div class="in"><p><b>스피어만</b>(순위 기반). 곡선 증가면 <b>피어슨 +0.8, 스피어만 +1</b>. 순서는 완벽하지만 직선은 아니라서.</p></div></details>
    <details><summary>PCA의 제1주성분은 분산이 가장 큰 방향? 작은 방향? 제2주성분과의 관계는?</summary><div class="in"><p><b>가장 큰</b> 방향. 제2주성분은 제1주성분과 <b>직교</b>하면서 다음으로 분산이 큰 방향.</p></div></details>
    <details><summary>주성분 개수 결정 기준 두 가지는?</summary><div class="in"><p>누적 설명력 <b>70~90%</b>, 스크리플롯이 <b>완만해지기 직전</b>. 3~4에서 완만해지면 2개.</p></div></details>
    <details><summary>MDS의 Stress는 클수록 좋을까?</summary><div class="in"><p>아니요. <b>0에 가까울수록</b> 적합도가 좋아요. 거리표와 지도가 덜 어긋났다는 뜻.</p></div></details>
    <details><summary>주기가 알려지지 않은 채 반복되는 변동은? 평균이 일정하지 않을 때 쓰는 방법은?</summary><div class="in"><p><b>순환</b> 요인(경기 순환, 주기 고정이면 계절). 평균 → <b>차분</b>, 분산 → 변환(로그 등).</p></div></details>
    <details><summary>최근 데이터에 더 큰 가중치를 주는 평활화는? 가우시안 백색잡음이란?</summary><div class="in"><p><b>지수평활법</b>. 가우시안 백색잡음은 백색잡음이 <b>정규분포를 따를 때</b>(평균 0이라서가 아님).</p></div></details>
    <details><summary>PACF가 p+1 시점부터 급격히 감소하면 어떤 모형?</summary><div class="in"><p><b>AR(p)</b>. 엇갈림: AR ↔ PACF, MA ↔ ACF.</p></div></details>
    <details><summary>ARIMA(p, d, q)의 d는? ARIMA(1, 0, 2)는 무엇과 같나?</summary><div class="in"><p>d = <b>차분 횟수</b>. d = 0이라 I가 빠져서 <b>ARMA(1, 2)</b>.</p></div></details>
  </div>
  <div class="end">
    <h3>14장 한 문장</h3>
    <p>원장님이 변수들이 <b>같이 움직이는 정도</b>(피어슨, 스피어만)를 재고, 겹치는 항목 10개를 <b>분산 큰 방향 2개로 압축</b>(PCA, 70~90%, 스크리플롯)하거나 거리표로 <b>지도</b>(MDS, Stress)를 그린 뒤, 등록생 시계열을 <b>추세·계절·순환·불규칙</b>으로 쪼개고 <b>차분으로 평평하게(정상성)</b> 만들어 <b>AR(PACF), MA(ACF), ARIMA(p, d, q)</b>로 다음 달을 예측한다.</p>
  </div>
</section>

    <div class="splitlab"><span style="flex:6">여기로 공부(학습)</span><span style="flex:2">공부법 조정(튜닝)</span><span style="flex:2">딱 한 번, 최종 성능</span></div>

<!-- ============ 4 ============ -->
<section class="ep" id="e4">
  <div class="eph"><span class="no">4화</span><h2>선수 1. 로지스틱 회귀, 확률 계산기</h2><span class="pg">29쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>직선은 "합격 확률 130%" 같은 엉터리 값을 낸다. 그래서 확률을 <b>직선이 다룰 수 있게 늘렸다가(오즈, 로짓)</b>, 계산 후 <b>다시 0~1로 접는다(시그모이드)</b>. 수식이 많은 이유는 이것 하나.</div>
  <div class="fig">
    <div class="pipe">
      <div class="st"><span class="nm">① 확률 p</span><span class="rg">0 ~ 1</span><span class="ex">합격 확률 0.7<br>범위가 너무 좁음</span></div>
      <div class="st"><span class="nm">② 오즈</span><span class="rg">0 ~ ∞</span><span class="ex">p/(1-p)<br>0.7/0.3 ≈ 2.33<br>아직 마이너스 없음</span></div>
      <div class="st hi"><span class="nm">③ 로짓</span><span class="rg">-∞ ~ +∞</span><span class="ex">log(오즈)<br>여기서 직선으로<br>마음껏 계산</span></div>
      <div class="st"><span class="nm">④ 시그모이드</span><span class="rg">다시 0 ~ 1</span><span class="ex">로짓을 거꾸로 풀어<br>사람이 읽는 확률로</span></div>
    </div>
    <p class="arrowline">① → ② → ③ (계산) → ④ &nbsp;·&nbsp; 늘렸다가, 계산하고, 다시 접기</p>
    <svg viewBox="0 0 280 130" style="max-width:320px;margin-top:10px" role="img" aria-label="시그모이드 S자 곡선, 아래는 0, 위는 1에 붙고 넘지 않음">
      <line x1="20" y1="10" x2="260" y2="10" stroke="var(--line)" stroke-dasharray="4 4"/>
      <line x1="20" y1="110" x2="260" y2="110" stroke="var(--line)"/>
      <line x1="20" y1="60" x2="260" y2="60" stroke="var(--line)" stroke-dasharray="2 4"/>
      <path d="M20 109.75 L60 108.2 L100 98.1 L120 83.1 L140 60 L160 36.9 L180 21.9 L220 11.8 L260 10.25" fill="none" stroke="var(--omr)" stroke-width="3" stroke-linejoin="round"/>
      <text class="svgmut" x="16" y="14" text-anchor="end">1</text>
      <text class="svgmut" x="16" y="64" text-anchor="end">0.5</text>
      <text class="svgmut" x="16" y="114" text-anchor="end">0</text>
      <text class="svgmut" x="140" y="126" text-anchor="middle">시그모이드: 아무리 커도 1을 넘지 않는 S자</text>
    </svg>
  </div>
  <div class="fix">"붙을 확률이 2.33배 높음"보다 <b>"붙을 가능성이 떨어질 가능성의 2.33배"</b>가 정확해요. 오즈는 늘 "되는 쪽 ÷ 안 되는 쪽" 비교예요.</div>
  <p class="linkh">필기 용어 연결</p>
  <div class="link">
    <div class="row"><span class="term">β (계수)</span><span>요인(예: 모의고사 점수)이 결과에 주는 <b>영향력 크기</b>. 양수면 클수록 합격 쪽.</span></div>
    <div class="row"><span class="term">exp(β)</span><span>log 세상에서 계산했으니 exp로 풀어서 읽기 = <b>요인이 1 늘 때 오즈가 몇 배</b>. β ≈ 0.69면 exp(β) ≈ 2, 오즈 2배.</span></div>
    <div class="row"><span class="term">최대우도법</span><span>β를 정하는 법. 실제로 누가 붙고 떨어졌는지를 <b>가장 그럴듯하게(우도) 설명하는 β</b>를 고름.</span></div>
    <div class="row"><span class="term">우도비 검정</span><span>다 만든 모델이 아무 정보 없이 찍는 것보다 확실히 나은가? = <b>"이 모델 쓸모 있나" 검사</b>(카이제곱 사용).</span></div>
  </div>
  <details><summary>왜 선형회귀는 최소제곱, 로지스틱은 최대우도?</summary><div class="in">
    <p>선형회귀는 "수능 점수 예측"처럼 숫자를 맞히니까 <b>빗나간 거리(오차)</b>를 잴 수 있어요. 오차 제곱 합이 제일 작은 선을 고르는 게 최소제곱법.</p>
    <p>로지스틱은 정답이 0(불합격) 아니면 1(합격)이라 "몇 점 빗나갔나"가 어색해요. 대신 "이 β라면 실제 결과가 나올 확률이 얼마나 높나(그럴듯함)"를 따져요. 그래서 짝이 <b>선형 = 최소제곱, 로지스틱 = 최대우도</b>.</p>
  </div></details>
</section>

      <div class="box" style="border-color:var(--ink);border-width:2px"><div class="coins"><i class="h">앞</i><i class="h">앞</i><i class="h">앞</i><i class="t">뒤</i><i class="t">뒤</i></div><div class="v">0.48</div><p>필기 예제 (앞3, 뒤2)</p></div>
      <div class="box"><div class="coins"><i class="h">앞</i><i class="t">뒤</i><i class="h">앞</i><i class="t">뒤</i></div><div class="v">0.5</div><p>반반, 두 종류일 때 최대로 섞임</p></div>
    </div>
  </div>
  <details open><summary>왜 1 − Σp² 로 계산하나 (수식 몰라도 됨)</summary><div class="in">
    <p>동전을 하나 뽑고 다시 넣고 또 하나 뽑는다고 해 볼게요.</p>
    <div class="calc">
      <div class="ln"><span>둘 다 앞면: 3/5 × 3/5</span><span class="num">9/25</span></div>
      <div class="ln"><span>둘 다 뒷면: 2/5 × 2/5</span><span class="num">4/25</span></div>
      <div class="ln"><span>같은 면 나올 확률 = Σp²</span><span class="num">13/25</span></div>
      <div class="ln"><span>다른 면 나올 확률 = 1 − 13/25 = <b>섞인 정도</b></span><span class="num">12/25 = 0.48</span></div>
    </div>
    <p>그래서 전부 앞면이면 "다른 면 나올 확률"이 0, 깔끔. 엔트로피도 섞인 정도를 다른 공식으로 재는 것이고, 이 동전 예제의 엔트로피는 약 0.97이에요.</p>
  </div></details>

  <p class="linkh">알고리즘 짝 (필기 암기법 그대로)</p>
  <div class="link">
    <div class="row"><span class="term">이름표 나누기</span><span>섞인 정도를 잼 → CHAID <b>카이제곱</b>, CART <b>지니</b>, C4.5/C5.0 <b>엔트로피</b></span></div>
    <div class="row"><span class="term">숫자 나누기</span><span>흩어진 정도를 잼 → CHAID <b>F통계량(ANOVA)</b>, CART <b>분산 감소량</b></span></div>
  </div>
  <div class="two" style="margin-top:12px">
    <div class="box"><span class="tag green">장점</span><h4>화이트박스</h4><p>"왜 위험군?" 질문 경로를 사람이 그대로 읽을 수 있음.</p></div>

  </div>
</section>

<p class="part" id="en">PART 0 · 앙상블 (31쪽)</p>
<section class="ep" id="e1">
  <div class="eph"><span class="no">1화</span><h2>혼자보다 여럿이: 앙상블</h2><span class="pg">31쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>선수 한 명보다 <b>여러 모델 의견을 모으면</b> 더 잘 맞는다. 모으는 방식이 4가지이고, 차이는 <b>"어떻게 공부시키고 어떻게 합치나"</b>.</div>
  <div class="fig">
    <div class="flows">
      <div class="flow">
        <div class="fh"><b>보팅</b><span class="tag green">동시 가능</span></div>
        <div class="fl"><span>모델 A, B, C</span><i>→</i><span>각자 답</span><i>→</i><span class="hi">투표</span></div>

        <div class="fh"><b>배깅</b><span class="tag green">동시 가능</span></div>

        <p>각자 <b>다른 문제집</b>으로 공부한 학생들의 회의. 이름도 Bootstrap + Aggregating(합치기).</p>
      </div>
      <div class="flow">
        <div class="fh"><b>부스팅</b><span class="tag red">순서대로만</span></div>
        <div class="fl"><span>모델 1</span><i>→</i><span>틀린 문제에<br>별표(가중치)</span><i>→</i><span>모델 2가<br>별표 집중</span><i>→</i><span>모델 3 …</span><i>→</i><span class="hi">합치기</span></div>
        <p><b>오답노트 이어 달리기</b>. 앞이 끝나야 뒤가 시작하니 병렬 불가. 틀린 걸 계속 파고들어서 <b>이상치에 민감</b>.</p>

      <div class="flow">

        <div class="fl"><span>모델 A, B, C</span><i>→</i><span>각자 답</span><i>→</i><span class="hi">반장 모델이<br>다시 학습</span></div>
        <p>답을 보고 최종 판단하는 <b>메타 학습기</b>를 하나 더 둠. 단순 투표보다 한 단계 위.</p>

    </div>

  <details><summary>36.8%는 어디서 나온 숫자?</summary><div class="in">
    <p>복원추출로 100번 뽑을 때 특정 학생 한 명이 <b>한 번도 안 뽑힐</b> 확률: 한 번에 안 뽑힐 확률 0.99를 100번 곱하면 약 0.366. 데이터가 엄청 많아지면 약 <b>36.8%</b>로 수렴해요.</p>
    <p>뜻: 가방마다 <b>약 1/3은 공부에 안 쓰이고 남는다</b>. 이 남은 데이터(OOB, Out-Of-Bag)를 공짜 시험지로 써요.</p>

        <text class="svgmut" x="262" y="182" text-anchor="middle">선 굵기 = 얼마나 중요하게 보나 · 빨강 = 점수를 깎는 쪽</text>
      </g>
    </svg>
    <div class="calc">
      <div class="ln"><span>모의고사 0.5 × 중요도 0.6</span><span class="num">+0.3</span></div>
      <div class="ln"><span>결석 0.3 × 중요도 −2.0 (결석은 크게 깎음)</span><span class="num">−0.6</span></div>
      <div class="ln"><span>기본 점수(편향)</span><span class="num">+1.0</span></div>
      <div class="ln"><span>출력</span><span class="num">0.7</span></div>
    </div>
  </div>
  <div class="link">
    <div class="row"><span class="term">가중치 w</span><span>항목을 <b>얼마나 중요하게 볼지</b>. 음수면 깎는 요인. 기계가 학습으로 스스로 정함.</span></div>
    <div class="row"><span class="term">편향 b</span><span>항목과 상관없는 <b>기본 점수</b>. 문턱을 올리거나 내림.</span></div>
  </div>
  <div class="memo">시험 계산 문제는 딱 이 모양이에요. <b>곱하고, 곱하고, 더하기.</b> 음수 가중치 부호만 조심.</div>
</section>

<!-- ============ 3 ============ -->
<section class="ep" id="e3">
  <div class="eph"><span class="no">3화</span><h2>칸 하나로는 못 푸는 문제: XOR</h2><span class="pg">32쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>칸 하나(단층 퍼셉트론)는 <b>직선 한 줄</b>밖에 못 긋는다. 직선 한 줄로 못 가르는 문제(XOR)가 나오자, 중간에 칸을 더 넣어(<b>은닉층</b>) 선을 여러 개 긋게 했다.</div>

      <g stroke="var(--line)" stroke-width="1.5">

        <line x1="60" y1="85" x2="210" y2="25"/><line x1="60" y1="85" x2="210" y2="60"/><line x1="60" y1="85" x2="210" y2="95"/>
        <line x1="210" y1="25" x2="360" y2="60"/><line x1="210" y1="60" x2="360" y2="60"/><line x1="210" y1="95" x2="360" y2="60"/>

      <circle cx="360" cy="60" r="14" fill="var(--ink)"/></g>

  <div class="link">
    <div class="row"><span class="term">다층 퍼셉트론</span><span>입력과 출력 사이에 <b>은닉층</b>을 넣은 것. 선을 여러 개 그어 꺾인 경계(비선형)도 가능.</span></div>
    <div class="row"><span class="term">하이퍼파라미터</span><span>은닉층 몇 층, 칸 몇 개는 <b>사람이 정하는 설정</b>. 가중치는 기계가 배우고, 이건 사람이 정함. 너무 많으면 과적합, 너무 적으면 과소적합.</span></div>
    <div class="row"><span class="term">블랙박스</span><span>숨은 칸 속 계산이 수천 개라 왜 그런 답이 나왔는지 사람이 못 읽음.</span></div>
  </div>

<!-- ============ 4 ============ -->
<section class="ep" id="e4">
  <div class="eph"><span class="no">4화</span><h2>기계가 스스로 중요도를 고치는 법</h2><span class="pg">32쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>앞으로 계산해서 답을 내고(<b>순전파</b>), 틀린 만큼을 뒤로 돌려보내 중요도를 고친다(<b>역전파</b>). 고치는 방향은 <b>비탈 아래쪽으로 한 걸음씩</b>(경사하강법).</div>
  <div class="fig">
    <svg viewBox="0 0 420 150" style="max-width:440px" role="img" aria-label="골짜기 모양 오차 곡선에서 공이 비탈을 따라 조금씩 내려가 가장 낮은 곳에 도착">
      <path d="M20 20 C 100 150, 200 150, 210 130 S 330 40, 400 20" fill="none" stroke="var(--ink)" stroke-width="2.5"/>
      <g fill="var(--omr)"><circle cx="58" cy="62" r="7" opacity=".35"/><circle cx="95" cy="98" r="7" opacity=".55"/><circle cx="135" cy="120" r="7" opacity=".8"/><circle cx="178" cy="131" r="8"/></g>
      <text class="svgtxt" x="40" y="48" font-weight="700">처음 (오차 큼)</text>
      <text class="svgtxt" x="178" y="114" text-anchor="middle" font-weight="700">가장 낮은 곳 = 오차 최소</text>
      <text class="svgmut" x="210" y="146" text-anchor="middle">세로 = 오차(손실) · 가로 = 가중치 값</text>
    </svg>
  </div>
  <div class="say"><p>안개 낀 산에서 길 잃었을 때처럼, 발밑이 기울어진 <b>반대 방향(아래쪽)</b>으로 한 걸음씩 가다 보면 골짜기 바닥(오차가 제일 작은 곳)에 닿아요.</p></div>
  <div class="link">
    <div class="row"><span class="term">손실(오차)</span><span>기계 답과 정답의 차이</span></div>
    <div class="row"><span class="term">역전파</span><span>출력층에서 생긴 오차를 <b>뒤 층부터 앞 층으로</b> 나눠 보내며 각 가중치를 고침 (미분의 연쇄법칙)</span></div>
    <div class="row"><span class="term">기울기 소실</span><span>층이 깊으면 뒤로 보내는 신호가 <b>앞 층에 닿기 전에 거의 0</b>이 되어 앞 층이 학습을 못 함</span></div>
  </div>
  <details open><summary>기울기 소실은 왜 생기나 (말 전달 게임)</summary><div class="in">
    <p>역전파는 층을 하나 지날 때마다 그 층의 <b>기울기를 곱해요</b>. 시그모이드는 기울기가 아무리 커도 <b>0.25</b>예요.</p>
    <div class="calc">
      <div class="ln"><span>2층 지나면 0.25 × 0.25</span><span class="num">0.0625</span></div>
      <div class="ln"><span>5층 지나면</span><span class="num">약 0.001</span></div>
      <div class="ln"><span>10층 지나면</span><span class="num">약 0.000001</span></div>
    </div>
    <p>뒷줄 사람이 속삭인 말이 앞줄에 갈수록 안 들리는 것과 같아요. 그래서 기울기가 1로 유지되는 <b>ReLU</b>를 써서 해결해요.</p>
  </div></details>
</section>

<!-- ============ 5 ============ -->
<section class="ep" id="e5">
  <div class="eph"><span class="no">5화</span><h2>칸마다 붙는 함수 고르기</h2><span class="pg">32쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>숨은 칸에는 <b>신호를 잘 전달하는 함수(ReLU)</b>, 마지막 칸에는 <b>답 모양에 맞는 함수</b>, 채점에는 <b>문제 종류에 맞는 손실함수</b>.</div>
  <div class="fig">
    <svg viewBox="0 0 450 120" style="max-width:480px" role="img" aria-label="세 활성함수 모양: 시그모이드 0에서 1, tanh 마이너스1에서 1, ReLU는 0 아래는 0이고 위로는 직선">
      <g fill="none" stroke-width="2.5">
        <line x1="15" y1="90" x2="135" y2="90" stroke="var(--line)"/>
        <path d="M15 89 L45 87 L65 78 L75 66 L85 50 L95 34 L105 22 L125 14 L135 13" stroke="var(--omr)"/>
        <line x1="165" y1="52" x2="285" y2="52" stroke="var(--line)"/>
        <path d="M165 89 L195 87 L215 78 L225 66 L235 52 L245 38 L255 26 L275 17 L285 15" stroke="var(--violet)"/>
        <line x1="315" y1="90" x2="435" y2="90" stroke="var(--line)"/>
        <path d="M315 90 L375 90 L435 14" stroke="var(--ok)"/>
      </g>
      <text class="svgtxt" x="75" y="110" text-anchor="middle" font-weight="700">시그모이드 0~1</text>
      <text class="svgtxt" x="225" y="110" text-anchor="middle" font-weight="700">tanh −1~1</text>
      <text class="svgtxt" x="375" y="110" text-anchor="middle" font-weight="700">ReLU max(0, x)</text>
    </svg>
    <div class="tblwrap" style="margin-top:10px">
    <table class="act">
      <tr><th>어디에</th><th>무엇을</th><th>왜</th></tr>
      <tr><td>숨은 칸</td><td>시그모이드 → tanh → <b>ReLU</b></td><td>뒤로 갈수록 기울기 소실을 덜 겪음. ReLU는 0보다 크면 그대로 통과라 신호가 안 줄어듦</td></tr>
      <tr><td>마지막 칸</td><td>둘 중 하나: <b>시그모이드</b></td><td>합격/불합격처럼 이진분류. 확률 하나(0~1)</td></tr>
      <tr><td></td><td>여럿 중 하나: <b>소프트맥스</b></td><td>합격 0.7, 추가합격 0.2, 불합격 0.1처럼 <b>확률 합이 1</b></td></tr>
      <tr><td>채점</td><td>숫자 맞히기: <b>MSE</b></td><td>회귀. 빗나간 거리를 제곱해서 평균</td></tr>
      <tr><td></td><td>이름표 맞히기: <b>크로스 엔트로피</b></td><td>분류. <b>확신하면서 틀릴수록</b> 벌점이 크게</td></tr>
    </table>
    </div>
  </div>
  <div class="memo">15장 로지스틱에서 본 시그모이드가 그대로 와요. <b>"둘 중 하나 = 시그모이드, 여럿 중 하나 = 소프트맥스"</b>, <b>"회귀 = MSE, 분류 = 크로스 엔트로피"</b> 두 짝만 남기면 됩니다.</div>
</section>

<p class="part" id="ev">PART 2 · 평가지표 (33쪽)</p>

<!-- ============ 6 ============ -->
<section class="ep" id="e6">
  <div class="eph"><span class="no">6화</span><h2>채점표 한 장: 혼동행렬</h2><span class="pg">33쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>기계가 "합격(양성)"이라고 한 것과 실제 결과를 <b>2×2 칸에 나눠 세기</b>. 이 네 숫자로 모든 지표를 계산한다.</div>
  <div class="fig">
    <div class="cm" role="table" aria-label="혼동행렬: TP 40, FN 20, FP 10, TN 30">
      <div class="corner">실제 ↓<br>예측 →</div>
      <div class="h">기계: "합격"<br>(양성 예측)</div>
      <div class="h">기계: "불합격"<br>(음성 예측)</div>
      <div class="h">실제<br>합격</div>
      <div class="c tp"><span class="nm">TP</span><span class="v">40</span><span class="d">합격이라 했고<br>진짜 합격</span></div>
      <div class="c fn"><span class="nm">FN</span><span class="v">20</span><span class="d">불합격이라 했는데<br>사실 합격 (놓침)</span></div>
      <div class="h">실제<br>불합격</div>
      <div class="c fp"><span class="nm">FP</span><span class="v">10</span><span class="d">합격이라 했는데<br>사실 불합격 (헛짚음)</span></div>
      <div class="c tn"><span class="nm">TN</span><span class="v">30</span><span class="d">불합격이라 했고<br>진짜 불합격</span></div>
    </div>
    <p class="cap">원장님 모델로 학생 100명을 예측해 본 결과 (교재 예제 숫자)</p>
  </div>
  <div class="memo">이름 읽는 법: <b>뒷글자(P/N) = 기계가 한 말</b>, <b>앞글자(T/F) = 그 말이 맞았나</b>. FP는 "틀리게(F) 합격(P)이라 말함" = 헛짚음. FN은 "틀리게 불합격이라 말함" = 놓침.</div>
  <div class="trap">교재마다 가로세로(실제/예측) 배치가 바뀔 수 있어요. 칸 위치로 외우지 말고 <b>이름 읽는 법</b>으로 풀면 배치가 바뀌어도 안 헷갈려요.</div>
</section>

<!-- ============ 7 ============ -->
<section class="ep" id="e7">
  <div class="eph"><span class="no">7화</span><h2>지표는 전부 "어느 줄을 보나"</h2><span class="pg">33쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>모든 지표는 <b>분자 = 맞힌 칸</b>, <b>분모 = 어느 줄 전체</b>. 질문 하나씩만 기억하면 공식은 저절로 나온다.</div>
  <div class="fig">
    <p class="linkh" style="margin-top:0">작은 네모 = 위 채점표에서 분모로 쓰는 칸 (왼위 TP, 오위 FN, 왼아래 FP, 오아래 TN)</p>
    <div class="metric">
      <div class="mrow"><span class="mn"><span class="mini"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span>정확도<small>Accuracy</small></span><span class="mq">전체 중 맞힌 비율은?</span><span class="mv">(40+30)/100<small>= 0.70</small></span></div>
      <div class="mrow"><span class="mn"><span class="mini"><i class="on"></i><i></i><i class="on"></i><i></i></span>정밀도<small>Precision</small></span><span class="mq">기계가 <b>"합격"이라 한 것 중</b> 진짜 합격은? (기계 말 기준, 세로줄)</span><span class="mv">40/(40+10)<small>= 0.80</small></span></div>
      <div class="mrow"><span class="mn"><span class="mini"><i class="on"></i><i class="on"></i><i></i><i></i></span>재현율<small>Recall</small></span><span class="mq"><b>진짜 합격생 중</b> 기계가 찾아낸 비율은? (실제 기준, 가로줄)</span><span class="mv">40/(40+20)<small>≈ 0.67</small></span></div>
      <div class="mrow"><span class="mn"><span class="mini"><i></i><i></i><i class="on"></i><i class="on"></i></span>특이도<small>Specificity</small></span><span class="mq"><b>진짜 불합격생 중</b> 불합격이라 맞힌 비율은?</span><span class="mv">30/(30+10)<small>= 0.75</small></span></div>
      <div class="mrow"><span class="mn"><span class="mini"><i></i><i></i><i class="on"></i><i class="on"></i></span>FPR<small>거짓 경보율</small></span><span class="mq"><b>진짜 불합격생 중</b> 합격이라 헛짚은 비율 = 1 − 특이도</span><span class="mv">10/(10+30)<small>= 0.25</small></span></div>
    </div>
  </div>
  <div class="link">
    <div class="row"><span class="term">재현율의 별명들</span><span>민감도 = TPR = Hit Rate. 전부 "진짜 양성 중 잡아낸 비율". 시험에 "다른 것 고르기"로 나오면 <b>특이도</b>가 정답인 경우가 많음.</span></div>
  </div>
  <div class="memo">정밀도는 <b>FP(헛짚음)</b>가 분모에, 재현율은 <b>FN(놓침)</b>이 분모에. "정밀한 사람은 헛짚지 않고, 재현 잘하는 사람은 놓치지 않는다."</div>
</section>

<!-- ============ 8 ============ -->
<section class="ep" id="e8">
  <div class="eph"><span class="no">8화</span><h2>정밀도와 재현율의 줄다리기, F1</h2><span class="pg">33쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>그물을 넓게 치면 다 잡지만(재현율↑) 쓰레기도 딸려 온다(정밀도↓). 그래서 <b>둘을 같이 보는 점수</b>가 F1.</div>
  <div class="fig">
    <div class="two">
      <div class="box"><span class="tag blue">그물 넓게</span><h4>"조금만 가능성 있어도 합격 예상"</h4><p>진짜 합격생은 거의 다 잡음 → <b>재현율↑</b><br>엉뚱한 학생도 많이 포함 → <b>정밀도↓</b></p></div>
      <div class="box"><span class="tag red">그물 좁게</span><h4>"확실한 학생만 합격 예상"</h4><p>찍은 건 거의 다 맞음 → <b>정밀도↑</b><br>놓친 합격생이 많아짐 → <b>재현율↓</b></p></div>
    </div>
  </div>
  <details open><summary>왜 그냥 평균이 아니라 조화평균인가</summary><div class="in">
    <p>"딱 1명만 확실한 학생을 찍은 모델"을 생각해 볼게요. 정밀도 1.0, 재현율 0.1.</p>
    <div class="calc">
      <div class="ln"><span>그냥 평균 (1.0 + 0.1) ÷ 2</span><span class="num">0.55 (그럴듯해 보임)</span></div>
      <div class="ln"><span>F1 = 2 × 1.0 × 0.1 ÷ (1.0 + 0.1)</span><span class="num">약 0.18 (진짜 실력)</span></div>
    </div>
    <p>조화평균은 <b>둘 중 하나라도 낮으면 확 깎이게</b> 만들어서 한쪽만 잘하는 꼼수를 잡아내요. 교재 예제의 F1은 2 × 0.8 × 0.67 ÷ 1.47 ≈ <b>0.73</b>.</p>
  </div></details>
  <div class="link">
    <div class="row"><span class="term">Fβ</span><span>β가 1보다 크면 <b>재현율</b>을 더 중시, 1보다 작으면 <b>정밀도</b>를 더 중시. (β 크다 → 놓치면 안 된다, 예: 암 검사)</span></div>
  </div>
</section>

<!-- ============ 9 ============ -->
<section class="ep" id="e9">
  <div class="eph"><span class="no">9화</span><h2>한눈에 보는 성적표: ROC와 AUC</h2><span class="pg">33쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>그물 크기를 바꿔 가며 <b>헛짚음(FPR)과 잡아냄(TPR)</b>을 찍은 곡선이 ROC. 곡선 아래 넓이(AUC)가 <b>1에 가까울수록</b> 좋은 모델.</div>
  <div class="fig">
    <svg viewBox="0 0 300 250" style="max-width:340px" role="img" aria-label="ROC 곡선: 왼쪽 위로 볼록할수록 좋고, 대각선은 AUC 0.5 무작위 수준">
      <path d="M50 200 C 60 80, 130 40, 250 30 L250 200 Z" fill="var(--ok-soft)"/>
      <line x1="50" y1="200" x2="250" y2="200" stroke="var(--ink)" stroke-width="1.5"/>
      <line x1="50" y1="200" x2="50" y2="30" stroke="var(--ink)" stroke-width="1.5"/>
      <line x1="50" y1="200" x2="250" y2="30" stroke="var(--muted)" stroke-dasharray="5 4" stroke-width="1.5"/>
      <path d="M50 200 C 60 80, 130 40, 250 30" fill="none" stroke="var(--ok)" stroke-width="3"/>
      <circle cx="50" cy="30" r="5" fill="var(--omr)"/>
      <text x="58" y="24" font-size="12" font-family="var(--font)" font-weight="700" fill="var(--omr)">완벽 (AUC 1)</text>
      <text class="svgtxt" x="150" y="150" font-weight="700">AUC</text>
      <text class="svgmut" x="180" y="128" transform="rotate(-40 180 128)">찍기 수준 (AUC 0.5)</text>
      <text class="svgtxt" x="150" y="222" text-anchor="middle" font-weight="700">x축 FPR (헛짚음) = 1 − 특이도</text>
      <text class="svgtxt" x="20" y="115" text-anchor="middle" font-weight="700" transform="rotate(-90 20 115)">y축 TPR (잡아냄) = 민감도</text>
      <text class="svgmut" x="50" y="214" text-anchor="middle">0</text>
      <text class="svgmut" x="250" y="214" text-anchor="middle">1</text>
      <text class="svgmut" x="40" y="34" text-anchor="end">1</text>
    </svg>
  </div>
  <div class="say"><p>좋은 모델은 헛짚음은 적게(왼쪽), 잡아냄은 많이(위쪽). 그래서 <b>왼쪽 위로 볼록할수록</b> 좋고, 그 아래 초록 넓이(AUC)가 커져요. 대각선은 동전 던지기로 찍는 수준이라 0.5.</p></div>
  <div class="link">
    <div class="row"><span class="term">AUC 범위</span><span>0.5 ~ 1. <b>1에 가까울수록</b> 좋음</span></div>
    <div class="row"><span class="term">이익도표</span><span>Lift Chart. 확률 높은 순으로 고객을 줄 세워 등급별 반응률, 반응검출률, 리프트(향상도)를 표로 본 것. 그래프로 그리면 향상도 곡선.</span></div>
  </div>
  <div class="trap">ROC 축은 <b>x = FPR(1 − 특이도), y = TPR(민감도)</b>. 반대로 적은 보기가 자주 함정으로 나와요.</div>
</section>

    <details><summary>랜덤포레스트는 화이트박스? 블랙박스? 과적합에는?</summary><div class="in"><p><b>블랙박스</b>, 분산이 줄어 <b>과적합에 강함</b>. 화이트박스는 나무 한 그루.</p></div></details>

    <details><summary>기울기 소실을 해결하는 활성함수는? 원인 함수는?</summary><div class="in"><p>해결 <b>ReLU</b>, 원인 <b>시그모이드</b>(기울기 최대 0.25라 곱할수록 0에 가까워짐).</p></div></details>
    <details><summary>정밀도와 재현율은 각각?</summary><div class="in"><p>정밀도 = 합격이라 한 50명 중 진짜 40 → <b>0.80</b>. 재현율 = 진짜 합격 60명 중 찾아낸 40 → <b>약 0.67</b>.</p></div></details>

  </div>

    <h3>16장 한 문장</h3>

</section>

  <h1>원장님의 반 편성: 정답 없이 끼리끼리 묶기</h1>
  <p>15장 1화에서 원장님은 "정답지가 있느냐 없느냐"로 길을 둘로 나눴어요. 그때 미뤄 둔 <b>정답 없는 공부(비지도학습)</b>의 본편이 17장(군집)과 18장(연관)이에요. 이번엔 합격/불합격 이름표 없이, 학생들을 <b>비슷한 유형끼리 묶어 반을 편성</b>합니다.</p>
  <div class="speed">

    <div><b>보통 25분</b>필기 연결 칸까지</div>
    <div><b>여유 있을 때</b>회색 칸(+)도 펼치기</div>
  </div>

<section class="ep" id="e1">
  <div class="eph"><span class="no">1화</span><h2>정답 없이 반을 나눠야 한다</h2><span class="pg">34쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>"이 학생은 무슨 유형"이라는 <b>정답이 없다</b>. 그래서 기계에게 맞히라고 할 수 없고, <b>서로 가까운 학생끼리 묶어 보라</b>고 한다. 이게 군집분석.</div>

chor="end">평소 공부 시간 →</text><text class="svgmut" x="11" y="100" text-anchor="middle" transform="rotate(-90 11 100)">시험 직전 몰아치기 →</text></svg>
    <p class="cap">점 하나 = 학생 한 명. 원장님은 이름표를 준 적 없어요. 점이 모여 있는 모양만 보고 묶었어요.</p>
  </div>
  <div class="say"><p>15장 합격 예측은 과거 합격/불합격 기록(정답)이 있어서 채점이 됐어요. 반 편성엔 그런 정답이 없어요. 그래서 할 일이 셋으로 바뀌어요: <b>얼마나 비슷한지 재기</b>, <b>묶는 방법 고르기</b>, <b>잘 묶였는지 확인하기</b>.</p></div>
  <div class="fig">

      <div class="box"><span class="tag blue">계층적</span><h4>가까운 둘부터 차례로 합치기</h4><p>1명씩 따로 시작해서 제일 가까운 둘을 합치고, 또 합치고. 결과가 <b>나무 그림(덴드로그램)</b>으로 남아요. 반 개수는 나중에 정함.</p></div>

    </div>
  </div>
  <div class="link">
    <div class="row"><span class="term">군집분석</span><span>정답 없이 <b>거리나 유사성</b>을 기준으로 비슷한 것끼리 묶는 분석. 비지도학습.</span></div>

<!-- ============ 2 ============ -->
<section class="ep" id="e2">
  <div class="eph"><span class="no">2화</span><h2>"비슷하다"를 숫자로: 거리 재기</h2><span class="pg">34쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>비슷한지 아닌지를 눈대중으로 할 순 없으니 <b>거리</b>로 잰다. 가까우면 비슷. 재는 방법이 여럿인 건 <b>"어떤 길로 가느냐"</b>가 다르기 때문.</div>
  <div class="fig">
    <svg viewBox="0 0 300 210" style="max-width:360px" role="img" aria-label="A(1,2)에서 B(4,4)까지: 직선은 루트13, 바둑판 길은 3 더하기 2는 5, 더 큰 차이는 3"><line x1="40" y1="186" x2="40" y2="36" stroke="var(--line)"/><line x1="40" y1="186" x2="260" y2="186" stroke="var(--line)"/><text class="svgmut" x="40" y="200" text-anchor="middle">0</text><line x1="84" y1="186" x2="84" y2="36" stroke="var(--line)"/><line x1="40" y1="156" x2="260" y2="156" stroke="var(--line)"/><text class="svgmut" x="84" y="200" text-anchor="middle">1</text><text class="svgmut" x="32" y="160" text-anchor="end">1</text><line x1="128" y1="186" x2="128" y2="36" stroke="var(--line)"/><line x1="40" y1="126" x2="260" y2="126" stroke="var(--line)"/><text class="svgmut" x="128" y="200" text-anchor="middle">2</text><text class="svgmut" x="32" y="130" text-anchor="end">2</text><line x1="172" y1="186" x2="172" y2="36" stroke="var(--line)"/><line x1="40" y1="96" x2="260" y2="96" stroke="var(--line)"/><text class="svgmut" x="172" y="200" text-anchor="middle">3</text><text class="svgmut" x="32" y="100" text-anchor="end">3</text><line x1="216" y1="186" x2="216" y2="36" stroke="var(--line)"/><line x1="40" y1="66" x2="260" y2="66" stroke="var(--line)"/><text class="svgmut" x="216" y="200" text-anchor="middle">4</text><text class="svgmut" x="32" y="70" text-anchor="end">4</text><line x1="260" y1="186" x2="260" y2="36" stroke="var(--line)"/><line x1="40" y1="36" x2="260" y2="36" stroke="var(--line)"/><text class="svgmut" x="260" y="200" text-anchor="middle">5</text><text class="svgmut" x="32" y="40" text-anchor="end">5</text><path d="M84 126 L216 126 L216 66" fill="none" stroke="var(--blue)" stroke-width="4"/><line x1="84" y1="126" x2="216" y2="66" stroke="var(--omr)" stroke-width="3"/><circle cx="84" cy="126" r="7" fill="var(--ink)"/><circle cx="216" cy="66" r="7" fill="var(--ink)"/><text class="svgtxt" x="76" y="116" text-anchor="end" font-weight="700">A (1, 2)</text><text class="svgtxt" x="216" y="54" text-anchor="middle" font-weight="700">B (4, 4)</text><text x="150" y="144" text-anchor="middle" fill="var(--blue)" font-size="12" font-weight="700">가로 차 3 (가장 큼)</text><text x="224" y="100" fill="var(--blue)" font-size="12" font-weight="700">세로 차 2</text><text x="132" y="92" text-anchor="end" fill="var(--omr)" font-size="12" font-weight="700">직선 √13</text></svg>
    <p class="cap">학생 A(1, 2)와 B(4, 4). 가로, 세로는 두 과목 점수(등급)라고 생각하세요.</p>
    <div class="calc">
      <div class="ln"><span>가로 차이 |4 − 1|, 세로 차이 |4 − 2|</span><span class="num">3, 2</span></div>
      <div class="ln"><span><b>유클리디안</b>: 대각선으로 곧장 √(3² + 2²) = √(9 + 4)</span><span class="num">√13 ≈ 3.61</span></div>
      <div class="ln"><span><b>맨하튼</b>: 바둑판 길 따라 3 + 2</span><span class="num">5</span></div>
      <div class="ln"><span><b>체비셰프</b>: 차이 중 가장 큰 것 max(3, 2)</span><span class="num">3</span></div>
    </div>
  </div>
  <div class="link">
    <div class="row"><span class="term">유클리디안</span><span>자로 잰 <b>직선거리</b>. 차이를 제곱해 더하고 루트. √Σ(xᵢ − yᵢ)²</span></div>
    <div class="row"><span class="term">맨하튼</span><span>뉴욕 맨해튼 바둑판 도로처럼 <b>꺾어 가는 거리</b>. 차이의 절댓값을 그냥 더함.</span></div>
    <div class="row"><span class="term">체비셰프</span><span>차이 중 <b>최댓값</b> 하나만. "제일 많이 차이 나는 과목이 몇 점 차?"</span></div>
    <div class="row"><span class="term">민코우스키</span><span>위 거리들을 한 공식으로 묶은 것. <b>m = 1이면 맨하튼, m = 2면 유클리디안</b>.</span></div>
  </div>
  <details><summary>민코우스키의 m을 키우면 어떻게 되나</summary><div class="in">
    <p>공식은 (Σ|차이|ᵐ)^(1/m). m이 커질수록 큰 차이가 점점 더 크게 반영돼서, 결국 가장 큰 차이 하나만 남아요. 그게 체비셰프예요.</p>
    <div class="calc">
      <div class="ln"><span>m = 1 (맨하튼)</span><span class="num">5</span></div>
      <div class="ln"><span>m = 2 (유클리디안)</span><span class="num">≈ 3.61</span></div>
      <div class="ln"><span>m = 3</span><span class="num">≈ 3.27</span></div>
      <div class="ln"><span>m = 10</span><span class="num">≈ 3.005</span></div>
      <div class="ln"><span>m을 끝없이 키우면 (체비셰프)</span><span class="num">3</span></div>
    </div>
  </div></details>
  <div class="memo">세 숫자 크기 순서는 늘 <b>맨하튼 ≥ 유클리디안 ≥ 체비셰프</b>. 꺾어 가면 제일 멀고, 곧장 가면 그보다 짧고, 한 과목만 보면 제일 짧아요. 계산 답이 이 순서가 아니면 다시 보세요.</div>
</section>

<!-- ============ 3 ============ -->
<section class="ep" id="e3">
  <div class="eph"><span class="no">3화</span><h2>자가 이상하게 휘는 경우: 단위, 상관, 범주</h2><span class="pg">34쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>그냥 재면 <b>단위가 큰 항목이 거리를 독차지</b>하고, <b>같이 움직이는 항목</b>은 두 번 세어진다. 그래서 표준화 거리, 마할라노비스. 숫자가 아닌 항목은 <b>겹치는 비율</b>(자카드, 코사인)로 잰다.</div>

  <p class="linkh">곤란 1. 단위가 다르면 (표준화 거리)</p>
  <div class="fig">
    <div class="two">
      <div class="box"><span class="tag red">그냥 재면</span><h4>모의고사 총점이 다 정함</h4><p>A와 B: 자습 10시간 차, 총점 10점 차 → 약 <b>14.1</b><br>A와 C: 자습 1시간 차, 총점 40점 차 → 약 <b>40.0</b><br>"C가 훨씬 다르다"</p></div>
      <div class="box"><span class="tag green">표준화하고 재면</span><h4>각 항목의 보통 흩어짐으로 나눔</h4><p>자습은 5시간, 총점은 50점이 보통 차이라고 하면<br>A와 B: √(2² + 0.2²) ≈ <b>2.01</b><br>A와 C: √(0.2² + 0.8²) ≈ <b>0.82</b><br>"B가 더 다르다"로 뒤집힘</p></div>
    </div>
    <p class="cap">총점 40점 차이는 흔한 일이고, 자습 10시간 차이는 큰 일이에요. 표준화하면 그 감각이 숫자에 반영돼요.</p>
  </div>

  <p class="linkh">곤란 2. 항목끼리 같이 움직이면 (마할라노비스)</p>
  <div class="fig">
    <svg viewBox="0 0 300 210" style="max-width:360px" role="img" aria-label="수학과 과학 점수가 함께 움직이는 길쭉한 무리. 중심에서 같은 직선거리라도 무리 방향의 P는 흔하고, 가로지른 Q는 드묾"><line x1="30" y1="190" x2="290" y2="190" stroke="var(--line)"/><line x1="30" y1="190" x2="30" y2="10" stroke="var(--line)"/><text class="svgmut" x="286" y="204" text-anchor="end">수학 점수 →</text><text class="svgmut" x="36" y="20">↑ 과학 점수</text><ellipse cx="150" cy="104" rx="92" ry="28" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.5" transform="rotate(-35 150 104)"/><circle cx="146" cy="113" r="3" fill="var(--blue)"/><circle cx="142" cy="106" r="3" fill="var(--blue)"/><circle cx="123" cy="120" r="3" fill="var(--blue)"/><circle cx="183" cy="86" r="3" fill="var(--blue)"/><circle cx="180" cy="86" r="3" fill="var(--blue)"/><circle cx="162" cy="98" r="3" fill="var(--blue)"/><circle cx="109" cy="143" r="3" fill="var(--blue)"/><circle cx="167" cy="98" r="3" fill="var(--blue)"/><circle cx="93" cy="123" r="3" fill="var(--blue)"/><circle cx="123" cy="118" r="3" fill="var(--blue)"/><circle cx="158" cy="98" r="3" fill="var(--blue)"/><circle cx="161" cy="89" r="3" fill="var(--blue)"/><circle cx="161" cy="101" r="3" fill="var(--blue)"/><circle cx="141" cy="131" r="3" fill="var(--blue)"/><circle cx="172" cy="103" r="3" fill="var(--blue)"/><circle cx="128" cy="110" r="3" fill="var(--blue)"/><circle cx="140" cy="110" r="3" fill="var(--blue)"/><circle cx="169" cy="94" r="3" fill="var(--blue)"/><circle cx="132" cy="105" r="3" fill="var(--blue)"/><circle cx="143" cy="124" r="3" fill="var(--blue)"/><circle cx="129" cy="122" r="3" fill="var(--blue)"/><circle cx="153" cy="83" r="3" fill="var(--blue)"/><circle cx="159" cy="114" r="3" fill="var(--blue)"/><circle cx="92" cy="141" r="3" fill="var(--blue)"/><circle cx="142" cy="99" r="3" fill="var(--blue)"/><circle cx="163" cy="94" r="3" fill="var(--blue)"/><circle cx="114" cy="139" r="3" fill="var(--blue)"/><circle cx="174" cy="99" r="3" fill="var(--blue)"/><circle cx="192" cy="79" r="3" fill="var(--blue)"/><circle cx="146" cy="91" r="3" fill="var(--blue)"/><circle cx="164" cy="87" r="3" fill="var(--blue)"/><circle cx="130" cy="102" r="3" fill="var(--blue)"/><circle cx="120" cy="119" r="3" fill="var(--blue)"/><circle cx="174" cy="62" r="3" fill="var(--blue)"/><circle cx="150" cy="104" r="60" fill="none" stroke="var(--muted)" stroke-dasharray="4 4"/><circle cx="150" cy="104" r="4" fill="var(--ink)"/><circle cx="199" cy="70" r="7" fill="var(--ok)"/><circle cx="184" cy="153" r="7" fill="var(--omr)"/><text class="svgtxt" x="209" y="64" font-weight="700">P 흔함</text><text class="svgtxt" x="194" y="157" font-weight="700">Q 드묾</text><text class="svgmut" x="88" y="180">점선 원: 중심에서 직선거리가 같음</text></svg>
    <p class="cap">수학 잘하는 학생은 과학도 잘하는 편이라 무리가 비스듬히 길쭉해요. P와 Q는 중심에서 자로 잰 거리가 같지만, P는 무리 방향이라 흔한 학생, Q는 "수학은 높은데 과학은 낮은" 드문 학생이에요.</p>
  </div>

  <p class="linkh">곤란 3. 숫자가 아니면 (범주형: 자카드, 코사인)</p>
  <div class="fig">
    <div class="two">
      <div class="box"><h4>자카드 유사도</h4><p>학생1 수강: 국, 영, 수, 과<br>학생2 수강: 영, 수, 사<br>겹침 2과목 ÷ 둘 중 하나라도 들은 5과목 = <b>0.4</b></p></div>

    </div>
  </div>
  <div class="link">
    <div class="row"><span class="term">표준화 거리</span><span>항목마다 <b>스케일(단위)을 맞춘 뒤</b> 잰 거리</span></div>
    <div class="row"><span class="term">마할라노비스</span><span>표준화 + <b>변수 간 상관관계</b>까지 고려한 거리. 무리 모양을 따라 재는 자.</span></div>
    <div class="row"><span class="term">자카드</span><span>|A∩B| / |A∪B|. 겹친 것 ÷ 합친 것. 범주형 유사도.</span></div>
    <div class="row"><span class="term">코사인</span><span>A·B / (|A||B|). 두 줄이 <b>같은 방향</b>을 가리키는 정도. 1이면 완전히 같은 방향.</span></div>
  </div>
  <div class="trap">자카드, 코사인은 <b>유사도</b>라서 <b>클수록 비슷</b>해요. 유클리디안 같은 거리는 <b>작을수록 비슷</b>. 방향이 반대예요.</div>
</section>

<section class="ep" id="e4">
  <div class="eph"><span class="no">4화</span><h2>가까운 둘부터 합치기: 덴드로그램</h2><span class="pg">34쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>반 개수를 몰라도 된다. 제일 가까운 둘을 합치는 걸 <b>끝까지 반복</b>하고 그 과정을 나무로 그려 두면, 나중에 <b>원하는 높이에서 가위질</b>해 반 수를 정한다.</div>
  <div class="fig">
    <p class="linkh" style="margin-top:0">학생 5명의 모의고사 점수: A 40, B 44, C 60, D 66, E 95</p>
    <div class="calc">
      <div class="ln"><span>① 제일 가까운 A와 B (44 − 40)</span><span class="num">4에서 합침</span></div>

      <div class="ln"><span>③ AB 무리와 CD 무리 (가장 가까운 44와 60)</span><span class="num">16에서 합침</span></div>
      <div class="ln"><span>④ 마지막으로 E (95와 가장 가까운 66)</span><span class="num">29에서 합침</span></div>
    </div>
    <svg viewBox="0 0 432 214" style="max-width:440px" role="img" aria-label="덴드로그램: A와 B가 4, C와 D가 6, 두 묶음이 16, E가 29에서 합쳐짐. 높이 15에서 자르면 3개, 25에서 자르면 2개"><line x1="36" y1="178" x2="36" y2="18" stroke="var(--line)"/><text class="svgmut" x="31" y="182" text-anchor="end">0</text><line x1="33" y1="178" x2="36" y2="178" stroke="var(--line)"/><text class="svgmut" x="31" y="132" text-anchor="end">10</text><line x1="33" y1="128" x2="36" y2="128" stroke="var(--line)"/><text class="svgmut" x="31" y="82" text-anchor="end">20</text><line x1="33" y1="78" x2="36" y2="78" stroke="var(--line)"/><text class="svgmut" x="31" y="32" text-anchor="end">30</text><line x1="33" y1="28" x2="36" y2="28" stroke="var(--line)"/><text class="svgmut" x="12" y="98" text-anchor="middle" transform="rotate(-90 12 98)">합칠 때 거리(높이)</text><path d="M70 178 L70 158 L120 158 L120 178" fill="none" stroke="var(--ink)" stroke-width="2"/><path d="M180 178 L180 148 L230 148 L230 178" fill="none" stroke="var(--ink)" stroke-width="2"/><path d="M95 158 L95 98 L205 98 L205 148" fill="none" stroke="var(--ink)" stroke-width="2"/><path d="M150 98 L150 33 L300 33 L300 178" fill="none" stroke="var(--ink)" stroke-width="2"/><line x1="40" y1="103" x2="318" y2="103" stroke="var(--omr)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="322" y="107" fill="var(--omr)" font-size="11.5" font-weight="700">15에서 자르면 3개</text><line x1="40" y1="53" x2="318" y2="53" stroke="var(--omr)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="322" y="57" fill="var(--omr)" font-size="11.5" font-weight="700">25에서 자르면 2개</text><text class="svgtxt" x="70" y="194" text-anchor="middle" font-weight="700">A</text><text class="svgmut" x="70" y="208" text-anchor="middle">40점</text><text class="svgtxt" x="120" y="194" text-anchor="middle" font-weight="700">B</text><text class="svgmut" x="120" y="208" text-anchor="middle">44점</text><text class="svgtxt" x="180" y="194" text-anchor="middle" font-weight="700">C</text><text class="svgmut" x="180" y="208" text-anchor="middle">60점</text><text class="svgtxt" x="230" y="194" text-anchor="middle" font-weight="700">D</text><text class="svgmut" x="230" y="208" text-anchor="middle">66점</text><text class="svgtxt" x="300" y="194" text-anchor="middle" font-weight="700">E</text><text class="svgmut" x="300" y="208" text-anchor="middle">95점</text><rect x="86" y="141" width="18" height="13" fill="var(--surface)"/><text class="svgmut" x="95" y="152" text-anchor="middle">4</text><rect x="196" y="131" width="18" height="13" fill="var(--surface)"/><text class="svgmut" x="205" y="142" text-anchor="middle">6</text><rect x="141" y="81" width="18" height="13" fill="var(--surface)"/><text class="svgmut" x="150" y="92" text-anchor="middle">16</text><rect x="216" y="16" width="18" height="13" fill="var(--surface)"/><text class="svgmut" x="225" y="27" text-anchor="middle">29</text></svg>
    <p class="cap">세로 높이 = 합칠 때의 거리. 빨간 점선으로 자른 아래쪽 줄기 수가 반 개수.</p>
  </div>
  <div class="calc" style="margin-top:12px">
    <div class="ln"><span>높이 15에서 자르면: AB, CD, E</span><span class="num">3개 반</span></div>
    <div class="ln"><span>높이 25에서 자르면: ABCD, E</span><span class="num">2개 반</span></div>
  </div>
  <div class="link">
    <div class="row"><span class="term">덴드로그램</span><span>계층적 군집 결과를 그린 <b>나무 모양 그림</b>. Dendro = 나무.</span></div>
    <div class="row"><span class="term">병합 / 분할</span><span>1명씩에서 합쳐 올라가면 병합(응집형), 전체 한 덩어리에서 쪼개 내려가면 분할형.</span></div>
  </div>
  <div class="trap"><b>낮게 자를수록 반이 많아지고</b>, 높게 자를수록 반이 줄어요. 높이 15 → 3개, 25 → 2개. 그리고 한 번 합친 학생은 계층적 방법에선 <b>다시 떼어 내지 않아요</b>(K-means와 다른 점).</div>
</section>

<!-- ============ 5 ============ -->
<section class="ep" id="e5">
  <div class="eph"><span class="no">5화</span><h2>무리와 무리 사이 거리는 어디로 재나: 연결법</h2><span class="pg">35쪽</span></div>

<line x1="121" y1="240" x2="121" y2="248" stroke="var(--ink)" stroke-width="2.5"/><line x1="300" y1="240" x2="300" y2="248" stroke="var(--ink)" stroke-width="2.5"/><text class="svgtxt" x="210" y="238" text-anchor="middle" font-weight="700">21</text><text class="svgtxt" x="4" y="340" font-weight="700">와드</text><text class="svgmut" x="4" y="354">편차 제곱합</text><line x1="78" y1="336" x2="359" y2="336" stroke="var(--line)"/><circle cx="104" cy="336" r="6" fill="var(--violet)"/><circle cx="138" cy="336" r="6" fill="var(--violet)"/><circle cx="274" cy="336" r="6" fill="var(--violet)"/><circle cx="325" cy="336" r="6" fill="var(--violet)"/><line x1="210" y1="320" x2="210" y2="346" stroke="var(--violet)" stroke-width="2" stroke-dasharray="3 3"/><text class="svgtxt" x="210" y="316" text-anchor="middle" font-weight="700">합친 평균 52.5</text><text class="svgmut" x="210" y="360" text-anchor="middle">합치면 흩어짐(제곱합)이 26 → 467, 441 증가</text></svg>
    <p class="cap">빨강 무리 AB(40, 44)와 파랑 무리 CD(60, 66). 같은 두 무리인데 기준마다 거리가 16, 26, 21로 달라요.</p>

  <div class="tblwrap" style="margin-top:10px">
    <table class="act">
      <tr><th>연결법</th><th>무엇을 재나</th><th>예시 계산</th></tr>
      <tr><td>최단(단일) 연결법</td><td>두 무리에서 <b>가장 가까운</b> 두 학생</td><td>60 − 44 = 16</td></tr>
      <tr><td>최장(완전) 연결법</td><td>두 무리에서 <b>가장 먼</b> 두 학생</td><td>66 − 40 = 26</td></tr>
      <tr><td>평균 연결법</td><td><b>모든 쌍</b> 거리의 평균</td><td>(20 + 26 + 16 + 22) ÷ 4 = 21</td></tr>
      <tr><td>중심 연결법</td><td>두 무리 <b>중심점</b> 사이</td><td>63 − 42 = 21</td></tr>
      <tr><td>와드 연결법</td><td>합쳤을 때 <b>편차 제곱합이 얼마나 늘어나나</b></td><td>8 + 18 = 26 → 467, 441 증가</td></tr>
    </table>
  </div>
  <details><summary>와드의 제곱합 계산 (몰라도 됨, 뜻만)</summary><div class="in">
    <p>"제곱합"은 반 평균에서 학생들이 얼마나 흩어져 있나를 재는 점수예요. 작을수록 반이 똘똘 뭉친 것.</p>
    <div class="calc">
      <div class="ln"><span>AB반: 평균 42, (40−42)² + (44−42)²</span><span class="num">8</span></div>
      <div class="ln"><span>CD반: 평균 63, (60−63)² + (66−63)²</span><span class="num">18</span></div>
      <div class="ln"><span>합친 반: 평균 52.5, 12.5² + 8.5² + 7.5² + 13.5²</span><span class="num">467</span></div>
      <div class="ln"><span>합쳐서 늘어난 흩어짐 = 와드가 보는 값</span><span class="num">467 − 26 = 441</span></div>
    </div>
    <p>와드는 후보 짝마다 이 "늘어난 양"을 계산해서 <b>가장 조금 늘어나는 짝부터</b> 합쳐요. 반이 덜 망가지게.</p>
  </div></details>
  <div class="link">
    <div class="row"><span class="term">최단 연결</span><span>가까운 놈끼리만 보니 무리가 <b>사슬처럼 길게</b> 이어지기 쉬움</span></div>
    <div class="row"><span class="term">최장 연결</span><span>가장 먼 놈까지 가까워야 합치니 <b>둥글고 촘촘한</b> 무리</span></div>
    <div class="row"><span class="term">와드 연결</span><span>거리가 아니라 <b>제곱합(편차 제곱합, 오차 제곱합) 증가량</b>이 최소인 쪽으로</span></div>
  </div>
  <div class="memo">"<b>제곱합</b>"이라는 말이 보이면 무조건 <b>와드</b>. 최단 = 단일(single), 최장 = 완전(complete). "완전히 다 가까워야 합친다"라서 최장이 완전 연결.</div>
  <div class="trap">이 예제에선 평균 연결과 중심 연결이 둘 다 21로 같게 나왔지만 <b>재는 대상이 달라요</b>. 평균은 학생 쌍 4개를 다 재서 평균, 중심은 무리마다 중심점 하나씩 찍고 그 둘만 잼.</div>
</section>

  <div class="say"><p>나 학생은 처음엔 파랑 반이었다가 중심이 옮겨 가자 빨강 반으로 갔어요. K-means에선 <b>한 번 배정돼도 다른 반으로 옮길 수 있어요</b>. 계층적 방법과 반대예요.</p></div>
  <div class="two" style="margin-top:12px">
    <div class="box"><span class="tag red">약점 1</span><h4>처음 중심을 어디 찍나에 따라 결과가 바뀜</h4><p>초기 중심점에 민감. 그래서 여러 번 돌려 보고 제일 나은 걸 고르기도 해요.</p></div>
    <div class="box"><span class="tag red">약점 2</span><h4>이상치에 끌려감</h4><p>평균은 튀는 값 하나에 확 끌려가요. 점수 50, 52, 54, 56, <b>98</b>이면 평균 62. 아무 학생과도 안 가까운 자리.</p></div>
  </div>
  <div class="link">
    <div class="row"><span class="term">K 사전 지정</span><span>반 개수 <b>K를 미리 지정</b>해야 함. 어떻게 정하나는 9화 Elbow Method.</span></div>
    <div class="row"><span class="term">K-medoids</span><span>중심을 평균 대신 <b>실제 학생 한 명</b>으로. 위 예에서 54점 학생이 중심(다른 학생과 거리 합 52로 최소). 98에 덜 끌려가서 <b>이상치에 강건</b>.</span></div>
    <div class="row"><span class="term">K-modes</span><span>범주형 자료용. 평균 대신 <b>최빈값</b>(가장 많이 나온 값)을 중심으로.</span></div>
  </div>
  <div class="trap">"K-means는 한 번 할당된 데이터가 다른 군집으로 <b>이동할 수 없다</b>" → <b>틀린 말</b>. 중심이 바뀌면 이동해요.</div>
</section>

<!-- ============ 7 ============ -->
<section class="ep" id="e7">
  <div class="eph"><span class="no">7화</span><h2>반 모양이 동그랗지 않으면: DBSCAN</h2><span class="pg">35쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>K-means는 중심에서 가까운 순으로 자르니 <b>동그란 무리</b>만 잘 찾는다. 초승달처럼 휜 무리나 외톨이가 있으면 망가진다. DBSCAN은 <b>촘촘하게 이어진 곳(밀도)</b>을 따라 번져 나가며 묶는다.</div>
  <div class="fig">
    <div class="two">
      <svg viewBox="0 0 280 196" role="img" aria-label="K-means: 중심 기준으로 자름. 초승달 모양을 반씩 잘라 버림"><text class="svgtxt" x="140" y="16" text-anchor="middle" font-weight="700">K-means: 중심 기준으로 자름</text><circle cx="165" cy="105" r="5" fill="var(--omr)"/><circle cx="162" cy="88" r="5" fill="var(--omr)"/><circle cx="154" cy="73" r="5" fill="var(--omr)"/><circle cx="142" cy="61" r="5" fill="var(--blue)"/><circle cx="127" cy="53" r="5" fill="var(--blue)"/><circle cx="110" cy="50" r="5" fill="var(--blue)"/><circle cx="93" cy="53" r="5" fill="var(--blue)"/><circle cx="78" cy="61" r="5" fill="var(--blue)"/><circle cx="66" cy="73" r="5" fill="var(--blue)"/><circle cx="58" cy="88" r="5" fill="var(--blue)"/><circle cx="55" cy="105" r="5" fill="var(--blue)"/><circle cx="110" cy="78" r="5" fill="var(--blue)"/><circle cx="113" cy="94" r="5" fill="var(--blue)"/><circle cx="121" cy="110" r="5" fill="var(--blue)"/><circle cx="133" cy="122" r="5" fill="var(--omr)"/><circle cx="148" cy="130" r="5" fill="var(--omr)"/><circle cx="165" cy="132" r="5" fill="var(--omr)"/><circle cx="182" cy="130" r="5" fill="var(--omr)"/><circle cx="197" cy="122" r="5" fill="var(--omr)"/><circle cx="209" cy="110" r="5" fill="var(--omr)"/><circle cx="217" cy="94" r="5" fill="var(--omr)"/><circle cx="220" cy="78" r="5" fill="var(--omr)"/><circle cx="260" cy="35" r="5" fill="var(--omr)"/><circle cx="40" cy="155" r="5" fill="var(--blue)"/><text class="svgmut" x="140" y="188" text-anchor="middle">초승달 모양을 반씩 잘라 버림</text></svg>
      <svg viewBox="0 0 280 196" role="img" aria-label="DBSCAN: 촘촘하게 이어진 곳끼리. 모양대로 2개 + 외톨이는 노이즈"><text class="svgtxt" x="140" y="16" text-anchor="middle" font-weight="700">DBSCAN: 촘촘하게 이어진 곳끼리</text><circle cx="110" cy="50" r="24" fill="var(--amber-soft)" stroke="var(--amber)" stroke-width="1.5"/><circle cx="165" cy="105" r="5" fill="var(--omr)"/><circle cx="162" cy="88" r="5" fill="var(--omr)"/><circle cx="154" cy="73" r="5" fill="var(--omr)"/><circle cx="142" cy="61" r="5" fill="var(--omr)"/><circle cx="127" cy="53" r="5" fill="var(--omr)"/><circle cx="110" cy="50" r="5" fill="var(--omr)"/><circle cx="93" cy="53" r="5" fill="var(--omr)"/><circle cx="78" cy="61" r="5" fill="var(--omr)"/><circle cx="66" cy="73" r="5" fill="var(--omr)"/><circle cx="58" cy="88" r="5" fill="var(--omr)"/><circle cx="55" cy="105" r="5" fill="var(--omr)"/><circle cx="110" cy="78" r="5" fill="var(--blue)"/><circle cx="113" cy="94" r="5" fill="var(--blue)"/><circle cx="121" cy="110" r="5" fill="var(--blue)"/><circle cx="133" cy="122" r="5" fill="var(--blue)"/><circle cx="148" cy="130" r="5" fill="var(--blue)"/><circle cx="165" cy="132" r="5" fill="var(--blue)"/><circle cx="182" cy="130" r="5" fill="var(--blue)"/><circle cx="197" cy="122" r="5" fill="var(--blue)"/><circle cx="209" cy="110" r="5" fill="var(--blue)"/><circle cx="217" cy="94" r="5" fill="var(--blue)"/><circle cx="220" cy="78" r="5" fill="var(--blue)"/><circle cx="260" cy="35" r="8" fill="none" stroke="var(--ink)" stroke-width="1.5"/><circle cx="40" cy="155" r="8" fill="none" stroke="var(--ink)" stroke-width="1.5"/><circle cx="260" cy="35" r="5" fill="var(--muted)"/><circle cx="40" cy="155" r="5" fill="var(--muted)"/><text class="svgmut" x="252" y="58" text-anchor="middle">노이즈</text><text class="svgmut" x="40" y="142" text-anchor="middle">노이즈</text><text x="138" y="32" fill="var(--amber)" font-size="11" font-weight="700">반경 Eps</text><text class="svgmut" x="140" y="188" text-anchor="middle">모양대로 2개 + 외톨이는 노이즈</text></svg>
    </div>
    <p class="cap">같은 학생들. 왼쪽은 중심 기준으로 반씩 잘라 모양이 엉망이고, 외톨이 둘도 억지로 반에 넣었어요. 오른쪽은 이어진 모양대로 2개, 외톨이는 노이즈로 빼 둬요.</p>
  </div>
  <div class="say"><p>규칙은 둘뿐이에요. "내 주변 <b>반경 Eps</b> 안에 <b>최소 MinPts명</b> 이상 있으면 붐비는 곳이다." 붐비는 곳끼리 이어지면 한 반, 어디에도 못 끼면 노이즈.</p></div>
  <div class="link">
    <div class="row"><span class="term">밀도 기반</span><span>얼마나 <b>촘촘히 모여 있나</b>로 묶음 (K-means는 거리 기반)</span></div>
    <div class="row"><span class="term">Eps</span><span>이웃으로 볼 <b>반경</b> (그림의 노란 원)</span></div>
    <div class="row"><span class="term">MinPts</span><span>붐빈다고 인정할 <b>최소 점 수</b></span></div>
    <div class="row"><span class="term">장점</span><span>군집 수를 <b>미리 정할 필요 없음</b>, <b>노이즈와 이상치에 강함</b>, <b>임의 모양</b> 군집 가능</span></div>
  </div>
  <div class="trap">DBSCAN은 군집 수(K)를 안 정하는 대신 <b>Eps(반경), MinPts(최소 점 수)는 미리 정해야</b> 해요. "아무것도 안 정한다"가 아니에요. 그리고 계층적 방법이 아니라 <b>비계층적</b>.</div>
</section>

<!-- ============ 8 ============ -->
<section class="ep" id="e8">
  <div class="eph"><span class="no">8화</span><h2>딱 잘라 정하기 어려울 때: 퍼지, EM, SOM</h2><span class="pg">35쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>경계에 선 학생을 억지로 한 반에 넣는 대신 <b>"기초반일 확률 0.58"</b>처럼 걸쳐 두는 방법(퍼지, EM), 그리고 학생들을 <b>2차원 지도에 펼쳐 놓는</b> 방법(SOM).</div>

  <p class="linkh">퍼지와 EM: 소속을 확률로</p>
  <div class="fig">
    <svg viewBox="0 0 340 196" style="max-width:420px" role="img" aria-label="점수 분포가 종 두 개로 겹쳐 있음. 66점 학생은 기초반 종 소속 확률 0.58, 심화반 0.42"><line x1="30" y1="150" x2="324" y2="150" stroke="var(--line)"/><path d="M30 149 L38 147 L47 145 L55 141 L64 136 L72 129 L80 120 L89 111 L97 101 L106 93 L114 87 L122 85 L131 87 L139 93 L148 101 L156 111 L164 120 L173 129 L181 136 L190 141 L198 145 L206 147 L215 149 L223 149 L232 150 L240 150 L248 150 L257 150 L265 150 L274 150 L282 150 L290 150 L299 150 L307 150 L316 150 L324 150" fill="none" stroke="var(--omr)" stroke-width="2.5"/><path d="M30 150 L38 150 L47 150 L55 150 L64 150 L72 150 L80 150 L89 150 L97 150 L106 150 L114 150 L122 150 L131 150 L139 150 L148 149 L156 149 L164 147 L173 145 L181 140 L190 133 L198 123 L206 111 L215 99 L223 87 L232 79 L240 76 L248 79 L257 87 L265 99 L274 111 L282 123 L290 133 L299 140 L307 145 L316 147 L324 149" fill="none" stroke="var(--blue)" stroke-width="2.5"/><text class="svgmut" x="72" y="166" text-anchor="middle">40점</text><text class="svgmut" x="156" y="166" text-anchor="middle">60점</text><text class="svgmut" x="240" y="166" text-anchor="middle">80점</text><text class="svgmut" x="324" y="166" text-anchor="middle">100점</text><text x="122" y="76" text-anchor="middle" fill="var(--omr)" font-size="12" font-weight="700">기초반 종</text><text x="240" y="66" text-anchor="middle" fill="var(--blue)" font-size="12" font-weight="700">심화반 종</text><line x1="181" y1="150" x2="181" y2="100" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="181" cy="150" r="6" fill="var(--ink)"/><text class="svgtxt" x="181" y="94" text-anchor="middle" font-weight="700">66점 학생</text><text class="svgmut" x="170" y="188" text-anchor="middle">기초반일 확률 0.58 · 심화반일 확률 0.42 (딱 잘라 정하지 않음)</text></svg>
    <p class="cap">전체 점수 분포를 보니 종 모양 두 개가 겹쳐 있어요(혼합분포). 66점 학생은 두 종 사이에 걸쳐 있어요.</p>
    <div class="flows" style="margin-top:12px">
      <div class="flow">
        <div class="fh"><b>EM 알고리즘</b><span class="tag green">분포 기반</span></div>
        <div class="fl"><span>종 2개를<br>대충 그림</span><i>→</i><span class="hi">E단계<br>학생마다 소속 확률</span><i>→</i><span class="hi">M단계<br>그 확률로 종 다시 그림</span><i>→</i><span>안 바뀔 때까지<br>반복</span></div>
        <p>E = Expectation(기댓값 계산), M = Maximization(그 기댓값이 <b>가장 그럴듯해지도록</b> 종의 평균, 퍼짐을 고침). 15장 최대우도법의 "그럴듯함"이 여기서도 나와요.</p>
      </div>
    </div>
  </div>
  <div class="link">
    <div class="row"><span class="term">퍼지 군집</span><span>Fuzzy = 흐릿한. 학생마다 반마다 <b>소속 정도(소속도, 확률)</b>를 매김. "기초반 0.7, 심화반 0.3"</span></div>
    <div class="row"><span class="term">EM 알고리즘</span><span>데이터가 <b>여러 분포가 섞인 것(혼합분포)</b>이라 보고, E단계와 M단계를 반복해 각 분포를 찾음. <b>분포 기반</b>.</span></div>
  </div>
  <div class="memo">K-means와 EM은 모양이 닮았어요. K-means: 배정하고 → 중심 옮기기. EM: 확률 매기고(E) → 종 다시 그리기(M). 차이는 <b>딱 잘라 배정하나, 확률로 걸쳐 두나</b>.</div>

  <p class="linkh">SOM: 학생들을 지도 한 장에 펼치기</p>
  <div class="fig">
    <svg viewBox="0 0 380 186" style="max-width:460px" role="img" aria-label="학생 한 명의 여러 항목이 지도 칸 모두에 연결되고, 가장 닮은 칸 하나가 승자가 되어 그 칸과 이웃이 학생 쪽으로 조금 바뀜"><rect x="10" y="19" width="56" height="22" rx="6" fill="var(--blue-soft)" stroke="var(--blue)"/><text class="svgtxt" x="38" y="34" text-anchor="middle">국어</text><rect x="10" y="49" width="56" height="22" rx="6" fill="var(--blue-soft)" stroke="var(--blue)"/><text class="svgtxt" x="38" y="64" text-anchor="middle">수학</text><rect x="10" y="79" width="56" height="22" rx="6" fill="var(--blue-soft)" stroke="var(--blue)"/><text class="svgtxt" x="38" y="94" text-anchor="middle">영어</text><rect x="10" y="109" width="56" height="22" rx="6" fill="var(--blue-soft)" stroke="var(--blue)"/><text class="svgtxt" x="38" y="124" text-anchor="middle">출석</text><rect x="10" y="139" width="56" height="22" rx="6" fill="var(--blue-soft)" stroke="var(--blue)"/><text class="svgtxt" x="38" y="154" text-anchor="middle">자습</text><g stroke="var(--line)" stroke-width="0.8"><line x1="66" y1="30" x2="180" y2="80"/><line x1="66" y1="60" x2="180" y2="80"/><line x1="66" y1="90" x2="180" y2="80"/><line x1="66" y1="120" x2="180" y2="80"/><line x1="66" y1="150" x2="180" y2="80"/></g><rect x="182" y="22" width="26" height="26" rx="5" fill="var(--surface)" stroke="var(--line)"/><rect x="212" y="22" width="26" height="26" rx="5" fill="var(--omr-soft)" stroke="var(--omr)"/><rect x="242" y="22" width="26" height="26" rx="5" fill="var(--omr-soft)" stroke="var(--omr)"/><rect x="272" y="22" width="26" height="26" rx="5" fill="var(--omr-soft)" stroke="var(--omr)"/><rect x="182" y="52" width="26" height="26" rx="5" fill="var(--surface)" stroke="var(--line)"/><rect x="212" y="52" width="26" height="26" rx="5" fill="var(--omr-soft)" stroke="var(--omr)"/><rect x="242" y="52" width="26" height="26" rx="5" fill="var(--omr)" stroke="var(--omr)"/><rect x="272" y="52" width="26" height="26" rx="5" fill="var(--omr-soft)" stroke="var(--omr)"/><rect x="182" y="82" width="26" height="26" rx="5" fill="var(--surface)" stroke="var(--line)"/><rect x="212" y="82" width="26" height="26" rx="5" fill="var(--omr-soft)" stroke="var(--omr)"/><rect x="242" y="82" width="26" height="26" rx="5" fill="var(--omr-soft)" stroke="var(--omr)"/><rect x="272" y="82" width="26" height="26" rx="5" fill="var(--omr-soft)" stroke="var(--omr)"/><rect x="182" y="112" width="26" height="26" rx="5" fill="var(--surface)" stroke="var(--line)"/><rect x="212" y="112" width="26" height="26" rx="5" fill="var(--surface)" stroke="var(--line)"/><rect x="242" y="112" width="26" height="26" rx="5" fill="var(--surface)" stroke="var(--line)"/><rect x="272" y="112" width="26" height="26" rx="5" fill="var(--surface)" stroke="var(--line)"/><text class="svgtxt" x="240" y="158" text-anchor="middle" font-weight="700">2차원 지도(경쟁층)</text><text class="svgmut" x="240" y="174" text-anchor="middle">진한 칸 = 승자 · 연한 칸 = 이웃도 따라 바뀜</text><text class="svgmut" x="38" y="182" text-anchor="middle">입력층</text></svg>
    <p class="cap">학생 한 명의 여러 항목이 지도의 모든 칸에 연결돼요(완전연결). 칸들이 서로 "내가 이 학생이랑 제일 닮았다"고 경쟁하고, 이긴 칸과 그 이웃이 학생 쪽으로 조금 닮아 가요.</p>
  </div>
  <div class="link">
    <div class="row"><span class="term">SOM</span><span>Self-Organizing Map, <b>자기조직화지도</b>. 신경망 기반으로 여러 항목(고차원)을 2차원 지도로 줄이면서(<b>차원 축소</b>) 비슷한 학생을 가까운 칸에 모음(<b>군집화</b>).</span></div>
    <div class="row"><span class="term">경쟁 학습</span><span>칸들이 경쟁해서 <b>승자 노드</b> 하나가 이기고, 승자와 이웃만 바뀜</span></div>
    <div class="row"><span class="term">순전파만</span><span>입력 → 지도 한 방향 계산만. <b>역전파 없음</b>.</span></div>
  </div>
  <details open><summary>왜 SOM에는 역전파가 없나</summary><div class="in">
    <p>16장 신경망의 역전파는 "정답과 <b>틀린 만큼</b>을 뒤로 보내 고치기"였어요. 그런데 군집에는 <b>정답이 없어요</b>. 틀린 만큼을 잴 수가 없으니 뒤로 보낼 것도 없죠. 대신 "제일 닮은 칸이 학생 쪽으로 다가간다"는 경쟁 규칙으로 배워요.</p>
  </div></details>
  <div class="trap">"SOM은 <b>역전파</b> 알고리즘을 사용한다" → <b>틀림</b>. 신경망이라서 16장처럼 역전파를 쓸 것 같지만, 정답 없는 비지도라 <b>순전파만</b>.</div>
</section>

<p class="part">PART 4 · 잘 묶였나 (36쪽)</p>

<!-- ============ 9 ============ -->
<section class="ep" id="e9">
  <div class="eph"><span class="no">9화</span><h2>반 편성 채점: 실루엣과 Elbow</h2><span class="pg">36쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>정답이 없으니 정확도로 채점할 수 없다. 대신 <b>"우리 반 친구들과는 가깝고, 옆 반과는 먼가"</b>로 채점한다(실루엣). 반 개수 K는 <b>흩어짐이 더는 크게 안 줄어드는 지점</b>에서 고른다(Elbow).</div>

  <p class="linkh">실루엣 계수: 학생 한 명씩 "나 반 잘 왔나" 점수</p>
  <div class="fig">
    <div class="calc" style="margin-top:0">
      <div class="ln"><span>a = 우리 반 친구들과의 평균 거리 (가 → 나 1, 바 1)</span><span class="num">1.0</span></div>
      <div class="ln"><span>b = 가장 가까운 옆 반과의 평균 거리 (가 → 다, 라, 마)</span><span class="num">약 5.07</span></div>
      <div class="ln"><span>s = (b − a) ÷ (둘 중 큰 값) = (5.07 − 1.0) ÷ 5.07</span><span class="num">약 0.80</span></div>
    </div>
    <div class="calc">

hor="middle">60%</text><text class="svgtxt" x="370" y="132" text-anchor="middle" font-weight="700">25%</text><text class="svgmut" x="320" y="184" text-anchor="middle">평소</text><text class="svgmut" x="370" y="184" text-anchor="middle">앞 상품 산 뒤</text><text x="345" y="206" text-anchor="middle" fill="var(--omr)" font-size="15" font-weight="700">향상도 0.42</text><text class="svgmut" x="345" y="222" text-anchor="middle">< 1 오히려 덜 삼</text></svg>
    <p class="cap">회색 = 평소 그 상품을 사는 비율 · 색 막대 = 앞 상품을 산 영수증 중에서 사는 비율(신뢰도)</p>
    <div class="calc">
      <div class="ln"><span>문제집 → 오답노트: 신뢰도 0.6 ÷ 평소 오답노트 0.4</span><span class="num">1.5</span></div>
      <div class="ln"><span>문제집 → 형광펜: 신뢰도 0.6 ÷ 평소 형광펜 0.6</span><span class="num">1.0</span></div>
      <div class="ln"><span>오답노트 → 형광펜: 신뢰도 0.25 ÷ 평소 형광펜 0.6</span><span class="num">약 0.42</span></div>
    </div>
  </div>
  <div class="say"><p>"문제집 → 형광펜"은 신뢰도 0.6으로 "문제집 → 오답노트"와 똑같아요. 그런데 형광펜은 원래 열 명 중 여섯 명이 사요. 문제집을 샀다고 <b>더 사는 게 아니라 그냥 원래만큼</b> 산 거예요. 향상도가 이걸 잡아내요.</p></div>
  <div class="link">
    <div class="row"><span class="term">향상도 (Lift)</span><span>P(A∩B) ÷ (P(A) × P(B)) = 신뢰도 ÷ P(B)</span></div>
    <div class="row"><span class="term">&gt; 1</span><span><b>양의 상관</b>. 같이 사는 경향. 옆에 진열할 짝.</span></div>
    <div class="row"><span class="term">= 1</span><span><b>서로 독립</b>(상관없음). 우연히 같이 산 만큼.</span></div>
    <div class="row"><span class="term">&lt; 1</span><span><b>음의 상관</b>. 오히려 같이 안 삼(하나 사면 다른 건 덜 삼).</span></div>
  </div>
  <details open><summary>분모 P(A) × P(B)는 왜 "우연"인가</summary><div class="in">
    <p>문제집과 오답노트가 서로 아무 상관이 없다면, 둘 다 살 확률은 그냥 각자 확률을 곱한 값이에요(동전 두 개 던져 둘 다 앞면 = ½ × ½). 15장 나이브베이즈의 "독립이면 곱한다"와 같은 원리예요.</p>
    <div class="calc">
      <div class="ln"><span>상관없다면 둘 다 살 비율 = 0.5 × 0.4</span><span class="num">0.2 (2장 예상)</span></div>
      <div class="ln"><span>실제로 둘 다 산 비율</span><span class="num">0.3 (3장)</span></div>
      <div class="ln"><span>향상도 = 실제 ÷ 우연 예상 = 0.3 ÷ 0.2</span><span class="num">1.5</span></div>
    </div>
    <p>그래서 향상도 1 = "우연만큼", 1.5 = "우연보다 1.5배 자주". 그리고 이 식은 A와 B를 바꿔도 같아서 <b>향상도도 방향이 없어요</b>(오답노트 → 문제집도 0.75 ÷ 0.5 = 1.5).</p>
  </div></details>
  <div class="memo"><b>"지신향" 순서로 분모가 하나씩 늘어요.</b> 지지도 분모 = 전체(1), 신뢰도 분모 = P(A), 향상도 분모 = P(A) × P(B). 분자는 셋 다 똑같이 P(A∩B).</div>
  <div class="trap">16장 이익도표의 <b>리프트(향상도)</b>와 이름이 같아요. 거기선 "모델이 고른 상위 고객 반응률 ÷ 전체 반응률"이고, 여기선 "A 산 사람의 B 구매율 ÷ 평소 B 구매율". 둘 다 <b>"평소보다 몇 배?"</b>라는 뜻은 같지만 문제에서 어느 단원 얘기인지 보고 풀어요.</div>
</section>

<!-- ============ 5 ============ -->
<section class="ep" id="e5">
  <div class="eph"><span class="no">5화</span><h2>시험 그대로: 맥주와 치킨 200건</h2><span class="pg">37쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>교재 예제도 칸 세기 그대로. 숫자가 <b>확률로 주어지든 건수로 주어지든</b> "둘 다 ÷ 분모"만 바꿔 끼우면 된다.</div>
  <div class="fig">
    <svg viewBox="0 0 440 120" style="max-width:500px" role="img" aria-label="영수증 200장: 맥주만 40, 둘 다 60, 치킨만 30, 둘 다 안 삼 70. 맥주 산 영수증 100장, 치킨 산 영수증 90장"><rect x="20" y="34" width="80.0" height="34" fill="var(--blue-soft)" stroke="var(--surface)" stroke-width="2"/><text class="svgtxt" x="60" y="56" text-anchor="middle" font-weight="700">맥주만 40</text><rect x="100.0" y="34" width="120.0" height="34" fill="var(--ok-soft)" stroke="var(--surface)" stroke-width="2"/><text class="svgtxt" x="160" y="56" text-anchor="middle" font-weight="700">둘 다 60</text><rect x="220.0" y="34" width="60.0" height="34" fill="var(--amber-soft)" stroke="var(--surface)" stroke-width="2"/><text class="svgtxt" x="250" y="56" text-anchor="middle" font-weight="700">치킨만 30</text><rect x="280.0" y="34" width="140.0" height="34" fill="var(--sunk)" stroke="var(--surface)" stroke-width="2"/><text class="svgtxt" x="350" y="56" text-anchor="middle" font-weight="700">둘 다 안 삼 70</text><path d="M21 28 L21 20 L219 20 L219 28" fill="none" stroke="var(--blue)" stroke-width="1.5"/><text x="120" y="14" text-anchor="middle" fill="var(--blue)" font-size="12" font-weight="700">맥주 산 영수증 100장</text><path d="M101 74 L101 82 L279 82 L279 74" fill="none" stroke="var(--amber)" stroke-width="1.5"/><text x="190" y="98" text-anchor="middle" fill="var(--amber)" font-size="12" font-weight="700">치킨 산 영수증 90장</text><text class="svgmut" x="220" y="116" text-anchor="middle">전체 200장 (가운데 초록 60장이 둘 다)</text></svg>
    <div class="calc">
      <div class="ln"><span>P(맥주) = 100 ÷ 200, P(치킨) = 90 ÷ 200</span><span class="num">0.5, 0.45</span></div>
      <div class="ln"><span>지지도 = 둘 다 60 ÷ 전체 200</span><span class="num">0.3</span></div>
      <div class="ln"><span>맥주 → 치킨 신뢰도 = 0.3 ÷ 0.5 (= 60 ÷ 100)</span><span class="num">0.6</span></div>
      <div class="ln"><span>향상도 = 0.3 ÷ (0.5 × 0.45) = 0.3 ÷ 0.225</span><span class="num">약 1.33 → 양의 상관</span></div>
    </div>
  </div>
  <details open><summary>연습: 전체 100건, A 40건, B 50건, 둘 다 20건</summary><div class="in">
    <div class="calc">
      <div class="ln"><span>지지도 = 20 ÷ 100</span><span class="num">0.2</span></div>
      <div class="ln"><span>A → B 신뢰도 = 20 ÷ 40</span><span class="num">0.5</span></div>
      <div class="ln"><span>향상도 = 0.2 ÷ (0.4 × 0.5) = 0.2 ÷ 0.2</span><span class="num">1.0 → 독립</span></div>
    </div>
    <p>신뢰도 0.5가 평소 B 구매율 0.5와 똑같아요. A를 샀다고 B를 더 사지 않으니 <b>상관없음</b>.</p>
  </div></details>
  <div class="memo">시험장 순서: ① 전체로 나눠 P(A), P(B), P(A∩B)를 먼저 적는다 ② 신뢰도 = 둘 다 ÷ P(<b>화살표 앞</b>) ③ 향상도 = 신뢰도 ÷ P(<b>화살표 뒤</b>).</div>
  <div class="trap">"맥주 → 치킨" 신뢰도는 0.3 ÷ 0.5 = <b>0.6</b>, "치킨 → 맥주"는 0.3 ÷ 0.45 ≈ <b>0.67</b>. 보기에 둘 다 있어요. <b>화살표 앞</b>이 분모인지 꼭 확인하세요.</div>
</section>
