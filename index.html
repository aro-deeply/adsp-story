      <text class="svgmut" x="400" y="160" text-anchor="middle">전문가를 부서에 파견</text>
      <text class="svgtxt" x="80" y="192" text-anchor="middle" font-weight="700">집중형</text>
      <text class="svgtxt" x="240" y="192" text-anchor="middle" font-weight="700">기능형</text>
      <text class="svgtxt" x="400" y="192" text-anchor="middle" font-weight="700">분산형</text>
    </svg>
  </div>
  <div class="fig">
    <div class="three">
      <div class="box"><span class="tag blue">집중형</span><h4>한곳에 모으기</h4><p>독립 전담 조직이 <b>전사 우선순위</b>를 정해 수행. 단점: 현업 부서에도 분석하는 사람이 있으면 <b>중복 업무(이원화)</b> 가능성.</p></div>
      <div class="box"><span class="tag red">기능형</span><h4>부서마다 알아서</h4><p><b>별도 분석 조직 없음</b>. 각 부서가 자기 업무를 직접 분석. 단점: 부서 안만 봐서 <b>전사 관점</b> 분석이 어려움.</p></div>
      <div class="box"><span class="tag green">분산형</span><h4>전문가 파견</h4><p>전담 조직의 인력을 <b>현업 부서에 배치</b>. 장점: 현장 가까이 있어 <b>신속한 실무 적용</b>.</p></div>
    </div>
  </div>
  <div class="memo"><b>"집기분"</b> 그리고 한 단어씩: 집중형 = <b>중복</b>, 기능형 = <b>조직 없음</b>, 분산형 = <b>파견</b>.</div>
  <div class="trap">"분산형"이라는 이름 때문에 "조직 없이 흩어져 있다"로 오해하기 쉬워요. 그건 <b>기능형</b>이에요. 분산형은 <b>전담 조직이 있고</b> 그 인력을 부서에 나눠 보낸 것.</div>
</section>

<section class="ep" id="qz">
  <div class="eph"><span class="no">끝</span><h2>확인 8문제</h2></div>
  <p style="margin:0 0 10px;color:var(--muted)">답을 떠올려 본 뒤 눌러서 확인하세요.</p>
  <div class="quiz">
    <details><summary>시급성과 연결된 V는? 난이도는?</summary><div class="in"><p>시급성 = 비즈니스 효과 = <b>Value</b>. 난이도 = 투자 비용 = <b>Volume, Variety, Velocity</b>.</p></div></details>
    <details><summary>가장 먼저 할 사분면과 가장 나중 사분면은?</summary><div class="in"><p>먼저 <b>Ⅲ</b>(현재·쉬움), 나중 <b>Ⅱ</b>(미래·어려움).</p></div></details>
    <details><summary>시급성 기준 순서와 난이도 기준 순서는?</summary><div class="in"><p>시급성 <b>Ⅲ → Ⅳ → Ⅱ</b>, 난이도 <b>Ⅲ → Ⅰ → Ⅱ</b>. "시사, 난일".</p></div></details>
    <details><summary>데이터 분석 로드맵 3단계는?</summary><div class="in"><p><b>체계 도입 → 유효성 검증(파일럿) → 확산 및 고도화</b>.</p></div></details>
    <details><summary>분석 거버넌스 5요소와 데이터 거버넌스 3요소는?</summary><div class="in"><p>분석: <b>조직, 프로세스, 시스템, 데이터, 분석 교육 및 마인드 육성</b>. 데이터: <b>원칙, 조직, 프로세스</b>. 예산, 하드웨어는 없음.</p></div></details>
    <details><summary>준비도 6영역에 "분석 성과"가 있나? 성숙도 순서와 기반 모델은?</summary><div class="in"><p>없음. 6영역은 업무 파악, 인력·조직, 기법, 데이터, 문화, IT 인프라. 성숙도는 <b>도입 → 활용 → 확산 → 최적화</b>, <b>CMMI</b> 기반.</p></div></details>
    <details><summary>준비도 높고 성숙도 낮으면? 준비도 낮고 성숙도 높으면?</summary><div class="in"><p>앞은 <b>도입형</b>(바로 도입 가능), 뒤는 <b>정착형</b>(제한적으로 쓰는 중, 정착 필요).</p></div></details>
    <details><summary>업무 중복 가능성이 있는 조직 구조는? 별도 조직이 없는 구조는?</summary><div class="in"><p>중복 = <b>집중형</b>, 조직 없음 = <b>기능형</b>. 파견은 분산형. 협의의 분석 플랫폼에 분석 애플리케이션은 없음(광의).</p></div></details>
  </div>
  <div class="end">
    <h3>8장 한 문장</h3>
    <p>과제가 쌓이자 김 팀장은 <b>시급성(Value) × 난이도(3V)</b> 사분면으로 줄 세우고(Ⅲ 먼저, Ⅱ 나중, 시사·난일), <b>도입 → 검증 → 확산</b> 로드맵을 그린 뒤, 회사의 <b>준비도(6영역)와 성숙도(도활확최, CMMI)</b>를 재서 <b>준비·정착·도입·확산형</b> 중 어디인지 진단하고, <b>분석 거버넌스 5요소, 데이터 거버넌스(원칙·조직·프로세스), 분석 조직(집중·기능·분산형)</b>으로 회사 전체의 분석 체계를 세운다.</p>
  </div>
</section>

<section class="ep" id="e2">
  <div class="eph"><span class="no">2화</span><h2>바로 분석하지 말고 일단 들여다보기: EDA</h2><span class="pg">14쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>가설을 세우기 전에 데이터를 <b>이리저리 보며 특징을 찾는 단계</b>가 탐색적 자료 분석(EDA). 원장님이 성적표를 펼치자마자 "850점?"이 눈에 들어오는 것도 EDA 덕분이에요.</div>

<p class="part">PART 1 · 결측값: 빈칸 (14쪽)</p>

<!-- ============ 3 ============ -->
<section class="ep" id="e3">
  <div class="eph"><span class="no">3화</span><h2>영어 점수 칸이 비어 있다: 결측값, 그리고 지우기</h2><span class="pg">14쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>값이 없는 칸이 <b>결측값</b>(R에서는 <b>NA</b>). 가장 쉬운 처리는 그 학생 줄을 통째로 빼는 <b>완전분석법</b>. 쉽지만 <b>멀쩡한 수학 점수까지 같이 버려요</b>.</div>
  <div class="fig">
    <div class="tblwrap">
    <table class="act" style="max-width:420px;margin:0 auto">
      <tr><th>학생</th><th>수학</th><th>영어</th></tr>
      <tr><td>A</td><td class="num">50</td><td class="num">55</td></tr>
      <tr><td>B</td><td class="num">60</td><td class="num">65</td></tr>
      <tr><td>C</td><td class="num">70</td><td class="num">75</td></tr>
      <tr><td>D</td><td class="num">80</td><td class="num">85</td></tr>
      <tr><td>E</td><td class="num">85</td><td class="num" style="color:var(--omr);font-weight:700">NA</td></tr>
      <tr><td>F</td><td class="num">52</td><td class="num" style="color:var(--omr);font-weight:700">NA</td></tr>
    </table>
    </div>
    <p class="cap">E, F는 영어 시험날 결석. 4·5화에서도 이 표를 계속 써요.</p>
    <div class="calc">
      <div class="ln"><span>완전분석법: E, F 줄 삭제</span><span class="num">6명 → 4명</span></div>
      <div class="ln"><span>같이 사라진 멀쩡한 값</span><span class="num">수학 85, 52</span></div>
      <div class="ln"><span>남은 4명 영어 평균</span><span class="num">70.0</span></div>
    </div>
  </div>
  <div class="say"><p>6명 중 2명이면 3분의 1이 날아가요. 변수가 많을수록 "어딘가 하나라도 빈" 학생이 늘어서 남는 사람이 확 줄어요. 그래서 <b>데이터 손실, 효율성 저하</b>가 완전분석법의 약점이에요.</p></div>
  <div class="link">
    <div class="row"><span class="term">결측값</span><span>Missing Value. 값이 들어 있어야 할 칸이 빈 것</span></div>
    <div class="row"><span class="term">NA</span><span>Not Available. R이 빈칸을 표시하는 글자</span></div>
    <div class="row"><span class="term">완전분석법</span><span>결측이 있는 행(학생)을 지우고 완전한 것만 분석</span></div>
  </div>
</section>

<!-- ============ 4 ============ -->
<section class="ep" id="e4">
  <div class="eph"><span class="no">4화</span><h2>지우기 아까우면 채운다: 단순대치법</h2><span class="pg">14쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>빈칸을 <b>한 번</b> 그럴듯한 값으로 채우는 게 단순대치법. 무엇으로 채우느냐에 따라 <b>평균으로(비조건부)</b>, <b>다른 정보로 예측해서(조건부, 회귀)</b>, <b>비슷한 학생 값을 빌려서(Hot-Deck 등)</b>.</div>
  <div class="fig">
    <div class="tblwrap">
    <table class="act">
      <tr><th>방법</th><th>E 영어</th><th>F 영어</th><th>6명 평균</th><th>퍼짐(표준편차)</th></tr>
      <tr><td>채우기 전 (4명)</td><td>-</td><td>-</td><td class="num">70.0</td><td class="num">12.9</td></tr>
      <tr><td>비조건부 평균대치</td><td class="num">70</td><td class="num">70</td><td class="num">70.0</td><td class="num" style="color:var(--omr);font-weight:700">10.0</td></tr>
      <tr><td>조건부 평균대치</td><td class="num">90</td><td class="num">57</td><td class="num">71.2</td><td class="num">14.6</td></tr>
      <tr><td>Hot-Deck</td><td class="num">85</td><td class="num">55</td><td class="num">70.0</td><td class="num">13.8</td></tr>
    </table>
    </div>
    <div class="calc">
      <div class="ln"><span>비조건부: 4명 평균 (55+65+75+85) ÷ 4</span><span class="num">70</span></div>
      <div class="ln"><span>조건부: 4명을 보니 "영어 = 수학 + 5" (회귀식)</span><span class="num">E 85+5=90 · F 52+5=57</span></div>
      <div class="ln"><span>Hot-Deck: 수학이 비슷한 학생 값 빌리기</span><span class="num">E←D 85 · F←A 55</span></div>
    </div>
  </div>
  <div class="say"><p>평균대치만 퍼짐이 <b>12.9 → 10.0</b>으로 줄었어요. 빈칸 두 개를 딱 평균(70)에 박아 넣었으니, 평균에서 벗어난 정도가 0인 학생이 둘 생긴 거예요. 실제 E는 수학 85점짜리라 영어도 높았을 텐데요.</p></div>
  <p class="linkh">단순확률대치법: 비슷한 응답을 어디서 빌려 오나</p>
  <div class="fig">
    <div class="three">
      <div class="box"><span class="tag red">Hot-Deck</span><h4>지금 데이터 안에서</h4><p>우리 반에서 수학이 비슷한 학생들 중 하나를 뽑아 그 값을 빌림</p></div>
      <div class="box"><span class="tag blue">Cold-Deck</span><h4>바깥 자료에서</h4><p>작년 반, 다른 지점 같은 <b>외부 출처</b>의 비슷한 학생 값</p></div>
      <div class="box"><span class="tag green">Nearest Neighbor</span><h4>가장 가까운 한 명</h4><p>조건이 가장 가까운 응답 하나를 그대로 빌림</p></div>
    </div>
  </div>
  <div class="memo">따끈한(Hot) 지금 우리 데이터, 식은(Cold) 바깥 데이터. <b>조건부 = 회귀로 예측</b>, 비조건부 = 그냥 평균.</div>
</section>

<!-- ============ 5 ============ -->
<section class="ep" id="e5">
  <div class="eph"><span class="no">5화</span><h2>한 번만 채우면 너무 확신하게 된다: 다중대치법</h2><span class="pg">14쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>단순대치는 "E 영어는 90점"이라고 <b>단 하나로 단정</b>해서, 데이터가 실제보다 덜 퍼져 보여요(<b>분산 과소 추정</b>). 그래서 <b>여러 번 다르게 채워 보고(대치) → 각각 분석하고(분석) → 결과를 합친다(결합)</b>.</div>
  <div class="fig">
    <div class="flows">
      <div class="flow">
        <div class="fh"><b>다중대치법 3단계</b><span class="tag blue">대치 → 분석 → 결합</span></div>
        <div class="fl"><span>빈칸 있는<br>성적표</span><i>→</i><span>① 대치<br>3벌 만들기</span><i>→</i><span>② 분석<br>벌마다 평균</span><i>→</i><span class="hi">③ 결합<br>평균 내기</span></div>
      </div>
    </div>
    <div class="calc">
      <div class="ln"><span>1번째 세트: E 88, F 56</span><span class="num">평균 70.67</span></div>

<section class="ep" id="e6">
  <div class="eph"><span class="no">6화</span><h2>수학 850점, 그리고 18점: 이상값 찾기</h2><span class="pg">15쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>100점 만점에 <b>850점은 오타</b>(85점), <b>18점은 진짜</b>(시험날 아팠던 학생). 둘 다 무리에서 튀는 <b>이상값</b>이지만 처리는 달라요. 그래서 이상값은 <b>찾되, 항상 지우지는 않는다</b>.</div>

  <p class="linkh">방법 ① 사분위수(IQR): 가운데 절반을 기준으로 울타리 치기</p>

  <p class="linkh">방법 ② ESD: 평균에서 표준편차 3배 넘게 떨어지면 이상값</p>

    </div>
  </div>
  <div class="say"><p>ESD는 평균과 표준편차로 울타리를 치는데, 그 둘이 <b>이상값에 끌려가요</b>. 850 하나가 평균을 두 배로, 표준편차를 열 배 넘게 키워 울타리가 엄청 넓어졌어요. 사분위수는 순서로 정하는 값이라 850이 8500이어도 62, 80 그대로예요. 2화의 <b>저항성</b>이 바로 이 차이예요.</p></div>
  <div class="link">
    <div class="row"><span class="term">ESD</span><span>평균 ± 3 × 표준편차 밖이면 이상값</span></div>
    <div class="row"><span class="term">사분위수 (IQR)</span><span>Q1 − 1.5 × IQR 보다 작거나 Q3 + 1.5 × IQR 보다 크면 이상값. IQR = Q3 − Q1</span></div>
    <div class="row"><span class="term">Z-Score</span><span>(값 − 평균) ÷ 표준편차 = "평균에서 표준편차 몇 개만큼 떨어졌나". 보통 ±3 넘으면 이상값. 850의 Z는 약 3.01</span></div>
    <div class="row"><span class="term">DBSCAN</span><span>점이 빽빽이 모인 곳을 무리로 보고, <b>밀도가 낮은 곳에 혼자 떨어진 점</b>을 이상값으로 봄 (군집 기법)</span></div>
  </div>
  <details><summary>그래서 원장님은 둘을 어떻게 처리했나</summary><div class="in">
    <p><b>850</b>: 답안지를 확인하니 85점. 입력 실수라 <b>고쳐서</b> 씀.</p>
    <p><b>18</b>: 진짜 점수. 지워 버리면 "시험날 컨디션이 무너지는 학생"이라는 중요한 정보가 사라져요. 15장 합격 예측에서는 오히려 이런 학생을 찾아내는 게 목적일 수도 있어요. 그래서 <b>남겨 두고</b> 따로 표시해요.</p>
    <p>이처럼 이상값은 오류일 수도, 의미 있는 데이터일 수도 있어서 <b>찾는 것과 지우는 것은 별개</b>예요.</p>
  </div></details>
  <div class="trap">"이상값은 발견되면 반드시 제거한다"는 <b>틀린 보기</b>. 또 기준 숫자를 바꿔 내요: <b>ESD = 표준편차 3배</b>, <b>IQR = 1.5배</b>. "평균 ± 1.5 표준편차", "Q ± 3 IQR"은 오답.</div>
</section>

<section class="ep" id="qz">
  <div class="eph"><span class="no">끝</span><h2>확인 8문제</h2></div>
  <p style="margin:0 0 10px;color:var(--muted)">답을 떠올려 본 뒤 눌러서 확인하세요.</p>
  <div class="quiz">
    <details><summary>"성실도 A등급", "고객 구매 등급"은 요약변수? 파생변수?</summary><div class="in"><p><b>파생변수</b>. 의미를 붙인 주관적 값이라 논리적 타당성이 필요. "1개월간 수입" 같은 합계는 요약변수.</p></div></details>
    <details><summary>EDA 4주제는? 아닌 것으로 자주 나오는 보기는?</summary><div class="in"><p><b>저항성, 잔차, 재표현, 현시성</b>(저잔재현). "가설의 사전 설정"은 아님.</p></div></details>
    <details><summary>결측 있는 행을 지우고 분석하는 방법과 그 약점은?</summary><div class="in"><p><b>완전분석법</b>. 멀쩡한 값까지 버려서 데이터 손실, 효율성 저하.</p></div></details>
    <details><summary>회귀 예측값으로 채우면? 외부 자료의 비슷한 값으로 채우면?</summary><div class="in"><p>앞은 <b>조건부</b> 평균대치법, 뒤는 <b>Cold-Deck</b>. 현재 데이터 안에서 빌리면 Hot-Deck.</p></div></details>
    <details><summary>평균대치를 하면 퍼짐이 어떻게 되나? 그 해결책은?</summary><div class="in"><p>빈칸이 전부 평균값이 돼 <b>분산이 과소 추정</b>(예시 12.9 → 10.0). 해결은 <b>다중대치법</b>(대치 → 분석 → 결합).</p></div></details>
    <details><summary>Q1 62, Q3 80이면 IQR 이상값 울타리는?</summary><div class="in"><p>IQR 18, 1.5배는 27. <b>35 미만 또는 107 초과</b>가 이상값.</p></div></details>
    <details><summary>ESD 기준과, ESD가 850 같은 값에 약한 이유는?</summary><div class="in"><p><b>평균 ± 3 × 표준편차</b> 밖. 평균과 표준편차가 이상값에 끌려가 울타리가 넓어지기 때문(저항성 낮음).</p></div></details>
    <details><summary>상자그림으로 알 수 없는 것은? 이상값은 꼭 지워야 하나?</summary><div class="in"><p><b>평균</b>은 알 수 없음(가운데 선은 중앙값). 이상값은 의미 있는 데이터일 수 있어 <b>항상 제거하지 않음</b>.</p></div></details>
  </div>
  <div class="end">
    <h3>9장 한 문장</h3>
    <p>3과목의 첫 장면: 원장님이 흩어진 데이터를 <b>데이터 마트</b>로 모으고(요약·파생변수), <b>EDA</b>로 들여다본 뒤(저잔재현), 빈칸은 <b>지우거나(완전분석) 한 번 채우거나(평균·Hot-Deck) 여러 번 채워 합치고(다중대치)</b>, 튀는 값은 <b>ESD(3σ), IQR(1.5배), 상자그림</b>으로 찾되 오타는 고치고 진짜는 남긴다. 상자그림에 평균은 없다.</p>
  </div>
</section>

  <h1>원장님, 성적표 엑셀을 처음 열다</h1>
  <p>15·16장의 입시학원 원장님이 아직 예측 모델을 만들기 전 이야기예요. 손에 있는 건 학생 성적표 한 장. 이 숫자들을 <b>어떻게 읽고, 한 줄로 요약하나</b>를 배우는 단원입니다. 11장(일부만 뽑기), 12장(효과 판정)으로 이어져요.</p>
  <div class="speed">
    <div><b>시간 없을 때 10분</b>검은 상자 + 그림만</div>
    <div><b>보통 30분</b>계산 줄까지 따라 하기</div>
    <div><b>여유 있을 때</b>회색 칸(+)도 펼치기</div>
  </div>
</header>

<div class="core"><small>이 단원 전체를 한 문장으로</small>성적표 칸마다 <b>숫자의 급(척도)</b>이 다르고, 숫자 더미는 <b>가운데가 어디냐</b>(평균, 중앙값)와 <b>얼마나 흩어졌냐</b>(분산, 표준편차), <b>어느 쪽으로 기울었냐</b>(왜도)로 요약한다.</div>

<p class="linkh">흐름 지도 (누르면 이동)</p>

  <a href="#e1"><span class="n">1화 · 16쪽</span><span class="t">이 숫자, 더해도 되나?</span><span class="q">명목, 순서, 등간, 비율</span></a>

  <a href="#e4"><span class="n">4화 · 17쪽</span><span class="t">가운데는 어디?</span><span class="q">평균, 중앙값, 최빈값</span></a>
  <a href="#e5"><span class="n">5~6화 · 17쪽</span><span class="t">얼마나 흩어졌나?</span><span class="q">분산, 표준편차, 변동계수</span></a>

<p class="maphint">수식이 나오면 항상 같은 순서예요. ① 이 계산이 답하려는 질문, ② 학생 5명짜리 작은 숫자, ③ 공식은 그걸 기호로 적은 것뿐.</p>

<!-- ============ 1 ============ -->
<section class="ep" id="e1">
  <div class="eph"><span class="no">1화</span><h2>이 숫자, 더해도 되나? 척도 4계단</h2><span class="pg">16쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>성적표에 숫자처럼 생긴 게 다 숫자는 아니다. "3반 + 5반 = 8반"은 말이 안 되듯, <b>칸마다 할 수 있는 계산이 다르다</b>. 그 급수가 척도이고, 계단을 올라갈수록 할 수 있는 게 늘어난다.</div>
  <div class="fig">
    <svg viewBox="0 0 480 200" role="img" aria-label="척도 4계단: 명목, 순서, 등간, 비율 순으로 높아지며 할 수 있는 계산이 하나씩 늘어남">
      <rect x="10" y="130" width="112" height="40" rx="6" fill="var(--blue-soft)" stroke="var(--blue)"/>
      <rect x="126" y="100" width="112" height="70" rx="6" fill="var(--blue-soft)" stroke="var(--blue)"/>
      <rect x="242" y="70" width="112" height="100" rx="6" fill="var(--ok-soft)" stroke="var(--ok)"/>
      <rect x="358" y="40" width="112" height="130" rx="6" fill="var(--ok-soft)" stroke="var(--ok)"/>
      <text class="svgtxt" x="66" y="124" text-anchor="middle" font-weight="700">명목</text>
      <text class="svgtxt" x="66" y="148" text-anchor="middle">반 이름, 혈액형</text>
      <text class="svgmut" x="66" y="163" text-anchor="middle">같다/다르다만</text>
      <text class="svgtxt" x="182" y="94" text-anchor="middle" font-weight="700">순서(서열)</text>
      <text class="svgtxt" x="182" y="122" text-anchor="middle">석차, 학년</text>
      <text class="svgmut" x="182" y="138" text-anchor="middle">+ 크다/작다</text>
      <text class="svgtxt" x="298" y="64" text-anchor="middle" font-weight="700">등간(구간)</text>
      <text class="svgtxt" x="298" y="92" text-anchor="middle">교실 온도, 지수</text>
      <text class="svgmut" x="298" y="108" text-anchor="middle">+ 더하기/빼기</text>
      <text class="svgmut" x="298" y="124" text-anchor="middle">0도 ≠ 온도 없음</text>
      <text class="svgtxt" x="414" y="34" text-anchor="middle" font-weight="700">비율</text>
      <text class="svgtxt" x="414" y="62" text-anchor="middle">키, 나이, 무게</text>
      <text class="svgmut" x="414" y="78" text-anchor="middle">+ 곱하기/나누기</text>
      <text class="svgmut" x="414" y="94" text-anchor="middle">0 = 진짜 없음</text>
      <text class="svgmut" x="414" y="110" text-anchor="middle">정보 가장 많음</text>
      <line x1="12" y1="178" x2="236" y2="178" stroke="var(--blue)" stroke-width="2"/>
      <line x1="244" y1="178" x2="468" y2="178" stroke="var(--ok)" stroke-width="2"/>
      <text class="svgtxt" x="124" y="194" text-anchor="middle" font-weight="700">질적 척도 (이름표에 가까움)</text>
      <text class="svgtxt" x="356" y="194" text-anchor="middle" font-weight="700">양적 척도 (진짜 크기)</text>
    </svg>
    <p class="cap">한 계단 올라갈 때마다 아래 계단의 계산은 다 되고, 하나가 더 늘어나요.</p>
  </div>
  <div class="say"><p>등간과 비율을 가르는 질문은 하나예요. <b>"0이 진짜 '없음'인가?"</b> 공부시간 0시간은 공부를 안 한 것이라 "4시간은 2시간의 2배"가 말이 돼요. 교실 온도 0도는 온도가 없는 게 아니라서 "20도는 10도보다 2배 덥다"는 틀린 말이에요.</p></div>
  <div class="link">
    <div class="row"><span class="term">명목척도</span><span>어느 집단인지 이름표만. 성별, 대학교, 혈액형</span></div>
    <div class="row"><span class="term">순서(서열)척도</span><span>순서 관계는 있지만 간격은 몰라요. 1등과 2등 차이가 2등과 3등 차이와 같다는 보장이 없음</span></div>
    <div class="row"><span class="term">등간(구간)척도</span><span>간격이 의미 있음. <b>덧셈, 뺄셈만</b>. 온도, 지수</span></div>
    <div class="row"><span class="term">비율척도</span><span><b>절대 0</b>이 있어 사칙연산 모두 가능. <b>가장 많은 정보를 가진 척도</b>. 무게, 나이, 키</span></div>
    <div class="row"><span class="term">질적 / 양적</span><span>명목, 순서 = 질적 척도 · 등간, 비율 = 양적 척도</span></div>
  </div>
  <div class="fix">요약노트의 "비율척도 = 가장 많이 수집되는 자료"는 틀린 표현이에요. 정확히는 <b>"가장 많은 정보를 가진 척도"</b>.</div>
  <div class="trap">온도는 숫자가 크고 마이너스도 있어서 비율척도처럼 보이지만 <b>등간척도</b>예요. 0도가 "없음"이 아니니까요.</div>
</section>

<p class="part">PART 1 · 확률 (16쪽)</p>

<!-- ============ 2 ============ -->
<section class="ep" id="e2">
  <div class="eph"><span class="no">2화</span><h2>수학반과 영어반, 몇 명이 겹치나</h2><span class="pg">16쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>확률 공식은 전부 <b>칸 세기</b>. 겹치는 사람을 두 번 세지 않으려고 빼고(덧셈 정리), "영어반 안에서만" 보면 분모가 바뀐다(조건부 확률).</div>
  <div class="fig">
    <svg viewBox="0 0 480 200" style="max-width:480px" role="img" aria-label="학원생 100명 중 수학반 40명, 영어반 30명, 둘 다 12명. 수학만 28, 영어만 18, 둘 다 안 들음 42">
      <rect x="10" y="10" width="460" height="180" rx="10" fill="var(--bg)" stroke="var(--line)"/>
      <circle cx="195" cy="100" r="72" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="2" fill-opacity=".85"/>
      <circle cx="290" cy="100" r="62" fill="var(--omr-soft)" stroke="var(--omr)" stroke-width="2" fill-opacity=".7"/>
      <text class="svgtxt" x="150" y="24" text-anchor="middle" font-weight="700" style="fill:var(--blue)">수학반 A · 40명</text>
      <text class="svgtxt" x="330" y="30" text-anchor="middle" font-weight="700" style="fill:var(--omr)">영어반 B · 30명</text>
      <text class="svgtxt" x="165" y="104" text-anchor="middle" font-size="20" font-weight="700">28</text>
      <text class="svgmut" x="165" y="120" text-anchor="middle">수학만</text>
      <text class="svgtxt" x="245" y="104" text-anchor="middle" font-size="20" font-weight="700">12</text>
      <text class="svgmut" x="245" y="120" text-anchor="middle">둘 다</text>
      <text class="svgtxt" x="318" y="104" text-anchor="middle" font-size="20" font-weight="700">18</text>
      <text class="svgmut" x="318" y="120" text-anchor="middle">영어만</text>
      <text class="svgmut" x="405" y="170" text-anchor="middle">둘 다 안 들음 42</text>
      <text class="svgmut" x="30" y="182">학원생 전체 100명</text>
    </svg>
    <div class="calc">
      <div class="ln"><span>수학 <b>또는</b> 영어 듣는 학생: 40 + 30 − 12 (두 번 센 12명 빼기)</span><span class="num">58명 → 0.58</span></div>
      <div class="ln"><span><b>영어반 안에서</b> 수학도 듣는 비율: 12 ÷ 30</span><span class="num">0.4</span></div>
      <div class="ln"><span>수학반 비율 × 영어반 비율: 0.4 × 0.3</span><span class="num">0.12</span></div>
      <div class="ln"><span>실제 둘 다 듣는 비율 12 ÷ 100 도 0.12 → 곱셈이 딱 맞음</span><span class="num">독립!</span></div>
    </div>
  </div>
  <div class="say"><p>영어반 학생만 놓고 봐도 수학반 비율이 40%, 학원 전체에서도 40%. <b>영어반이라는 정보가 수학반 확률을 하나도 안 바꿨어요.</b> 이게 독립이에요.</p></div>
  <p class="linkh">공식은 위 칸 세기를 기호로 적은 것</p>
  <div class="link">
    <div class="row"><span class="term">덧셈 정리</span><span>P(A∪B) = P(A) + P(B) − P(A∩B). ∪ = 또는(합집합), ∩ = 둘 다(교집합)</span></div>
    <div class="row"><span class="term">조건부 확률</span><span>P(A|B) = P(A∩B) / P(B). 세로줄 | 뒤 B가 <b>새 분모</b>. "B 안에서만 보면"</span></div>
    <div class="row"><span class="term">독립사건</span><span>P(A∩B) = P(A) × P(B), 그래서 P(A|B) = P(A). 서로 영향 없음</span></div>
    <div class="row"><span class="term">배반사건</span><span>P(A∩B) = 0. 동시에 못 일어남. 같은 시간대 오전반과 오전 특강, 동전 앞면과 뒷면</span></div>
  </div>
  <div class="two" style="margin-top:12px">
    <div class="box"><span class="tag blue">독립</span><h4>곱하기가 성립</h4><p>두 원이 겹쳐 있어도 괜찮아요. 한쪽 정보가 다른 쪽 확률을 <b>안 바꾸면</b> 독립.</p></div>
    <div class="box"><span class="tag red">배반</span><h4>교집합이 0</h4><p>두 원이 <b>아예 안 겹침</b>. 한쪽이 일어나면 다른 쪽은 확률 0이 되니, 오히려 서로 영향이 큰 사이예요.</p></div>
  </div>
  <div class="trap">"독립이면 P(A∩B) = 0"은 틀린 보기예요. <b>교집합 0은 배반</b>, <b>곱하기는 독립</b>. 시험은 이 둘을 바꿔 써서 내요.</div>
</section>

<!-- ============ 3 ============ -->
<section class="ep" id="e3">
  <div class="eph"><span class="no">3화</span><h2>한 학생이 일주일에 지각을 몇 번 할까</h2><span class="pg">16쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>"지각 횟수"처럼 결과에 숫자를 붙인 게 <b>확률변수</b>. 오래 지켜보면 평균 몇 번이 나오나 = <b>기댓값</b>. 그 평균에서 얼마나 출렁이나 = <b>분산</b>.</div>
  <div class="fig">
    <svg viewBox="0 0 360 185" style="max-width:400px" role="img" aria-label="지각 0번 확률 0.2, 1번 0.5, 2번 0.3인 막대그래프. 무게중심 1.1에 받침대">
      <line x1="40" y1="120" x2="320" y2="120" stroke="var(--ink)" stroke-width="1.5"/>
      <g fill="var(--blue)"><rect x="61" y="84" width="78" height="36"/><rect x="141" y="30" width="78" height="90"/><rect x="221" y="66" width="78" height="54"/></g>
      <text class="svgtxt" x="100" y="78" text-anchor="middle" font-weight="700">0.2</text>
      <text class="svgtxt" x="180" y="24" text-anchor="middle" font-weight="700">0.5</text>
      <text class="svgtxt" x="260" y="60" text-anchor="middle" font-weight="700">0.3</text>
      <text class="svgtxt" x="100" y="136" text-anchor="middle">0번</text>
      <text class="svgtxt" x="168" y="136" text-anchor="middle">1번</text>
      <text class="svgtxt" x="260" y="136" text-anchor="middle">2번</text>
      <line x1="188" y1="121" x2="188" y2="146" stroke="var(--omr)" stroke-dasharray="3 3"/><polygon points="188,146 178,162 198,162" fill="var(--omr)"/>
      <text class="svgtxt" x="206" y="160" font-weight="700" style="fill:var(--omr)">무게중심 = 기댓값 1.1</text>
    </svg>
    <div class="calc">
      <div class="ln"><span>기댓값: 0×0.2 + 1×0.5 + 2×0.3</span><span class="num">E(X) = 1.1번</span></div>
      <div class="ln"><span>제곱의 평균: 0²×0.2 + 1²×0.5 + 2²×0.3</span><span class="num">E(X²) = 1.7</span></div>
      <div class="ln"><span>분산: 1.7 − 1.1² = 1.7 − 1.21</span><span class="num">Var(X) = 0.49</span></div>
    </div>
  </div>
  <div class="say"><p>막대 판을 손가락 하나로 받친다고 생각해 보세요. 균형이 잡히는 점이 기댓값 1.1이에요. 실제로 1.1번 지각하는 날은 없지만, <b>몇 주 평균을 내면 1.1 근처</b>로 모여요.</p></div>
  <p class="linkh">공식 기호 이름표</p>
  <div class="link">
    <div class="row"><span class="term">확률변수</span><span>표본공간의 결과에 <b>숫자를 대응</b>시킨 것. 주사위 눈 1~6, 지각 횟수 0·1·2</span></div>
    <div class="row"><span class="term">이산확률분포</span><span>값이 0, 1, 2…처럼 <b>셀 수 있는</b> 분포. 11장에서 모양별로 만나요</span></div>
    <div class="row"><span class="term">E(X) = Σ x·f(x)</span><span>Σ = 다 더하기, x = 나올 수 있는 값, f(x) = 그 값의 확률. <b>값 × 확률을 다 더한 것</b> = 장기적 평균, 분포의 무게중심</span></div>
    <div class="row"><span class="term">Var(X)</span><span>E[(X − μ)²] = E(X²) − [E(X)]². μ(뮤) = 기댓값. 두 식은 같은 값(위에서 둘 다 0.49)</span></div>
    <div class="row"><span class="term">이항분포 평균·분산</span><span>평균 <b>np</b>, 분산 <b>np(1 − p)</b>. 10문제를 정답률 0.3으로 찍으면 평균 3개, 분산 10×0.3×0.7 = <b>2.1</b></span></div>
  </div>
  <details><summary>E[(X − μ)²]로 직접 계산해도 0.49인가요?</summary><div class="in">
    <p>네. 평균 1.1에서 떨어진 거리를 제곱해서 확률로 가중평균하면 돼요.</p>
    <div class="calc">
      <div class="ln"><span>(0 − 1.1)² × 0.2 = 1.21 × 0.2</span><span class="num">0.242</span></div>
      <div class="ln"><span>(1 − 1.1)² × 0.5 = 0.01 × 0.5</span><span class="num">0.005</span></div>
      <div class="ln"><span>(2 − 1.1)² × 0.3 = 0.81 × 0.3</span><span class="num">0.243</span></div>
      <div class="ln"><span>합계</span><span class="num">0.49</span></div>
    </div>
    <p>시험 계산은 "제곱의 평균 − 평균의 제곱"이 더 빨라요.</p>
  </div></details>
</section>

<p class="part">PART 2 · 기초 통계량 (17쪽)</p>

<!-- ============ 4 ============ -->
<section class="ep" id="e4">
  <div class="eph"><span class="no">4화</span><h2>"우리 학생들은 보통 몇 시간 공부하나?" 가운데 찾기</h2><span class="pg">17쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>"보통"을 한 숫자로 말하는 방법이 셋. 다 더해서 나눈 <b>평균</b>, 줄 세워 한가운데 <b>중앙값</b>, 가장 많이 나온 <b>최빈값</b>. 튀는 학생 한 명이 있으면 평균만 크게 흔들린다.</div>
  <div class="fig">
    <svg viewBox="0 0 480 150" role="img" aria-label="주간 공부시간 7명: 10, 12, 12, 14, 16, 20, 56시간. 최빈값 12, 중앙값 14, 평균 20">
      <line x1="30" y1="96" x2="460" y2="96" stroke="var(--ink)" stroke-width="1.5"/>
      <g fill="var(--blue)">
        <circle cx="100" cy="86" r="7"/><circle cx="114" cy="86" r="7"/><circle cx="114" cy="70" r="7"/><circle cx="128" cy="86" r="7"/><circle cx="142" cy="86" r="7"/><circle cx="170" cy="86" r="7"/>
      </g>
      <circle cx="422" cy="86" r="7" fill="var(--omr)"/>
      <text class="svgtxt" x="422" y="68" text-anchor="middle" font-weight="700" style="fill:var(--omr)">56시간 (1명)</text>
      <g class="svgmut" text-anchor="middle"><text x="30" y="112">0</text><text x="100" y="112">10</text><text x="170" y="112">20</text><text x="240" y="112">30</text><text x="310" y="112">40</text><text x="380" y="112">50</text><text x="450" y="112">60</text></g>
      <line x1="114" y1="20" x2="114" y2="60" stroke="var(--muted)" stroke-width="2"/>
      <text class="svgtxt" x="108" y="16" text-anchor="end">최빈값 12</text>
      <line x1="128" y1="34" x2="128" y2="60" stroke="var(--ink)" stroke-width="2"/>
      <text class="svgtxt" x="132" y="30" font-weight="700">중앙값 14</text>
      <polygon points="170,124 162,138 178,138" fill="var(--omr)"/>
      <text class="svgtxt" x="184" y="137" font-weight="700" style="fill:var(--omr)">평균 20 (56에 끌려옴)</text>
    </svg>
    <div class="calc">
      <div class="ln"><span>평균: (10+12+12+14+16+20+56) ÷ 7 = 140 ÷ 7</span><span class="num">20시간</span></div>
      <div class="ln"><span>중앙값: 줄 세워 7명 중 4번째</span><span class="num">14시간</span></div>
      <div class="ln"><span>최빈값: 두 번 나온 값</span><span class="num">12시간</span></div>
    </div>
  </div>
  <div class="say"><p>7명 중 6명이 20시간 이하인데 평균이 20시간. 56시간 공부한 학생 하나가 평균을 끌고 갔어요. 이럴 땐 <b>중앙값 14시간</b>이 "보통 학생"을 더 잘 말해 줘요. 이 끌림이 8화 왜도로 이어집니다.</p></div>
  <div class="link">
    <div class="row"><span class="term">평균 (Mean)</span><span>다 더해서 개수로 나눔. 튀는 값(이상값)에 <b>민감</b></span></div>
    <div class="row"><span class="term">중앙값 (Median)</span><span>크기 순으로 줄 세운 가운데 값. 튀는 값에 <b>둔감</b></span></div>
    <div class="row"><span class="term">최빈값 (Mode)</span><span>가장 많이 나온 값. 명목척도(가장 많은 혈액형)에도 쓸 수 있음</span></div>
  </div>
</section>

<!-- ============ 5 ============ -->
<section class="ep" id="e5">
  <div class="eph"><span class="no">5화</span><h2>평균이 같은 두 반, 뭐가 다를까: 분산과 표준편차</h2><span class="pg">17쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>A반, B반 둘 다 평균 70점. 그런데 A반은 다 비슷하고 B반은 들쭉날쭉. 이 차이를 숫자로 = <b>평균에서 평균적으로 얼마나 떨어져 있나</b>. 그게 분산, 표준편차.</div>
  <div class="fig">
    <svg viewBox="0 0 480 230" role="img" aria-label="평균 70점 선에서 학생별 편차 막대. A반은 -3, -1, 0, +1, +3으로 짧고, B반은 -15, -5, 0, +5, +15로 김">
      <text class="svgtxt" x="120" y="16" text-anchor="middle" font-weight="700">A반: 67, 69, 70, 71, 73</text>
      <text class="svgtxt" x="360" y="16" text-anchor="middle" font-weight="700">B반: 55, 65, 70, 75, 85</text>
      <line x1="20" y1="110" x2="220" y2="110" stroke="var(--ink)" stroke-width="2"/>
      <line x1="260" y1="110" x2="460" y2="110" stroke="var(--ink)" stroke-width="2"/>
      <text class="svgmut" x="20" y="105">평균 70</text>
      <text class="svgmut" x="260" y="105">평균 70</text>
      <g fill="var(--omr)">
        <rect x="32" y="110" width="24" height="9"/><rect x="70" y="110" width="24" height="3"/>
        <rect x="272" y="110" width="24" height="45"/><rect x="310" y="110" width="24" height="15"/>
      </g>
      <g fill="var(--blue)">
        <rect x="146" y="107" width="24" height="3"/><rect x="184" y="101" width="24" height="9"/>
        <rect x="386" y="95" width="24" height="15"/><rect x="424" y="65" width="24" height="45"/>
      </g>
      <rect x="108" y="109" width="24" height="2" fill="var(--muted)"/>
      <rect x="348" y="109" width="24" height="2" fill="var(--muted)"/>
      <g class="svgtxt" text-anchor="middle" font-size="11">
        <text x="44" y="132">−3</text><text x="82" y="126">−1</text><text x="120" y="126">0</text><text x="158" y="100">+1</text><text x="196" y="94">+3</text>
        <text x="284" y="168">−15</text><text x="322" y="138">−5</text><text x="360" y="126">0</text><text x="398" y="88">+5</text><text x="436" y="58">+15</text>
      </g>
      <g class="svgmut" text-anchor="middle">
        <text x="120" y="190">편차 합 0 · 제곱 합 20</text>
        <text x="360" y="190">편차 합 0 · 제곱 합 500</text>
      </g>
      <text class="svgtxt" x="120" y="214" text-anchor="middle" font-weight="700">분산 20÷5 = 4 · 표준편차 2점</text>
      <text class="svgtxt" x="360" y="214" text-anchor="middle" font-weight="700">분산 500÷5 = 100 · 표준편차 10점</text>
    </svg>
    <div class="legend"><span><i style="background:var(--blue)"></i>평균보다 위 (+)</span><span><i style="background:var(--omr)"></i>평균보다 아래 (−)</span></div>
    <div class="calc">
      <div class="ln"><span>① 각자 평균에서 얼마나 떨어졌나(편차) 구하기</span><span class="num">B: −15, −5, 0, +5, +15</span></div>
      <div class="ln"><span>② 그대로 더하면 0이 되니까 제곱해서 부호 없애기</span><span class="num">225, 25, 0, 25, 225</span></div>
      <div class="ln"><span>③ 제곱의 평균 = 분산</span><span class="num">500 ÷ 5 = 100</span></div>
      <div class="ln"><span>④ 단위를 "점"으로 되돌리려고 루트 = 표준편차</span><span class="num">√100 = 10점</span></div>
    </div>
  </div>
  <div class="say"><p>표준편차 10점은 "B반 학생들은 평균 70점에서 <b>대략 10점쯤</b> 떨어져 있다"는 뜻이에요. A반은 2점쯤. 평균은 같아도 반 분위기가 전혀 다르죠.</p></div>
  <details open><summary>왜 굳이 제곱하나요?</summary><div class="in">
    <p>평균보다 위(+)와 아래(−)가 <b>정확히 상쇄</b>돼서, 편차를 그냥 더하면 어느 반이든 늘 0이에요. B반도 −15 −5 + 0 + 5 + 15 = 0. 이러면 흩어짐을 못 재요.</p>
    <p>제곱하면 마이너스가 사라지고, 멀리 떨어진 학생은 더 크게 반영돼요(15점 차이 → 225). 대신 단위가 "점²"이 되어 버려서, 마지막에 루트를 씌워 원래 단위로 돌린 게 <b>표준편차</b>예요.</p>
  </div></details>
  <p class="linkh">공식 기호 이름표: σ² = Σ(x − μ)² ÷ N</p>
  <div class="link">
    <div class="row"><span class="term">σ² (시그마 제곱)</span><span>분산. 편차 제곱의 평균</span></div>
    <div class="row"><span class="term">σ (시그마)</span><span>표준편차 = 분산의 제곱근. <b>원래 단위와 같아서</b> 읽기 쉬움</span></div>
    <div class="row"><span class="term">x − μ</span><span>편차. 각 학생 점수(x)에서 평균(μ)을 뺀 것</span></div>
    <div class="row"><span class="term">범위</span><span>최대 − 최소. A반 6점, B반 30점. 맨 끝 두 명만 보니 <b>이상값에 민감</b></span></div>
    <div class="row"><span class="term">IQR</span><span>Q3 − Q1. 줄 세운 뒤 가운데 50%가 차지하는 폭. 양 끝 튀는 값을 안 봄</span></div>
    <div class="row"><span class="term">Z = (X − μ) / σ</span><span>"평균에서 표준편차 몇 개만큼 떨어졌나". B반 85점 → (85 − 70) ÷ 10 = <b>1.5</b>. 이렇게 바꾼 분포가 <b>표준정규분포</b>(평균 0, 표준편차 1)</span></div>
  </div>
  <div class="trap">여기서는 반 전체(모집단)라서 사람 수 N = 5로 나눴어요. 일부만 뽑은 <b>표본</b>의 분산은 <b>n − 1</b>로 나눠요. 이유는 12장 1화에서.</div>
</section>

<!-- ============ 6 ============ -->
<section class="ep" id="e6">
  <div class="eph"><span class="no">6화</span><h2>점수와 공부시간, 어느 쪽이 더 들쭉날쭉?</h2><span class="pg">17쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>표준편차 8점과 4시간은 단위가 달라 비교가 안 된다. 평균으로 나눠 <b>"평균의 몇 %만큼 흩어졌나"</b>로 바꾸면 단위가 사라진다. 그게 변동계수(CV).</div>
  <div class="fig">
    <div class="two">
      <div class="box"><span class="tag blue">국어 점수</span><h4>평균 80점 · 표준편차 8점</h4><p>8 ÷ 80 × 100 = <b>CV 10%</b></p></div>
      <div class="box"><span class="tag red">주간 공부시간</span><h4>평균 20시간 · 표준편차 4시간</h4><p>4 ÷ 20 × 100 = <b>CV 20%</b></p></div>
    </div>
    <svg viewBox="0 0 400 80" style="max-width:420px;margin-top:12px" role="img" aria-label="CV 막대 비교: 국어 10%, 공부시간 20%">
      <text class="svgtxt" x="10" y="26">국어</text>
      <rect x="80" y="12" width="140" height="20" rx="4" fill="var(--blue)"/>
      <text class="svgtxt" x="228" y="27" font-weight="700">10%</text>
      <text class="svgtxt" x="10" y="62">공부시간</text>
      <rect x="80" y="48" width="280" height="20" rx="4" fill="var(--omr)"/>
      <text class="svgtxt" x="366" y="63" font-weight="700">20%</text>
    </svg>
  </div>
  <div class="say"><p>숫자만 보면 8 &gt; 4라 국어가 더 흩어진 것 같지만, 평균 대비로 보면 <b>공부시간이 2배 더 들쭉날쭉</b>해요.</p></div>
  <div class="link">
    <div class="row"><span class="term">변동계수 (CV)</span><span>표준편차 ÷ 평균 × 100. <b>단위가 다른 변수끼리</b> 퍼짐 비교</span></div>
  </div>
  <div class="fix">요약노트의 "표준편차<b>에서</b> 평균을 나눈"은 "표준편차<b>를</b> 평균<b>으로</b> 나눈"이 맞아요. 분자가 표준편차예요.</div>
</section>

<!-- ============ 7 ============ -->
<section class="ep" id="e7">
  <div class="eph"><span class="no">7화</span><h2>공부시간이 늘면 점수도 오를까: 공분산과 상관계수</h2><span class="pg">17쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>두 칸이 <b>같은 방향으로 움직이나</b>를 재는 게 공분산. 단위에 따라 숫자가 멋대로 커져 강약을 못 읽으니, <b>−1 ~ 1로 눌러 담은 것</b>이 상관계수.</div>
  <div class="fig">
    <svg viewBox="0 0 300 210" style="max-width:360px" role="img" aria-label="학생 5명 공부시간과 점수 산점도. 평균선으로 4칸을 나누면 대부분 오른쪽 위와 왼쪽 아래에 있음">
      <rect x="150" y="20" width="120" height="85" fill="var(--ok-soft)"/>
      <rect x="30" y="105" width="120" height="80" fill="var(--ok-soft)"/>
      <rect x="30" y="20" width="120" height="85" fill="var(--omr-soft)"/>
      <rect x="150" y="105" width="120" height="80" fill="var(--omr-soft)"/>
      <line x1="150" y1="20" x2="150" y2="185" stroke="var(--muted)" stroke-dasharray="4 4"/>
      <line x1="30" y1="105" x2="270" y2="105" stroke="var(--muted)" stroke-dasharray="4 4"/>
      <text class="svgtxt" x="262" y="36" text-anchor="end" font-weight="700" style="fill:var(--ok)">둘 다 +</text>
      <text class="svgtxt" x="38" y="178" font-weight="700" style="fill:var(--ok)">둘 다 −</text>
      <text class="svgmut" x="38" y="34">곱 −</text>
      <text class="svgmut" x="262" y="178" text-anchor="end">곱 −</text>
      <g fill="var(--ink)"><circle cx="50" cy="155" r="6"/><circle cx="100" cy="105" r="6"/><circle cx="150" cy="130" r="6"/><circle cx="200" cy="55" r="6"/><circle cx="250" cy="80" r="6"/></g>
      <g class="svgmut" text-anchor="middle"><text x="50" y="200">1시간</text><text x="100" y="200">2</text><text x="150" y="200">3</text><text x="200" y="200">4</text><text x="250" y="200">5</text></g>
      <text class="svgmut" x="266" y="119" text-anchor="end">평균 70점</text>
      <text class="svgmut" x="150" y="14" text-anchor="middle">평균 3시간</text>
    </svg>
    <div class="tblwrap" style="margin-top:10px">
    <table class="act">
      <tr><th>학생</th><th>공부시간 편차</th><th>점수 편차</th><th>두 편차의 곱</th></tr>
      <tr><td>1시간 60점</td><td>−2</td><td>−10</td><td><b>+20</b></td></tr>
      <tr><td>2시간 70점</td><td>−1</td><td>0</td><td>0</td></tr>
      <tr><td>3시간 65점</td><td>0</td><td>−5</td><td>0</td></tr>
      <tr><td>4시간 80점</td><td>+1</td><td>+10</td><td><b>+10</b></td></tr>
      <tr><td>5시간 75점</td><td>+2</td><td>+5</td><td><b>+10</b></td></tr>
    </table>
    </div>
    <div class="calc">
      <div class="ln"><span>곱의 합 40 ÷ 5명 = 공분산</span><span class="num">+8 (양수 → 같이 오름)</span></div>
      <div class="ln"><span>공분산 ÷ (시간 표준편차 √2 × 점수 표준편차 √50) = 8 ÷ 10</span><span class="num">상관계수 0.8</span></div>
    </div>
  </div>
  <div class="say"><p>초록 칸(둘 다 평균 위, 둘 다 평균 아래)에 점이 많으면 곱이 +로 쌓여 공분산이 양수. 빨강 칸에 많으면 음수. 고르게 퍼져 있으면 0 근처.</p></div>
  <div class="link">
    <div class="row"><span class="term">공분산</span><span>두 변수가 같이 움직이는 정도. 양수 = 양의 관계, 음수 = 음의 관계, 0 = 선형 관계 없음. <b>범위가 정해져 있지 않아 강약 판단 불가</b> (점수를 1000점 만점으로 바꾸면 8 → 80이 되는데 관계는 그대로)</span></div>
    <div class="row"><span class="term">상관계수</span><span>공분산을 표준화. <b>−1 ~ 1</b>. 1에 가까우면 강한 양의 직선, −1이면 강한 음의 직선. 단위를 바꿔도 0.8 그대로</span></div>
  </div>
  <div class="fig">
    <div class="two">
      <svg viewBox="0 0 220 150" role="img" aria-label="뒤집힌 U자 모양: 공부시간 중간일 때 점수 최고, 양 끝은 낮음. 공분산은 0">
        <line x1="20" y1="80" x2="210" y2="80" stroke="var(--muted)" stroke-dasharray="4 4"/><text class="svgmut" x="115" y="96" text-anchor="middle">평균 70점</text>
        <path d="M30 120 Q 115 -40 200 120" fill="none" stroke="var(--line)" stroke-width="2"/>
        <g fill="var(--violet)"><circle cx="30" cy="120" r="6"/><circle cx="72" cy="60" r="6"/><circle cx="115" cy="40" r="6"/><circle cx="158" cy="60" r="6"/><circle cx="200" cy="120" r="6"/></g>
        <text class="svgtxt" x="115" y="140" text-anchor="middle" font-weight="700">공분산 0, 그래도 관계 있음</text>
      </svg>
      <div class="box"><h4>공분산 0 ≠ 독립</h4><p>공부시간 1~5시간에 점수 60, 75, 80, 75, 60. 너무 오래 하면 지쳐서 떨어지는 <b>곡선 관계</b>예요. 편차 곱을 더하면 +와 −가 상쇄돼 공분산 0. 공분산은 <b>직선 관계만</b> 잡아내요.</p></div>
    </div>

<section class="ep" id="qz">
  <div class="eph"><span class="no">끝</span><h2>확인 8문제</h2></div>
  <p style="margin:0 0 10px;color:var(--muted)">답을 떠올려 본 뒤 눌러서 확인하세요. 계산 문제는 계산 줄을 보며 따라 해도 돼요.</p>
  <div class="quiz">
    <details><summary>온도(섭씨)는 어떤 척도? 절대 0이 있고 사칙연산이 다 되는 척도는?</summary><div class="in"><p>온도는 <b>등간척도</b>(0도가 "없음"이 아님). 절대 0이 있으면 <b>비율척도</b>, 가장 많은 정보를 가진 척도. 학년, 순위는 순서척도.</p></div></details>
    <details><summary>A, B가 독립일 때 성립하는 것은? 동전 앞면과 뒷면의 관계는?</summary><div class="in"><p>독립이면 <b>P(A∩B) = P(A) × P(B)</b>, P(A|B) = P(A). 동시에 못 나오는 앞면과 뒷면은 <b>배반사건</b>(교집합 0).</p></div></details>
    <details><summary>이항분포 B(10, 0.3)의 평균과 분산은?</summary><div class="in"><p>평균 np = <b>3</b>, 분산 np(1 − p) = 10 × 0.3 × 0.7 = <b>2.1</b>.</p></div></details>
    <details><summary>X가 0, 1, 2일 확률이 0.2, 0.5, 0.3이면 E(X)와 Var(X)는?</summary><div class="in"><p>E(X) = 0.5 + 0.6 = <b>1.1</b>. E(X²) = 0.5 + 1.2 = 1.7, Var(X) = 1.7 − 1.21 = <b>0.49</b>.</p></div></details>
    <details><summary>단위가 다른 두 변수의 퍼짐을 비교하려면?</summary><div class="in"><p><b>변동계수(CV)</b> = 표준편차 ÷ 평균 × 100. 평균으로 나눠 단위가 사라지니까요.</p></div></details>
    <details><summary>"공분산이 0이면 두 변수는 반드시 독립이다" 맞나?</summary><div class="in"><p><b>틀림.</b> 공분산 0은 직선 관계가 없다는 뜻일 뿐. U자 같은 곡선 관계가 있을 수 있어요. 거꾸로 독립이면 공분산 0은 맞음. 상관계수 범위는 −1 ~ 1.</p></div></details>
    <details><summary>왜도 &gt; 0일 때 평균, 중앙값, 최빈값 순서는? 정규분포 첨도는?</summary><div class="in"><p>평균이 꼬리(오른쪽)를 따라가서 <b>최빈값 &lt; 중앙값 &lt; 평균</b>. 정규분포 첨도는 <b>3</b>(3을 빼면 0).</p></div></details>
    <details><summary>summary()에서 Median 28.0 &lt; Mean 29.7이면? 빈도만 나오는 변수는?</summary><div class="in"><p>평균이 더 크니 <b>왜도 &gt; 0</b>. 빈도만 나오면 <b>범주형</b>. NA's는 결측값 개수.</p></div></details>
  </div>
  <div class="end">
    <h3>10장 한 문장</h3>
    <p>원장님이 성적표를 열어 보니 칸마다 <b>숫자의 급</b>(명목, 순서, 등간, 비율)이 다르고, 반 겹침은 <b>칸 세기</b>(덧셈 정리, 조건부, 독립, 배반)로 풀리고, 숫자 더미는 <b>가운데</b>(평균, 중앙값, 최빈값), <b>흩어짐</b>(분산, 표준편차, CV), <b>같이 움직임</b>(공분산, 상관), <b>모양</b>(왜도, 첨도)으로 요약된다. 다음 장은 "전국 학생을 다 볼 수 없으니 일부만 뽑자".</p>

학년</text><text class="svgmut" x="166" y="40">2학년</text><text class="svgmut" x="166" y="60">3학년</text><text class="svgmut" x="166" y="80">4학년</text></svg>

    <div class="row"><span class="term">층화</span><span>층 <b>내부는 동질적</b>, 층 <b>간은 이질적</b>. 각 층에서 뽑기</span></div>
    <div class="row"><span class="term">랜덤(단순무작위) / 계통</span><span>무작위로 뽑기 / 번호를 매겨 일정 간격으로</span></div>

  <div class="memo"><b>"내부가 동질이면 층화."</b> 층(層)은 지층처럼 같은 것끼리 쌓인 줄. 집락(集落)은 마을처럼 다양한 사람이 모여 사는 덩어리.</div>

<!-- ============ 4 ============ -->
<section class="ep" id="e4">
  <div class="eph"><span class="no">4화</span><h2>"몇 번, 몇 명"을 세는 분포 7형제 (이산)</h2><span class="pg">19쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>전부 <b>"성공/실패를 반복해서 무엇을 세나"</b>의 변형이다. 한 번이면 베르누이, n번 중 성공 수면 이항, 첫 성공까지 기다리면 기하, 일정 시간 동안 몇 번이면 포아송.</div>
  <div class="fig">
    <div class="two">
      <div class="box"><span class="tag blue">베르누이</span>
        <svg viewBox="0 0 150 92" style="max-width:220px" role="img" aria-label="두 막대: 불합격 0.7, 합격 0.3"><line x1="5" y1="70" x2="145" y2="70" stroke="var(--line)"/><g fill="var(--blue)"><rect x="30" y="20" width="36" height="50"/><rect x="84" y="49" width="36" height="21"/></g><text class="svgmut" x="48" y="84" text-anchor="middle">0 실패</text><text class="svgmut" x="102" y="84" text-anchor="middle">1 성공</text></svg>
        <h4>결과가 둘 중 하나인 1회 시행</h4><p>한 학생이 이번 모의고사에 합격선을 넘나, 못 넘나.</p></div>
      <div class="box"><span class="tag blue">이항</span>
        <svg viewBox="0 0 150 92" style="max-width:220px" role="img" aria-label="10번 중 성공 횟수 막대, 3 근처가 가장 높음"><line x1="5" y1="70" x2="145" y2="70" stroke="var(--line)"/><g fill="var(--blue)"><rect x="11" y="65" width="10" height="5"/><rect x="23" y="47" width="10" height="23"/><rect x="35" y="26" width="10" height="44"/><rect x="46" y="20" width="10" height="50"/><rect x="58" y="32" width="10" height="38"/><rect x="70" y="51" width="10" height="19"/><rect x="82" y="63" width="10" height="7"/><rect x="94" y="68" width="10" height="2"/></g><text class="svgmut" x="16" y="84" text-anchor="middle">0</text><text class="svgmut" x="134" y="84" text-anchor="middle">10</text></svg>

  <div class="trap"><b>포아송은 이산</b>이에요. "연속형이 아닌 것은?"에 t, F, 카이제곱 사이로 포아송이 끼어 나와요. 전화 수는 2.5통이 없으니 셀 수 있는 값.</div>
</section>

    <tr><td>카이제곱</td><td><b>범주</b>(적합도, 독립성, 동질성), <b>모분산</b></td><td>반(班)과 합격 여부는 관계가 있나?</td></tr>
    <tr><td>F분포</td><td><b>분산 두 개 비교</b></td><td>A반과 B반 점수 흩어짐이 같나? (같아야 t검정 쓰기 편함)</td></tr>
  </table>
  </div>
  <div class="memo"><b>t = 평균, 카이제곱 = 범주·분산, F = 분산 두 개 비교.</b> 이름 순서대로 "티(평균) 카(범주) 에프(분산 비)".</div>
  <details><summary>왜 카이제곱과 F는 0에서 시작하고 오른쪽으로 꼬리가 길까?</summary><div class="in">
    <p>카이제곱은 <b>제곱의 합</b>이라 음수가 될 수 없어요. F는 <b>카이제곱 ÷ 카이제곱</b>(분산 ÷ 분산)이라 역시 음수가 없죠. 그래서 둘 다 0부터 시작하고, 가끔 아주 큰 값이 나오니 오른쪽 꼬리가 길어요.</p>
    <p>t와 정규는 평균에서 위아래로 벗어난 정도라 좌우 대칭이에요. t는 표본이 커질수록(30 이상) 정규분포와 거의 같아져요.</p>
  </div></details>
</section>

    <details><summary>번호를 매겨 일정 간격으로 뽑는 방법은?</summary><div class="in"><p><b>계통추출</b>. 3번, 7번, 11번…</p></div></details>
    <details><summary>한 시간 동안 콜센터 전화 수는 무슨 분포? 이산인가 연속인가?</summary><div class="in"><p><b>포아송분포</b>, 횟수를 세니 <b>이산</b>. "연속형이 아닌 것"으로도 나와요.</p></div></details>

    <details><summary>표본이 30 미만일 때 평균 검정 분포는? 두 집단 분산이 같은지 검정하는 분포는?</summary><div class="in"><p>소표본 평균 = <b>t분포</b>(꼬리 두꺼움). 분산 두 개의 비율 = <b>F분포</b>.</p></div></details>
    <details><summary>동전 3개를 던질 때 앞면 개수의 기댓값은?</summary><div class="in"><p>0×1/8 + 1×3/8 + 2×3/8 + 3×1/8 = 12/8 = <b>1.5</b>. 지름길 np = 3 × 0.5.</p></div></details>
    <details><summary>중심극한정리로 옳은 것: 표본이 커지면 무엇이 정규분포에 가까워지나?</summary><div class="in"><p>모집단 분포와 상관없이 <b>표본평균의 분포</b>가 정규분포에 가까워져요. 개별 값이 아님. 분산 σ²/n은 오히려 작아짐.</p></div></details>
    <details><summary>표본평균의 표준편차(표준오차)는? 분산은?</summary><div class="in"><p>표준오차 <b>σ/√n</b>, 분산 <b>σ²/n</b>.</p></div></details>

      <div class="st hi"><span class="nm">표본평균 x̄</span><span class="rg">75점</span><span class="ex">25명으로 계산<br>→ μ의 짐작</span></div>
      <div class="st"><span class="nm">모분산 σ²</span><span class="rg">모름</span><span class="ex">진짜 흩어짐</span></div>
      <div class="st hi"><span class="nm">표본분산 s²</span><span class="rg">÷ (n − 1)</span><span class="ex">25명으로 계산<br>→ σ²의 짐작</span></div>
    </div>
    <p class="arrowline">모르는 진짜 값(모수) ← 표본으로 계산한 값(추정량)으로 짐작</p>
  </div>
  <p class="linkh">좋은 추정량의 조건 4가지 = 좋은 궁수의 조건</p>
  <div class="fig">
    <div class="two">
      <div class="box">
        <svg viewBox="0 0 120 80" style="max-width:150px" role="img" aria-label="화살이 과녁 중심 주변에 고르게 퍼져 치우침이 없음">
          <circle cx="60" cy="40" r="36" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/><circle cx="60" cy="40" r="10" fill="var(--omr-soft)" stroke="var(--omr)" stroke-width="2"/>
          <g fill="var(--ink)"><circle cx="44" cy="30" r="3"/><circle cx="76" cy="34" r="3"/><circle cx="52" cy="56" r="3"/><circle cx="70" cy="52" r="3"/><circle cx="60" cy="20" r="3"/></g>
        </svg>
        <h4>불편성 (Unbiasedness)</h4><p>기댓값 = 모수. 여러 번 쏘면 <b>평균적으로 중심</b>. 편향 0.</p></div>
      <div class="box">
        <svg viewBox="0 0 120 80" style="max-width:150px" role="img" aria-label="화살이 과녁 중심에 촘촘히 모임">
          <circle cx="60" cy="40" r="36" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/><circle cx="60" cy="40" r="10" fill="var(--omr-soft)" stroke="var(--omr)" stroke-width="2"/>
          <g fill="var(--ink)"><circle cx="56" cy="37" r="3"/><circle cx="64" cy="39" r="3"/><circle cx="59" cy="45" r="3"/><circle cx="62" cy="34" r="3"/><circle cx="55" cy="43" r="3"/></g>
        </svg>
        <h4>효율성 (Efficiency)</h4><p>분산이 작음. 중심 근처에 <b>촘촘히</b> 모임.</p></div>
      <div class="box"><h4>일치성 (Consistency)</h4><p>n이 커질수록 모수에 가까워짐. 11장 7화처럼 25명보다 100명 평균이 진짜 평균에 더 붙음.</p></div>
      <div class="box"><h4>충족성 (Sufficiency)</h4><p>모집단에 대한 정보를 표본에서 <b>충분히</b> 뽑아 씀. 버리는 정보가 없음.</p></div>
    </div>
  </div>
  <div class="memo"><b>"불효일충"</b>: 불효자는 일찍 충전. 불편성, 효율성, 일치성, 충족성. "독립성"은 끼어든 오답이에요.</div>
  <details><summary>왜 표본분산은 n이 아니라 n − 1로 나누나?</summary><div class="in">
    <p>표본은 <b>자기 평균</b>을 기준으로 흩어짐을 재요. 자기 평균은 늘 자기 점들 한가운데라서, 진짜 평균에서 잰 것보다 거리가 <b>조금 짧게</b> 나와요. 그래서 n으로 나누면 흩어짐을 <b>작게 짐작</b>(편향)해요.</p>
    <p>작은 예: 학생이 60, 70, 80점 셋뿐인 모집단(진짜 분산 66.7). 여기서 2명을 복원추출로 뽑는 9가지 경우를 다 따져 보면:</p>
    <div class="calc">
      <div class="ln"><span>n(=2)으로 나눈 분산 9개의 평균</span><span class="num">33.3 (너무 작음)</span></div>
      <div class="ln"><span>n − 1(=1)로 나눈 분산 9개의 평균</span><span class="num">66.7 (진짜와 같음)</span></div>
    </div>
    <p>n − 1로 나눠야 평균적으로 딱 맞아요 = <b>불편추정량</b>. 10장의 반 전체(모집단) 분산은 N으로 나눈 것과 구별하세요.</p>
  </div></details>
</section>

<section class="ep" id="e3">
  <div class="eph"><span class="no">3화</span><h2>법정에 선 특강: 귀무가설과 대립가설</h2><span class="pg">21쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>재판은 <b>"무죄"를 먼저 가정</b>하고, 증거가 충분할 때만 유죄를 선고한다. 가설검정도 <b>"효과 없다(귀무가설)"를 먼저 믿고</b>, 데이터가 충분히 강할 때만 "효과 있다(대립가설)"로 판결한다.</div>
  <div class="fig">
    <div class="tblwrap">
    <table class="act">
      <tr><th>법정</th><th>가설검정</th><th>원장님 특강 재판</th></tr>
      <tr><td>무죄 추정</td><td><b>귀무가설 H0</b></td><td>"특강은 효과 없다. 수강생 평균도 70점이다" (μ = 70)</td></tr>
      <tr><td>검사의 주장</td><td><b>대립가설 H1</b></td><td>"특강은 효과 있다. 평균이 70점이 아니다" (μ ≠ 70)</td></tr>
      <tr><td>증거</td><td>표본 데이터</td><td>25명 평균 75점</td></tr>
      <tr><td>"무죄라면 이런 증거가 나올 확률"</td><td><b>p-value</b></td><td>효과 없는데도 75점 이상(또는 65점 이하)이 나올 확률</td></tr>
      <tr><td>유죄 판결 기준선</td><td><b>유의수준 α</b></td><td>보통 0.05 (5%)</td></tr>
      <tr><td>유죄 / 무죄 판결</td><td>H0 기각 / 채택</td><td>"효과 있다" / "효과 있다고 할 수 없다"</td></tr>
    </table>
    </div>
  </div>
  <div class="say"><p>왜 "효과 없다"를 먼저 믿을까요? <b>"같다, 차이 없다"는 딱 하나의 값</b>(μ = 70)이라 계산의 출발점이 되기 때문이에요. "효과 있다"는 72점인지 80점인지 정해지지 않아서 계산을 시작할 수 없어요.</p></div>
  <div class="link">
    <div class="row"><span class="term">귀무가설 (H0)</span><span>"차이가 없다, 같다, 효과 없다, 관련 없다". Null = 0, 아무 일도 없다</span></div>
    <div class="row"><span class="term">대립가설 (H1)</span><span>"차이가 있다, 크다, 작다". <b>연구자가 증명하고 싶은 주장</b></span></div>
  </div>
  <div class="trap">"신약이 효과가 있다", "A가 B보다 크다", "두 변수는 관련이 있다"는 전부 <b>대립가설</b>. 귀무가설은 늘 <b>"같다, 없다"</b> 쪽이에요.</div>
</section>

      <line x1="390" y1="96" x2="390" y2="150" stroke="var(--omr)" stroke-width="3"/>

      <text class="svgtxt" x="240" y="30" text-anchor="middle" font-weight="700">효과 없는 세상의 25명 평균</text>

      <text class="svgmut" x="240" y="184" text-anchor="middle">기준선 바깥(노랑) = α 5% · 빨강 = p-value 약 1.2%</text>
      <text class="svgmut" x="240" y="200" text-anchor="middle">빨강은 노랑 안에 들어 있음 → p &lt; α → 귀무가설 기각</text>
    </svg>
    <div class="calc">
      <div class="ln"><span>① 효과 없는 세상의 중심 70점에서 몇 표준오차 떨어졌나: (75 − 70) ÷ 2</span><span class="num">2.5칸</span></div>
      <div class="ln"><span>② 그 세상에서 2.5칸 이상 튈 확률 (양쪽 합)</span><span class="num">p ≈ 0.012</span></div>
      <div class="ln"><span>③ 기준선 α와 비교: 0.012 &lt; 0.05</span><span class="num">H0 기각</span></div>
      <div class="ln"><span>판결: "특강은 효과가 있다" (100번 중 1번꼴 우연은 믿기 어려움)</span><span class="num">대립가설 채택</span></div>
    </div>
  </div>
  <div class="two" style="margin-top:12px">
    <div class="box"><span class="tag green">평균 75점이었다면</span><h4>p ≈ 0.012 &lt; 0.05</h4><p>우연이라기엔 너무 드묾 → <b>귀무가설 기각</b>, 효과 있음.</p></div>
    <div class="box"><span class="tag red">평균 72점이었다면</span><h4>p ≈ 0.32 &gt; 0.05</h4><p>(72 − 70) ÷ 2 = 1칸. 효과 없어도 3번에 1번은 나옴 → <b>귀무가설 채택</b>, 효과 있다고 할 수 없음.</p></div>
  </div>
  <div class="link">
    <div class="row"><span class="term">p-value (유의확률)</span><span>귀무가설이 참이라고 할 때, <b>지금 같은 결과 또는 더 극단적인 결과</b>가 나올 확률. 작을수록 "우연이라기엔 드묾"</span></div>
    <div class="row"><span class="term">유의수준 (α)</span><span>유죄 판결 기준선. 보통 <b>0.05</b>. 정확히는 "귀무가설이 참인데 기각하는 실수(1종 오류)를 몇 %까지 감수하나"</span></div>
    <div class="row"><span class="term">기각 (Reject)</span><span>p &lt; α → 귀무가설 기각 = 대립가설 채택. p &gt; α → 귀무가설 채택(기각 못 함)</span></div>
  </div>
  <div class="memo"><b>"p가 작으면 H0는 간다(기각)."</b> R 결과 해석 문제는 p-value와 0.05 비교 한 번으로 거의 다 풀려요.</div>
  <div class="fix">요약노트의 "p-value는 귀무가설을 지지하는 정도"는 대략적인 표현이에요. 정확한 정의는 위 "귀무가설이 참일 때 이런 결과 이상이 나올 확률". 또 "귀무가설 채택"은 무죄 판결이 "결백 증명"이 아니듯 <b>"효과 있다고 할 증거가 부족하다"</b>는 뜻이에요.</div>
  <details><summary>2화 신뢰구간과 이 판결은 어떻게 연결되나?</summary><div class="in">
    <p>95% 신뢰구간 71.08~78.92 안에 70이 <b>없어요</b>. 그래서 α = 0.05 양측검정에서 "μ = 70"이 기각되는 것과 같은 결론이에요.</p>
    <p>99% 신뢰구간 69.85~80.15에는 70이 <b>들어 있어요</b>. 실제로 p ≈ 0.012는 α = 0.01보다 커서, 기준을 1%로 엄격하게 잡으면 기각하지 못해요. 기준선을 어디 두느냐에 따라 판결이 바뀔 수 있어요.</p>
  </div></details>
</section>

<!-- ============ 5 ============ -->
<section class="ep" id="e5">
  <div class="eph"><span class="no">5화</span><h2>판결도 틀릴 수 있다: 1종 오류와 2종 오류</h2><span class="pg">21쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>진실은 둘(효과 없음/있음), 판결도 둘(채택/기각). 그래서 <b>2×2 칸</b>이 생기고 틀리는 칸이 두 개다. <b>무죄인데 유죄 판결 = 1종 오류(α)</b>, <b>유죄인데 무죄 판결 = 2종 오류(β)</b>.</div>
  <div class="fig">
    <div class="cm" role="table" aria-label="1종 오류와 2종 오류 표: 귀무가설이 참인데 기각하면 1종 오류, 거짓인데 채택하면 2종 오류">
      <div class="corner">진실 ↓<br>판결 →</div>
      <div class="h">H0 채택<br>(무죄 판결)</div>
      <div class="h">H0 기각<br>(유죄 판결)</div>
      <div class="h">H0 참<br>(효과 없음, 무죄)</div>
      <div class="c tn"><span class="nm">맞음</span><span class="v">1 − α</span><span class="d">효과 없는 특강을<br>효과 없다고 봄</span></div>
      <div class="c fp"><span class="nm">1종 오류</span><span class="v">α</span><span class="d">효과 없는데 "효과 있다"<br>(무죄인데 유죄)</span></div>
      <div class="h">H0 거짓<br>(효과 있음, 유죄)</div>
      <div class="c fn"><span class="nm">2종 오류</span><span class="v">β</span><span class="d">효과 있는데 놓침<br>(유죄인데 무죄)</span></div>
      <div class="c tp"><span class="nm">맞음</span><span class="v">1 − β</span><span class="d">진짜 효과를 잡아냄<br>= <b>검정력</b></span></div>
    </div>
    <p class="cap">16장 혼동행렬과 같은 2×2 칸. 1종 = 헛짚음(FP), 2종 = 놓침(FN)</p>
  </div>
  <div class="link">
    <div class="row"><span class="term">1종 오류</span><span>귀무가설이 참인데 기각. 확률 = <b>α (유의수준)</b>. 원장님이 효과 없는 특강을 과장 광고하는 실수</span></div>
    <div class="row"><span class="term">2종 오류</span><span>귀무가설이 거짓인데 채택. 확률 = <b>β</b>. 좋은 특강을 "효과 없음"이라 접어 버리는 실수</span></div>
    <div class="row"><span class="term">검정력</span><span><b>1 − β</b>. 진짜 효과가 있을 때 잡아내는 힘 (16장 재현율과 같은 개념)</span></div>
  </div>
  <div class="memo"><b>1종 = 첫 번째로 무서운 실수 = 억울한 사람 처벌.</b> 법정이 이걸 가장 피하려 하니 α를 0.05처럼 작게 정해 둬요.</div>
</section>

<!-- ============ 7 ============ -->
<section class="ep" id="e7">
  <div class="eph"><span class="no">7화</span><h2>종 모양을 믿을 수 없을 때: 모수 검정과 비모수 검정</h2><span class="pg">22쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>t검정은 "데이터가 정규분포 근처"라는 <b>가정을 깔고</b> 평균, 분산을 쓴다(모수 검정). 가정을 못 믿으면 점수 대신 <b>순위나 부호</b>만 보고 판정한다(비모수 검정).</div>
  <div class="fig">

    </svg>
  </div>
  <div class="two" style="margin-top:12px">
    <div class="box"><span class="tag blue">모수 검정</span><h4>정규분포 가정 O · 평균, 분산 사용</h4><p>t검정(단일, 대응, 독립), ANOVA, F검정. 독립표본 t검정은 <b>등분산</b>을 가정하고, 아니면 <b>Welch의 t검정</b>.</p></div>
    <div class="box"><span class="tag green">비모수 검정</span><h4>분포 가정 X · 순위나 부호 사용</h4><p>부호검정, 윌콕슨 순위합검정, 맨-휘트니 U검정, 크루스칼-왈리스 검정(3집단 이상), 콜모고로프-스미르노프 검정, 카이제곱 검정.</p></div>
  </div>
  <div class="link">
    <div class="row"><span class="term">모수적 (Parametric)</span><span>모집단이 특정 분포(주로 정규)를 따른다고 <b>가정</b>하고 그 분포의 값(모수: 평균, 분산)을 다룸</span></div>
    <div class="row"><span class="term">등분산</span><span>두 집단 흩어짐이 같다는 가정. 11장 F분포로 확인</span></div>
    <div class="row"><span class="term">Welch의 t검정</span><span>등분산이 아닐 때 쓰는 독립표본 t검정</span></div>
    <div class="row"><span class="term">비모수적 (Non-parametric)</span><span>분포 가정을 못 할 때. 값 대신 <b>순위(몇 등)</b>나 <b>부호(+, −)</b>로 검정</span></div>
  </div>
  <div class="memo"><b>비모수 = 순위·부호.</b> 보기에 <b>t검정, ANOVA, F검정</b>이 있으면 그건 모수 검정이에요. 이름에 "순위", "부호", 사람 이름(윌콕슨, 맨-휘트니, 크루스칼-왈리스, 콜모고로프-스미르노프)이 붙으면 비모수.</div>
</section>

<!-- ============ quiz ============ -->
<section class="ep" id="qz">
  <div class="eph"><span class="no">끝</span><h2>확인 8문제</h2></div>
  <p style="margin:0 0 10px;color:var(--muted)">법정 장면을 떠올리며 답해 보세요. 3문제만 떠올라도 오늘은 충분해요.</p>
  <div class="quiz">
    <details><summary>추정량의 조건이 아닌 것은? (불편성, 효율성, 일치성, 독립성) 기댓값이 모수와 같은 성질은?</summary><div class="in"><p><b>독립성</b>이 아님(불효일충). 기댓값 = 모수는 <b>불편성</b>. 분산이 작으면 효율성, n이 커질수록 가까워지면 일치성.</p></div></details>
    <details><summary>모분산을 알 때 95% 신뢰구간의 z값은? 99%는? 모분산을 모르면?</summary><div class="in"><p>95% <b>1.96</b>, 99% <b>2.576</b>. 모르면 <b>자유도 n − 1인 t분포</b>.</p></div></details>
    <details><summary>신뢰수준을 높이면 구간은? 표본을 늘리면?</summary><div class="in"><p>신뢰수준↑ → <b>넓어짐</b>(더 큰 그물). 표본↑ → 표준오차↓ → <b>좁아짐</b>.</p></div></details>
    <details><summary>귀무가설로 적절한 것: "신약이 효과가 있다" vs "두 집단 평균은 같다"</summary><div class="in"><p><b>"두 집단의 평균은 같다"</b>. 귀무가설은 늘 차이 없음, 같음.</p></div></details>
    <details><summary>p = 0.03, α = 0.05면? 두 학교 성적 t검정 p = 0.5515면?</summary><div class="in"><p>0.03 &lt; 0.05 → <b>귀무가설 기각</b>. 0.5515 &gt; 0.05 → 귀무가설 채택 → <b>두 학교 성적은 차이가 없다</b>.</p></div></details>
    <details><summary>대립가설이 "두 평균은 같지 않다"면 양측? 단측? 같은 환자의 약 복용 전후 혈압은 어떤 t검정?</summary><div class="in"><p>"같지 않다(≠)" = <b>양측검정</b>. 같은 대상 전후 = <b>대응표본 t검정</b>.</p></div></details>
    <details><summary>귀무가설이 참인데 기각하는 오류는? 그 확률은?</summary><div class="in"><p><b>1종 오류</b>(무죄인데 유죄), 확률 <b>α</b>. 거짓인데 채택은 2종 오류(β), 검정력은 1 − β.</p></div></details>
    <details><summary>등분산이 아닐 때 독립표본 검정은? 비모수 검정이 아닌 것은? 비모수의 특징은?</summary><div class="in"><p><b>Welch의 t검정</b>. 비모수가 아닌 것은 <b>독립표본 t검정</b>(모수). 비모수는 분포 가정 없이 <b>순위나 부호</b>를 이용.</p></div></details>
  </div>
  <div class="end">
    <h3>12장 한 문장</h3>
    <p>원장님은 특강반 25명 평균 75점으로 진짜 평균을 <b>짐작</b>하고(점추정: 불효일충, 구간추정: 95% 그물 71~79점), "특강은 효과 없다"(<b>귀무가설</b>)를 먼저 믿은 채 <b>그 세상에서 75점이 나올 확률</b>(p ≈ 0.012)이 기준선 α = 0.05보다 작아서 <b>"효과 있다"고 판결</b>했다. 판결은 틀릴 수 있고(1종 α, 2종 β), 데이터 모양을 못 믿으면 <b>순위로 검정</b>한다(비모수).</p>
  </div>
</section>

  <div class="say"><p>선 B는 점 3개를 정확히 지나는데도 졌어요. 두 명을 5점씩 크게 놓쳤기 때문이에요. 최소제곱법은 <b>몇 명을 크게 틀리느니, 모두를 조금씩 틀리는 선</b>을 좋아해요.</p></div>

    <div class="row"><span class="term">잔차</span><span><b>실제 관측값 − 예측값</b>. 점과 선 사이 세로 거리</span></div>
    <div class="row"><span class="term">최소제곱법</span><span>잔차 제곱합(SSE)이 <b>최소</b>인 선을 고르는 방법 = 회귀계수 추정법. 최소자승법이라고도 함</span></div>

  <div class="fix">요약노트의 "잔차 = 계산값과 예측값의 차이"는 틀린 표현이에요. 잔차는 <b>실제 관측값과 예측값의 차이</b>.</div>
  <details><summary>왜 그냥 더하지 않고 제곱해서 더하나?</summary><div class="in">
    <p>선 A 잔차를 그냥 더하면 0 + 1 − 3 + 3 − 1 = <b>0</b>. 위로 빗나간 것과 아래로 빗나간 것이 서로 지워져서 "하나도 안 틀렸다"처럼 보여요.</p>
    <p>제곱하면 전부 양수가 되고, 크게 틀린 것(−5 → 25)은 더 크게 벌점을 받아요. 그래서 "제곱"합.</p>
    <p>15장 로지스틱은 정답이 0/1이라 거리를 재기 어색해서 <b>최대우도법</b>을 써요. 짝: 선형회귀 = 최소제곱법, 로지스틱 = 최대우도법.</p>
  </div></details>
</section>

<section class="ep" id="e3">
  <div class="eph"><span class="no">3화</span><h2>이 선, 몇 점짜리 설명일까</h2><span class="pg">23쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>점수가 학생마다 다른 이유(전체 변동) 중에서 <b>공부 시간으로 설명된 몫</b>이 얼마인가. 그 비율이 <b>R²(결정계수)</b>.</div>
  <div class="fig">
    <svg viewBox="0 0 400 260" style="max-width:460px" role="img" aria-label="4시간 학생 한 명의 점수 80은 평균 68보다 12 높고, 그중 9는 선이 설명하고 3은 잔차로 남음">

    <div class="tblwrap" style="margin-top:10px">
      <table class="act">
        <tr><th>학생</th><th>실제 − 평균</th><th>예측 − 평균</th><th>실제 − 예측(잔차)</th></tr>

        <tr><td>4시간</td><td class="num">+12</td><td class="num">+9</td><td class="num">+3</td></tr>
        <tr><td>5시간</td><td class="num">+17</td><td class="num">+18</td><td class="num">−1</td></tr>
        <tr><td>제곱해서 합</td><td class="num"><b>SST 830</b></td><td class="num"><b>SSR 810</b></td><td class="num"><b>SSE 20</b></td></tr>

      <div class="ln"><span>R² = SSR ÷ SST = 810 ÷ 830</span><span class="num">≈ 0.976</span></div>

  <div class="say"><p>R² ≈ 0.976은 "학생들 점수가 서로 다른 이유의 <b>약 97.6%</b>를 공부 시간 하나로 설명한다"는 뜻이에요. 0이면 선이 아무것도 설명 못 함, 1이면 모든 점이 선 위에 딱.</p></div>
  <div class="link">

    <div class="row"><span class="term">SSR</span><span>Regression. 선(회귀)이 설명한 몫</span></div>
    <div class="row"><span class="term">SSE</span><span>Error. 설명 못 하고 남은 몫 = 잔차 제곱합. 최소제곱법이 줄이는 그것</span></div>
    <div class="row"><span class="term">R² 결정계수</span><span><b>SSR / SST = 1 − SSE / SST</b>. 0 ~ 1 사이, 클수록 설명력 높음</span></div>
    <div class="row"><span class="term">수정된 R²</span><span>변수 개수만큼 깎아 준 R². <b>다중회귀</b>에서 비교할 때 사용</span></div>
  </div>
  <div class="memo"><b>R은 Regression(회귀) = 설명된 것, E는 Error(오차) = 설명 못 한 것.</b> R²는 "설명된 것 ÷ 전체"니까 분자에 R이 와요.</div>
  <div class="trap">변수를 하나 더 넣으면 쓸모없는 변수라도 R²는 <b>절대 내려가지 않아요</b>(같거나 조금이라도 오름). "형제 수", "신발 크기"를 넣어도 R²가 오르니 속기 쉬워서, 변수가 여럿이면 <b>수정된 R²</b>를 봐요. 9화에서 실제로 확인해요.</div>
</section>

<!-- ============ 6 ============ -->
<section class="ep" id="e6">
  <div class="eph"><span class="no">6화</span><h2>원인끼리 너무 닮으면, 누구 공인지 모른다</h2><span class="pg">24쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>"공부 시간"과 "자습실에 있던 시간"을 같이 넣으면 둘이 거의 같이 움직여서, 기계가 <b>점수 오른 공을 누구에게 줄지 헷갈린다</b>. 계수가 들쭉날쭉 믿을 수 없어진다. 이게 다중공선성.</div>
  <div class="fig">
    <svg viewBox="0 0 380 196" style="max-width:440px" role="img" aria-label="공부 시간과 자습실 시간 원이 거의 겹치고, 둘 다 점수 원과 같은 부분을 겹침">
      <circle cx="260" cy="90" r="72" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="2"/>
      <circle cx="140" cy="80" r="58" fill="var(--omr-soft)" fill-opacity=".7" stroke="var(--omr)" stroke-width="2"/>
      <circle cx="158" cy="100" r="58" fill="var(--amber-soft)" fill-opacity=".6" stroke="var(--amber)" stroke-width="2"/>
      <text class="svgtxt" x="300" y="94" text-anchor="middle" font-weight="700">Y 점수</text>
      <text x="104" y="46" text-anchor="middle" font-weight="700" fill="var(--omr)" font-size="12" font-family="var(--font)">X₁ 공부 시간</text>
      <text x="130" y="168" text-anchor="middle" font-weight="700" fill="var(--amber)" font-size="12" font-family="var(--font)">X₂ 자습실 시간</text>
      <line x1="202" y1="104" x2="236" y2="178" stroke="var(--ink)" stroke-width="1"/>
      <circle cx="202" cy="104" r="3" fill="var(--ink)"/>
      <text class="svgtxt" x="240" y="186" font-weight="700">겹친 공, 누구 몫?</text>
    </svg>
    <p class="cap">X₁과 X₂가 거의 겹쳐 있어서, Y와 겹친 부분을 둘 중 누구 몫으로 할지 정할 수 없어요.</p>
    <p class="linkh" style="margin-top:12px">VIF = "이 변수는 나머지 변수들로 얼마나 흉내 낼 수 있나"</p>
    <div class="calc">
      <div class="ln"><span>X₂를 X₁으로 맞혀 봤을 때 R²ᵢ = 0 (전혀 못 흉내)</span><span class="num">VIF = 1 ÷ (1 − 0) = 1</span></div>
      <div class="ln"><span>R²ᵢ = 0.5 (절반 흉내)</span><span class="num">VIF = 1 ÷ 0.5 = 2</span></div>
      <div class="ln"><span>R²ᵢ = 0.8</span><span class="num">VIF = 1 ÷ 0.2 = 5</span></div>
      <div class="ln"><span>R²ᵢ = 0.9 (90% 흉내 가능 = 거의 복제품)</span><span class="num">VIF = 1 ÷ 0.1 = 10</span></div>
    </div>
  </div>
  <div class="say"><p>VIF 공식 1 / (1 − R²ᵢ)의 R²ᵢ는 3화의 R²와 같은 재료예요. 다만 Y 대신 <b>변수 i를 다른 X들로 설명</b>해 본 R². 잘 흉내 낼수록 분모가 0에 가까워져 VIF가 커져요.</p></div>
  <div class="link">
    <div class="row"><span class="term">다중공선성</span><span>독립변수끼리 강한 상관관계가 있는 문제</span></div>
    <div class="row"><span class="term">진단 기준</span><span>상관계수 절댓값 <b>0.8 이상</b> 의심 · <b>VIF 10 이상</b>이면 존재 · 조건수 <b>30 이상</b> 의심</span></div>
    <div class="row"><span class="term">VIF</span><span>분산팽창지수. VIF = 1 / (1 − R²ᵢ)</span></div>
    <div class="row"><span class="term">해결</span><span>닮은 변수 <b>제거</b>, <b>차원 축소(PCA, 14장)</b>로 하나로 합치기, <b>변수 선택</b>(7화), <b>규제 회귀</b>(릿지 등, 8화)</span></div>
  </div>
  <div class="trap">"해결 방안이 <b>아닌</b> 것은?" → <b>독립변수를 더 추가</b>. 닮은 변수가 늘면 공선성이 오히려 커질 수 있어요.</div>
  <div class="memo">기준 숫자 셋: <b>상관 0.8, VIF 10, 조건수 30</b>. "8, 10, 30"으로 묶어 두세요.</div>
</section>

<p class="part">PART 3 · 변수 고르기 (23~24쪽)</p>

<!-- ============ 7 ============ -->
<section class="ep" id="e7">
  <div class="eph"><span class="no">7화</span><h2>후보 변수 10개, 어떤 걸 넣을까</h2><span class="pg">24쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>다 넣으면 쓸모없는 변수와 닮은 변수까지 들어온다. 그래서 <b>하나씩 넣거나(전진), 하나씩 빼거나(후진), 둘 다 하며(단계적)</b> 고르고, 채점은 <b>AIC, BIC(작을수록 좋음)</b>로 한다.</div>
  <div class="fig">
    <div class="flows">
      <div class="flow">
        <div class="fh"><b>전진선택법</b><span class="tag blue">Forward</span></div>
        <div class="fl"><span>빈 모형</span><i>→</i><span>+ 공부 시간</span><i>→</i><span>+ 출석률</span><i>→</i><span class="hi">더 넣어도 안 좋아지면 멈춤</span></div>
        <p>제일 도움 되는 변수부터 <b>하나씩 추가</b>.</p>
      </div>
      <div class="flow">
        <div class="fh"><b>후진제거법</b><span class="tag red">Backward</span></div>
        <div class="fl"><span>전부 넣은 모형</span><i>→</i><span>− 형제 수</span><i>→</i><span>− 통학 시간</span><i>→</i><span class="hi">더 빼면 나빠지면 멈춤</span></div>
        <p><b>전체에서</b> 제일 쓸모없는 변수부터 <b>하나씩 제거</b>.</p>
      </div>
      <div class="flow">
        <div class="fh"><b>단계적 선택법</b><span class="tag green">Stepwise</span></div>
        <div class="fl"><span>+ 공부 시간</span><i>→</i><span>+ 출석률</span><i>→</i><span>+ 자습실 시간</span><i>→</i><span>− 출석률?</span><i>→</i><span class="hi">넣고 빼기 반복</span></div>
        <p>추가할 때마다 <b>이미 들어간 변수도 다시 점검</b>해서 필요 없어진 건 뺌.</p>
      </div>
    </div>
  </div>
  <div class="two" style="margin-top:12px">
    <div class="box"><span class="tag blue">AIC</span><h4>아카이케 정보기준</h4><p>"잘 맞음"에서 점수를 얻고 "변수 개수"만큼 벌점. <b>작을수록</b> 좋은 모형.</p></div>
    <div class="box"><span class="tag blue">BIC</span><h4>베이즈 정보기준</h4><p>AIC와 같은 생각인데 변수 하나당 <b>벌점이 더 큼</b>. 그래서 BIC는 더 날씬한 모형을 고르는 편.</p></div>
  </div>
  <div class="link">
    <div class="row"><span class="term">전진선택법</span><span>변수를 하나씩 <b>추가</b></span></div>
    <div class="row"><span class="term">후진제거법</span><span>전체에서 하나씩 <b>제거</b></span></div>
    <div class="row"><span class="term">단계적 선택법</span><span>추가와 제거를 <b>함께</b></span></div>
    <div class="row"><span class="term">AIC, BIC</span><span>둘 다 <b>작을수록 좋음</b>. BIC가 AIC보다 벌점(패널티) 큼</span></div>
    <div class="row"><span class="term">Mallow's Cp</span><span>변수 선택에 쓰는 또 하나의 기준</span></div>
  </div>
  <div class="memo">AIC, BIC는 <b>골프 점수</b>처럼 낮을수록 잘한 것. R²(높을수록 좋음)와 방향이 반대예요.</div>
</section>

<!-- ============ 8 ============ -->
<section class="ep" id="e8">
  <div class="eph"><span class="no">8화</span><h2>변수를 빼는 대신, 계수에 벌점을 매기면</h2><span class="pg">23쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>변수를 넣고 빼는 대신, <b>계수가 커질수록 벌점</b>을 매겨 계수를 작게 눌러 둔다(규제). 벌점을 <b>제곱으로 매기면 릿지, 절댓값으로 매기면 라쏘</b>. 라쏘는 쓸모없는 계수를 아예 0으로 만든다.</div>
  <div class="fig">
    <svg viewBox="0 0 420 175" style="max-width:480px" role="img" aria-label="원래 계수 네 개, 릿지는 모두 조금씩 작아짐, 라쏘는 두 개가 0이 됨">
      <line x1="20" y1="120" x2="400" y2="120" stroke="var(--ink)" stroke-width="1.5"/>
      <g fill="var(--blue)"><rect x="30" y="40" width="22" height="80"/><rect x="56" y="72" width="22" height="48"/><rect x="82" y="96" width="22" height="24"/><rect x="108" y="120" width="22" height="16"/></g>
      <g fill="var(--violet)"><rect x="160" y="64" width="22" height="56"/><rect x="186" y="88" width="22" height="32"/><rect x="212" y="107" width="22" height="13"/><rect x="238" y="120" width="22" height="8"/></g>
      <g fill="var(--omr)"><rect x="290" y="56" width="22" height="64"/><rect x="316" y="91" width="22" height="29"/></g>
      <text x="353" y="114" text-anchor="middle" font-weight="700" fill="var(--omr)" font-size="12" font-family="var(--font)">0</text>
      <text x="379" y="114" text-anchor="middle" font-weight="700" fill="var(--omr)" font-size="12" font-family="var(--font)">0</text>
      <text class="svgtxt" x="80" y="158" text-anchor="middle" font-weight="700">원래 회귀</text>
      <text class="svgtxt" x="210" y="158" text-anchor="middle" font-weight="700">릿지 (L2)</text>
      <text class="svgtxt" x="340" y="158" text-anchor="middle" font-weight="700">라쏘 (L1)</text>
      <text class="svgmut" x="80" y="172" text-anchor="middle">계수 4개 그대로</text>
      <text class="svgmut" x="210" y="172" text-anchor="middle">전부 조금씩 줄어듦</text>
      <text class="svgmut" x="340" y="172" text-anchor="middle">2개는 아예 0 = 탈락</text>
      <text class="svgmut" x="210" y="20" text-anchor="middle">막대 = 변수별 계수 (공부 시간, 출석률, 형제 수, 통학 시간)</text>
    </svg>
    <p class="cap">모양을 보여 주는 그림이에요. 막대 높이는 실제 계산값이 아니에요.</p>
    <p class="linkh">벌점은 어떻게 매기나 (계수 3, −2, 0.5인 모형)</p>
    <div class="calc">
      <div class="ln"><span>L1 벌점(라쏘) = 절댓값 합 = 3 + 2 + 0.5</span><span class="num">5.5</span></div>
      <div class="ln"><span>L2 벌점(릿지) = 제곱 합 = 9 + 4 + 0.25</span><span class="num">13.25</span></div>
      <div class="ln"><span>최종 목표: 잔차 제곱합 + 벌점, 이 합을 최소로</span><span class="num">SSE + 벌점</span></div>
    </div>
  </div>
  <div class="three" style="margin-top:12px">
    <div class="box"><span class="tag blue">L2</span><h4>릿지 Ridge</h4><p>계수 <b>제곱합</b> 벌점. 다 같이 작아지지만 0은 안 됨. 다중공선성 완화에 좋음.</p></div>
    <div class="box"><span class="tag red">L1</span><h4>라쏘 Lasso</h4><p>계수 <b>절댓값</b> 벌점. 일부 계수를 <b>0으로</b> → <b>변수 선택 효과</b>.</p></div>
    <div class="box"><span class="tag green">L1 + L2</span><h4>엘라스틱넷</h4><p>둘을 섞음. 줄이기도 하고 빼기도 함.</p></div>
  </div>
  <details><summary>왜 라쏘만 계수를 0으로 만들까?</summary><div class="in">
    <p>계수가 0.1처럼 작아졌을 때 벌점을 비교해 볼게요.</p>
    <div class="calc">
      <div class="ln"><span>릿지 벌점: 0.1²</span><span class="num">0.01 (거의 공짜)</span></div>
      <div class="ln"><span>라쏘 벌점: |0.1|</span><span class="num">0.1 (그대로 남음)</span></div>
    </div>
    <p>릿지는 작은 계수의 벌점이 거의 사라져서 굳이 0까지 밀지 않아요. 라쏘는 작아져도 벌점이 꼬박꼬박 남으니, 쓸모없는 변수는 <b>아예 0으로 만드는 게 이득</b>이에요.</p>
  </div></details>
  <div class="memo"><b>Lasso의 L이 하나 → L1</b>, 릿지는 L2. 라쏘(올가미)로 쓸모없는 변수를 <b>잡아채서 빼낸다</b>.</div>
</section>

<p class="part">PART 4 · R 결과표로 판정하기 (24~25쪽)</p>

<!-- ============ 9 ============ -->
<section class="ep" id="e9">
  <div class="eph"><span class="no">9화</span><h2>R 결과표, 위에서 읽지 말고 아래부터</h2><span class="pg">24~25쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>결과표는 칸마다 질문이 하나씩. <b>① 맨 아래 F검정 p-value</b>(모형 전체 쓸모 있나) → <b>② 변수별 t검정 p-value</b>(이 변수 의미 있나) → <b>③ R², 수정된 R²</b>(얼마나 설명하나). 12장처럼 p &lt; 0.05면 "의미 있다".</div>
  <div class="fig">
    <p class="linkh" style="margin-top:0">교재 예시: 키(height)를 나이(age)와 형제 수(no_siblings)로 설명 · lm(height ~ age + no_siblings)</p>
    <p class="cap" style="text-align:left;margin:0 0 8px">형광펜 숫자(p-value, R², 자유도)는 교재 그대로예요. 나머지 칸(계수, 표준오차, t값, F값)은 표 읽는 연습을 위해 교재 숫자에 맞춰 채운 예시라 교재 그림과 다를 수 있어요.</p>
    <div class="tblwrap">
      <table class="act">
        <tr><th>Coefficients</th><th>Estimate<br>계수</th><th>Std. Error<br>표준오차</th><th>t value</th><th>Pr(&gt;|t|)<br>p-value</th></tr>
        <tr><td>(Intercept)</td><td class="num">64.94</td><td class="num">0.539</td><td class="num">120.43</td><td class="num">9.53e-16</td></tr>
        <tr><td>age</td><td class="num">0.635</td><td class="num">0.0225</td><td class="num">28.18</td><td class="num"><mark>4.34e-10</mark> ②</td></tr>
        <tr><td>no_siblings</td><td class="num">−0.0114</td><td class="num">0.0589</td><td class="num">−0.19</td><td class="num"><mark>0.851</mark> ②</td></tr>
      </table>
    </div>
    <div class="calc">
      <div class="ln"><span>Residual standard error: 0.2693 on <b>9</b> degrees of freedom</span><span class="num">잔차 자유도 ④</span></div>
      <div class="ln"><span>Multiple R-squared: <mark>0.9888</mark>, Adjusted R-squared: <mark>0.9863</mark></span><span class="num">③</span></div>
      <div class="ln"><span>F-statistic: 397.7 on <b>2</b> and 9 DF, p-value: <mark>1.658e-09</mark></span><span class="num">①</span></div>
    </div>
  </div>
  <p class="linkh">각 칸이 답하는 질문</p>
  <div class="tblwrap">
    <table class="act">
      <tr><th>순서</th><th>칸</th><th>답하는 질문</th><th>이 표에서</th></tr>
      <tr><td>①</td><td>F통계량의 p-value<br>(F-statistic 줄)</td><td>이 모형, <b>전체로 봐서</b> 쓸모 있나? (귀무가설: 모든 회귀계수 = 0)</td><td>1.658e-09 &lt; 0.05 → <b>모형 유의</b></td></tr>
      <tr><td>②</td><td>각 계수의 t통계량 p-value<br>(Pr(&gt;|t|) 칸)</td><td><b>이 변수 하나</b>가 의미 있나? (귀무가설: 이 계수 = 0)</td><td>age 4.34e-10 → <b>유의</b><br>no_siblings 0.851 → <b>유의하지 않음</b></td></tr>
      <tr><td>③</td><td>R², 수정된 R²</td><td>얼마나 설명하나?</td><td>0.9888 → 약 98.9% 설명. 변수 2개라 <b>수정된 R² 0.9863</b>을 봄</td></tr>
      <tr><td>④</td><td>자유도(DF)</td><td>데이터가 몇 개였나?</td><td>2 + 9 + 1 = <b>12개</b></td></tr>
      <tr><td>+</td><td>Estimate</td><td>X가 1 늘면 Y가 얼마나?</td><td>나이 1살 늘면 키 약 0.635 증가</td></tr>
    </table>
  </div>
  <div class="say"><p>①과 ②를 <b>둘 다 통과</b>해야(귀무가설 기각) 모형을 활용해요. 여기서는 no_siblings가 ②에서 떨어졌으니 <b>빼고 다시 분석</b>하는 게 권장돼요. 변수가 2개라 <b>다중회귀</b>예요.</p></div>
  <div class="fix">요약노트에 검정 순서가 "1), 2)"처럼 번호만 적혀 헷갈리게 되어 있다면, 그 두 검정은 <b>① F검정(모형 전체)</b>과 <b>② t검정(각 계수)</b>이에요.</div>
  <details open><summary>e-09, e-10은 무슨 숫자?</summary><div class="in">
    <p>e-09는 "10의 −9승", 즉 0.000000001을 곱하라는 뜻이에요. 1.658e-09 = 0.000000001658. 소수점 아래 0이 줄줄이 붙는 <b>아주 작은 수</b>라, e- 뒤에 숫자가 붙어 있으면 무조건 0.05보다 작다고 보면 돼요.</p>
  </div></details>
  <details><summary>t value는 어디서 나오나</summary><div class="in">
    <p>t = 계수 ÷ 표준오차. "계수가 흔들림(오차)의 몇 배 크기냐"예요.</p>
    <div class="calc">
      <div class="ln"><span>age: 0.635 ÷ 0.0225, 흔들림의 28배라 확실히 0이 아님</span><span class="num">≈ 28</span></div>
      <div class="ln"><span>no_siblings: −0.0114 ÷ 0.0589, 흔들림보다 작아 0과 구별 안 됨</span><span class="num">≈ −0.19</span></div>
    </div>
  </div></details>
  <details><summary>쓸모없는 no_siblings를 넣었더니 R²는?</summary><div class="in">
    <p>같은 데이터로 age만 넣은 모형과 비교하면 3화의 함정이 그대로 보여요.</p>
    <div class="tblwrap">
      <table class="act">
        <tr><th>모형</th><th>R²</th><th>수정된 R²</th></tr>
        <tr><td>age만</td><td class="num">0.98876</td><td class="num">0.98764</td></tr>
        <tr><td>age + no_siblings</td><td class="num">0.98881 (살짝 오름)</td><td class="num">0.98632 (내려감)</td></tr>
      </table>
    </div>
    <p>R²는 쓸모없는 변수에도 오르지만, 수정된 R²는 "변수만 늘렸네" 하고 깎아요. 그래서 다중회귀는 수정된 R²로 비교해요.</p>
  </div></details>
  <details><summary>분산분석(ANOVA)표와 자유도</summary><div class="in">
    <p>F검정은 3화의 SSR과 SSE를 비교하는 표에서 나와요. 각 제곱합을 자유도로 나눠 "1칸당 크기"로 맞춘 뒤 나눈 값이 F.</p>
    <div class="tblwrap">
      <table class="act">
        <tr><th>요인</th><th>자유도</th><th>제곱합</th><th>평균제곱</th><th>F</th></tr>
        <tr><td>회귀</td><td class="num">2 (변수 개수)</td><td class="num">SSR 57.66</td><td class="num">28.83</td><td class="num">28.83 ÷ 0.0725 ≈ 397.7</td></tr>
        <tr><td>잔차</td><td class="num">9</td><td class="num">SSE 0.653</td><td class="num">0.0725</td><td></td></tr>
        <tr><td>전체</td><td class="num">11</td><td class="num">SST 58.31</td><td></td><td></td></tr>
      </table>
    </div>
    <p><b>전체 데이터 수 = 전체 자유도 + 1</b> = (회귀 2 + 잔차 9) + 1 = 12개. 회귀 자유도는 독립변수 개수와 같아요.</p>
  </div></details>
  <div class="memo">읽는 순서: <b>"아래(F) → 가운데(t) → R²"</b>. 회사 면접처럼 "팀 전체 합격? → 개인별 합격? → 점수는?" 순서.</div>
</section>

<section class="ep" id="qz">
  <div class="eph"><span class="no">끝</span><h2>확인 8문제</h2></div>
  <p style="margin:0 0 10px;color:var(--muted)">답을 떠올려 본 뒤 눌러서 확인하세요. 5개 이상 떠오르면 오늘은 충분해요.</p>
  <div class="quiz">
    <details><summary>잔차의 정의와, 회귀계수를 구하는 방법은?</summary><div class="in"><p>잔차 = <b>실제 관측값 − 예측값</b>. 잔차 제곱합이 최소인 선을 고르는 <b>최소제곱법</b>. (최대우도법은 로지스틱)</p></div></details>
    <details><summary>SST 830, SSE 20이면 R²는? 식은?</summary><div class="in"><p>R² = <b>SSR / SST</b> = 1 − SSE / SST = 1 − 20/830 ≈ <b>0.976</b>. SSR = 830 − 20 = 810.</p></div></details>
    <details><summary>선형회귀의 가정이 아닌 것: 선형성, 등분산성, 정규성, 다중공선성?</summary><div class="in"><p><b>다중공선성</b>. 가정은 선분정독(선형성, 등분산성, 정규성, 독립성). 다중공선성은 피해야 할 문제.</p></div></details>
    <details><summary>다중공선성 판단 VIF 기준과, 해결책이 아닌 것은?</summary><div class="in"><p><b>VIF 10 이상</b>(조건수 30 이상). 해결은 변수 제거, PCA, 변수 선택, 릿지. <b>변수 추가</b>는 해결책이 아님.</p></div></details>
    <details><summary>L1 규제로 일부 계수를 0으로 만드는 회귀는?</summary><div class="in"><p><b>라쏘</b>(절댓값 벌점). 릿지는 L2(제곱), 엘라스틱넷은 L1 + L2.</p></div></details>
    <details><summary>변수를 하나씩 추가하는 방법은? AIC, BIC는 클수록 좋나?</summary><div class="in"><p><b>전진선택법</b>(제거 = 후진, 둘 다 = 단계적). AIC, BIC는 <b>작을수록</b> 좋고, BIC 벌점이 더 큼.</p></div></details>
    <details><summary>모형 전체 유의성은 무엇으로? F p &lt; 0.05, age p = 4.34e-10, no_siblings p = 0.851이면?</summary><div class="in"><p>모형 전체 = <b>F통계량</b>(개별 계수 = t). 모형 유의, age 유의, <b>no_siblings는 유의하지 않아 제거 후 재분석</b> 고려.</p></div></details>
    <details><summary>회귀 자유도 2, 잔차 자유도 9면 데이터 수는? 다중회귀 설명력 지표는?</summary><div class="in"><p>2 + 9 + 1 = <b>12개</b>. 변수만 늘려도 R²는 오르니 다중회귀는 <b>수정된 R²</b>.</p></div></details>
  </div>
  <div class="end">
    <h3>13장 한 문장</h3>
    <p>원장님이 공부 시간과 점수 사이에 <b>잔차 제곱합이 제일 작은 선</b>(최소제곱법)을 긋고, <b>R²</b>로 설명력을 재고, <b>선분정독</b> 가정과 <b>다중공선성(VIF 10)</b>을 점검하고, 변수는 <b>전진·후진·단계적</b>이나 <b>릿지·라쏘</b>로 고른 뒤, R 결과표를 <b>F → t → R²</b> 순서로 읽는다.</p>
  </div>
</section>

    <svg viewBox="0 0 400 210" style="max-width:460px" role="img" aria-label="길쭉하게 퍼진 점 구름. 가장 길게 퍼진 대각선 방향이 PC1, 그에 수직인 짧은 방향이 PC2">

  <div class="say"><p>학생들이 가장 넓게 퍼진 방향 = <b>학생들 차이가 가장 잘 드러나는 방향</b>이에요. 그 줄 위 위치 하나만 봐도 학생을 꽤 구별할 수 있으니 정보를 제일 많이 담은 축이죠. 제2주성분은 PC1이 못 담은 나머지를, <b>PC1과 겹치지 않게(직교)</b> 담아요.</p></div>
  <div class="link">
    <div class="row"><span class="term">주성분분석 PCA</span><span>상관성 높은 변수들을 <b>선형 결합</b>해 새 변수(주성분)를 만드는 <b>차원 축소</b></span></div>
    <div class="row"><span class="term">제1주성분</span><span>분산이 <b>가장 큰</b> 방향</span></div>
    <div class="row"><span class="term">제2주성분</span><span>제1주성분과 <b>직교</b>하면서 다음으로 분산이 큰 방향</span></div>

  </div>
  <div class="memo">짐 싸기: 옷 20벌을 다 못 넣으니 <b>"제일 자주 입는 조합"</b> 2~3개로 압축. 13장 다중공선성(닮은 변수끼리 문제)의 해결책으로도 PCA가 나왔어요.</div>
</section>

  <div class="say"><p>거리 대신 <b>"얼마나 비슷한가"</b>를 넣어도 돼요. 학생 설문으로 "A학원과 B학원은 비슷하다"를 모아 지도를 그리면, 가까이 찍힌 학원끼리 경쟁 상대예요. 이 예시는 거리가 딱 맞게 그려져 Stress가 0이지만, 실제 데이터는 완벽히 못 지켜서 조금씩 어긋나요.</p></div>
  <div class="two" style="margin-top:12px">
    <div class="box"><span class="tag blue">숫자 거리</span><h4>계량적 MDS</h4><p><b>양적 척도</b>. 실제 거리(km, 점수 차이) 그대로 지킴.</p></div>
    <div class="box"><span class="tag green">순서만</span><h4>비계량적 MDS</h4><p><b>순서 척도</b>. "가장 비슷, 두 번째로 비슷"처럼 순서만 지킴.</p></div>
  </div>
  <div class="link">
    <div class="row"><span class="term">다차원척도법 MDS</span><span>개체 간 <b>거리(유사성)</b>를 보존하며 저차원(2차원 등)으로 시각화</span></div>
    <div class="row"><span class="term">Stress</span><span>지도와 원래 거리표가 어긋난 정도. <b>0에 가까울수록</b> 적합도 좋음 (0이면 완벽)</span></div>
  </div>
  <div class="memo">Stress = 스트레스. <b>스트레스는 적을수록 좋다.</b> PCA는 "변수(항목)를 줄이기", MDS는 "개체 사이 거리를 지도로 보기".</div>
</section>
