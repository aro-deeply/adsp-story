<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12141a" media="(prefers-color-scheme: dark)">
<meta name="description" content="ADsP 18개 단원을 이야기와 그림으로 이해하는 노트">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ADsP 이해">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>ADsP 이해 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 공부용 앱과 같은 한 줄 기둥. 홈 = 과목별 단원 목록(이야기 제목 함께), 단원 = 상단 바(뒤로, 화 칩) + 이야기 조각. */
:root{
  --bg:#f4f5f8; --surface:#ffffff; --sunk:#eceef3; --ink:#181b22; --muted:#5b6272; --line:#dde1e8;
  --omr:#c9344f; --omr-soft:#fbe9ed; --ok:#17805a; --ok-soft:#e3f4ec; --hl:#ffe680;
  --blue:#2f5fd0; --blue-soft:#e6edfb; --violet:#8a4fd6; --amber:#b7791f; --amber-soft:#fbf1dc;
  --font:"Pretendard","Pretendard Variable","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141a; --surface:#1b1e26; --sunk:#232733; --ink:#eceef3; --muted:#a3a9b8; --line:#2e3340;
  --omr:#ff6b84; --omr-soft:#3a1f27; --ok:#4cc995; --ok-soft:#173327; --hl:#6b5a12;
  --blue:#7aa2ff; --blue-soft:#1d2a44; --violet:#b98cff; --amber:#f0b45a; --amber-soft:#3a2d16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141a; --surface:#1b1e26; --sunk:#232733; --ink:#eceef3; --muted:#a3a9b8; --line:#2e3340;
  --omr:#ff6b84; --omr-soft:#3a1f27; --ok:#4cc995; --ok-soft:#173327; --hl:#6b5a12;
  --blue:#7aa2ff; --blue-soft:#1d2a44; --violet:#b98cff; --amber:#f0b45a; --amber-soft:#3a2d16; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:16px;line-height:1.7;margin:0;padding:0 16px;word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding-block:8px 72px}
mark{background:linear-gradient(transparent 45%,var(--hl) 45%);color:inherit;padding:0 1px}
b{font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;color:var(--muted)}
.nav a:hover{color:var(--ink);border-color:var(--ink)}

header{padding:24px 0 8px;display:grid;gap:10px}
header .k{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--omr)}
header h1{margin:0;font-size:28px;line-height:1.3;text-wrap:balance}
header p{margin:0;color:var(--muted)}
.speed{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.speed div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px;line-height:1.45}
.speed b{display:block;font-size:14.5px}
@media (max-width:560px){.speed{grid-template-columns:1fr}}

.map{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:16px 0 4px}
.map a{text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 10px;display:grid;gap:2px}
.map a .n{font-family:var(--mono);font-size:11px;color:var(--omr);font-weight:600}
.map a .t{font-size:14.5px;font-weight:700;line-height:1.35}
.map a .q{font-size:12.5px;color:var(--muted);line-height:1.4}
.map a.done{background:var(--sunk)}
@media (max-width:560px){.map{grid-template-columns:1fr}}

section.ep{margin-top:40px;scroll-margin-top:60px}
.part{margin-top:44px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);border-top:2px solid var(--ink);padding-top:8px;scroll-margin-top:60px}
.eph{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.eph .no{font-family:var(--mono);font-weight:600;color:var(--omr);font-size:14px}
.eph h2{margin:0;font-size:22px;line-height:1.35;text-wrap:balance}
.eph .pg{font-size:12.5px;color:var(--muted)}
.core{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:12px 16px;font-weight:600;font-size:16.5px;line-height:1.6}
.core small{display:block;font-weight:500;font-size:12px;letter-spacing:.06em;opacity:.7;margin-bottom:2px}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:10px;overflow-x:auto}
.fig svg{display:block;max-width:100%;height:auto;margin:0 auto}
.cap{font-size:13.5px;color:var(--muted);margin-top:8px;text-align:center}
.say{margin:12px 0 0;display:grid;gap:8px}
.say p{margin:0}
.link{margin-top:12px;display:grid;gap:6px}
.link .row{display:grid;grid-template-columns:minmax(100px,auto) 1fr;gap:12px;align-items:baseline;font-size:15px;padding:6px 0;border-bottom:1px dashed var(--line)}
.link .row:last-child{border-bottom:0}
.link .term{font-weight:700}
.linkh{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-top:14px}
details{margin-top:12px;background:var(--sunk);border-radius:10px;padding:0 14px}
details summary{cursor:pointer;font-weight:700;font-size:14.5px;padding:10px 0;list-style:none;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+";font-family:var(--mono);display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:13px;flex:none}
details[open] summary::before{content:"−"}
details .in{padding:0 0 14px;display:grid;gap:8px;font-size:15px}
details .in p{margin:0}
.trap{margin-top:10px;background:var(--omr-soft);border-radius:10px;padding:10px 14px;font-size:15px}
.trap::before{content:"함정";display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--omr);border-radius:4px;padding:0 6px;margin-right:8px;vertical-align:1px}
.memo{margin-top:10px;background:var(--amber-soft);border-radius:10px;padding:10px 14px;font-size:15px}
.memo::before{content:"외우는 법";display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--amber);border-radius:4px;padding:0 6px;margin-right:8px;vertical-align:1px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:560px){.two,.three{grid-template-columns:1fr}}
.box{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.box h4{margin:0 0 4px;font-size:15.5px}
.box p{margin:0;font-size:14.5px}
.box .tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:0 7px;margin-bottom:6px}
.tag.red{background:var(--omr-soft);color:var(--omr)}
.tag.green{background:var(--ok-soft);color:var(--ok)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.calc{display:grid;gap:4px;margin-top:12px;font-size:15px}
.calc .ln{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px dashed var(--line)}
.calc .ln:last-child{border-bottom:0;font-weight:700}
.calc .ln .num{white-space:nowrap}

/* activation table */
.act{width:100%;border-collapse:collapse;font-size:14.5px}
.act th,.act td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.act th{font-size:12.5px;color:var(--muted);font-weight:700}
.act td:first-child{font-weight:700;white-space:nowrap}
.tblwrap{overflow-x:auto}

/* confusion matrix */
.cm{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;max-width:460px;margin:0 auto}
.cm .h{font-size:13px;font-weight:700;color:var(--muted);display:grid;place-items:center;text-align:center;padding:4px;line-height:1.35}
.cm .corner{font-size:11.5px;color:var(--muted);display:grid;place-items:end start;line-height:1.3}
.cm .c{border-radius:10px;padding:10px;display:grid;gap:2px;text-align:center;border:2px solid transparent}
.cm .c .nm{font-family:var(--mono);font-weight:600;font-size:18px}
.cm .c .v{font-family:var(--mono);font-size:24px;font-weight:600;line-height:1.1}
.cm .c .d{font-size:12.5px;line-height:1.4}
.cm .tp{background:var(--ok-soft);color:var(--ok)}
.cm .tn{background:var(--ok-soft);color:var(--ok)}
.cm .fp{background:var(--omr-soft);color:var(--omr)}
.cm .fn{background:var(--omr-soft);color:var(--omr)}
.cm .c .d{color:var(--ink)}
.metric{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.mrow{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center}
.mrow .mn{font-weight:700}
.mrow .mn small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.mrow .mq{font-size:14.5px;min-width:0}
.mrow .mv{font-family:var(--mono);font-weight:600;font-size:15px;white-space:nowrap;text-align:right}
.mrow .mv small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.mini{display:inline-grid;grid-template-columns:repeat(2,10px);gap:2px;vertical-align:-2px;margin-right:6px}
.mini i{width:10px;height:10px;border-radius:2px;background:var(--line)}
.mini i.on{background:var(--ink)}
@media (max-width:520px){.mrow{grid-template-columns:1fr auto}.mrow .mq{grid-column:1/-1;grid-row:2}}

.flows{display:grid;gap:10px}
.flow{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;min-width:0}
.flow .fh{display:flex;align-items:center;gap:8px}
.flow .fh b{font-size:16px}
.flow .fh .tag{font-size:12px;font-weight:700;border-radius:6px;padding:0 7px}
.flow .fl{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.flow .fl span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13.5px;font-weight:600;line-height:1.35;text-align:center}
.flow .fl span.hi{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.flow .fl i{font-style:normal;color:var(--muted);font-weight:700}
.flow p{margin:0;font-size:14.5px}
.quiz{display:grid;gap:8px}
.quiz details{background:var(--surface);border:1px solid var(--line);margin:0}
.quiz details summary{font-size:15.5px}
.quiz details summary::before{content:"?";color:var(--omr)}
.quiz details[open] summary::before{content:"✓";color:var(--ok)}
.end{margin-top:40px;background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:16px}
.end h3{margin:0 0 6px;font-size:17px}
.end p{margin:0}
.svgtxt:not([fill]){fill:var(--ink)}
.svgtxt{font-family:var(--font);font-size:12px}
.svgmut:not([fill]){fill:var(--muted)}
.svgmut{font-family:var(--font);font-size:11px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
/* from u15 */
@media (max-width:600px){.map{grid-template-columns:repeat(3,1fr)}}
.maphint{font-size:13px;color:var(--muted);margin:0 0 8px}
.fix{margin-top:10px;background:var(--ok-soft);border-radius:10px;padding:10px 14px;font-size:15px}
.fix::before{content:"필기 보정";display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--ok);border-radius:4px;padding:0 6px;margin-right:8px;vertical-align:1px}
.tree{display:grid;gap:10px;justify-items:center}
.tree .root{background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 14px;font-weight:700;font-size:15px}
.tree .q{font-size:13px;color:var(--muted)}
.split{display:flex;border-radius:8px;overflow:hidden;height:40px;font-size:13.5px;font-weight:700;color:#fff}
.split div{display:grid;place-items:center;text-align:center;line-height:1.2}
.split .tr{flex:6;background:var(--blue)}
.split .va{flex:2;background:var(--violet)}
.split .te{flex:2;background:var(--omr)}
.splitlab{display:flex;font-size:12.5px;color:var(--muted);margin-top:4px}
.splitlab span{text-align:center}
.kf{display:grid;gap:4px;margin-top:6px}
.kf .r{display:grid;grid-template-columns:44px repeat(5,1fr);gap:4px;align-items:center}
.kf .r span{font-size:12px;color:var(--muted);font-family:var(--mono)}
.kf .r i{height:20px;border-radius:4px;background:var(--blue-soft)}
.kf .r i.t{background:var(--omr)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px;justify-content:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pipe .st{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;display:grid;gap:4px;align-content:start;position:relative}
.pipe .st .nm{font-weight:700;font-size:14.5px}
.pipe .st .rg{font-family:var(--mono);font-size:12.5px;color:var(--omr);font-weight:600}
.pipe .st .ex{font-size:12.5px;color:var(--muted);line-height:1.45}
.pipe .st.hi{border-color:var(--ink);border-width:2px}
.arrowline{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.bayes{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;max-width:360px;margin:0 auto}
.bayes i{aspect-ratio:1;border-radius:3px;max-width:100%}
.bayes i.m{background:var(--blue-soft);border:1px solid var(--blue)}
.bayes i.f{background:var(--omr-soft);border:1px solid var(--omr)}
.bayes i.m.p{background:var(--blue);border-color:var(--blue)}
.bayes i.f.p{background:var(--omr);border-color:var(--omr)}
.coins{display:flex;gap:6px;justify-content:center;margin:6px 0}
.coins i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-style:normal;font-weight:700}
.coins i.h{background:var(--ink);color:var(--bg)}
.coins i.t{background:var(--surface);border:2px solid var(--ink);color:var(--ink)}
.gini .box{text-align:center}
.gini .v{font-family:var(--mono);font-size:22px;font-weight:600}
.ens .box h4{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ens .box h4 small{font-size:12px;font-weight:600;color:var(--muted)}


/* ---------- page reset (standalone) ---------- */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}

/* ---------- shell ---------- */
[hidden]{display:none!important}
html{scroll-behavior:auto!important}
section.ep,header[id],p.part{scroll-margin-top:108px!important}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 8px;display:grid;gap:8px}
.bar .r1{display:flex;align-items:center;gap:10px;min-width:0}
.bar .back{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;flex:none}
.bar .ttl{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.bar .ttl .num{color:var(--omr);margin-right:6px}
.bar>*{min-width:0}
#chips{min-width:0;overflow:hidden}
.bar .nav{position:static;border:0;padding:0;background:transparent;max-width:100%}
.home-h{padding:28px 0 6px;display:grid;gap:10px}
.home-h .k{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--omr)}
.home-h h1{margin:0;font-size:30px;line-height:1.3;letter-spacing:-.01em;text-wrap:balance}
.home-h p{margin:0;color:var(--muted)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.5}
.how b{display:block;font-size:14.5px;margin-bottom:2px}
@media (max-width:560px){.how{grid-template-columns:1fr}}
.cont{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:12px 16px;width:100%;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.cont small{display:block;color:var(--muted);font-size:13px}
.cont strong{font-size:16.5px}
.cont .go{font-weight:700;white-space:nowrap}
.prog{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--muted)}
.prog .meter{flex:1;height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog .meter i{display:block;height:100%;background:var(--ok);border-radius:99px}
.subj{margin-top:30px}
.subj h2{margin:0;font-size:20px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.subj h2 .tg{font-size:13px;font-weight:700;color:#fff;border-radius:6px;padding:1px 8px}
.subj .cast{font-size:13.5px;color:var(--muted);margin:4px 0 10px}
.units{display:grid;gap:6px}
.unit{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;width:100%;font:inherit;color:var(--ink);cursor:pointer}
.unit:hover{border-color:var(--ink)}
.unit .no{font-family:var(--mono);font-weight:600;font-size:15px;color:var(--muted);text-align:center}
.unit .nm{min-width:0;font-weight:700;line-height:1.45}
.unit .nm small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.unit .rt{display:grid;justify-items:end;gap:2px}
.unit .pg{font-size:12px;color:var(--muted);white-space:nowrap}
.chip{font-size:12px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.read{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.foot{margin-top:28px;font-size:13px;color:var(--muted)}
.unav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:28px}
.unav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font:inherit;color:var(--ink);text-align:left;cursor:pointer;min-width:0}
.unav button small{display:block;color:var(--muted);font-size:12px}
.unav button b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unav .nx{text-align:right}
.unav button[hidden]{display:none}
.markread{display:flex;justify-content:center;margin-top:20px}
.markread button{border:2px solid var(--ok);background:var(--surface);color:var(--ok);border-radius:999px;padding:8px 18px;font:inherit;font-weight:700;cursor:pointer}
.markread button.on{background:var(--ok);color:#fff}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (max-width:560px){.act td:first-child{white-space:normal;min-width:72px}.act th,.act td{padding:7px 5px;font-size:13.5px}}
</style>
</head>
<body>

<header id="e0">
  <span class="k">ADsP 1장 · 2쪽 · 이야기로 읽기</span>
  <h1>편의점 사장님, 영수증 더미에서 답을 찾다</h1>
  <p>1과목 다섯 단원은 <b>동네 편의점 사장님 한 사람의 성장기</b>예요. 1장은 가게를 막 연 사장님이 쌓여 가는 영수증을 보며 "이걸로 뭘 알 수 있지?"를 고민하는 이야기예요.</p>
</header>

<div class="core"><small>이 단원 전체를 한 문장으로</small>영수증 같은 <b>날것의 기록(데이터)</b>을 모아 <b>의미(정보)</b>를 뽑고, <b>판단(지식)</b>과 <b>새 아이디어(지혜)</b>로 올라간다. 덤으로, 고참 알바생 머릿속 노하우를 <b>가게의 재산으로 바꾸는 4단계</b>(SECI)까지.</div>

<p class="linkh">흐름 지도 (누르면 이동)</p>
<div class="map">
  <a href="#e1"><span class="n">1화 · 2쪽</span><span class="t">영수증은 왜 말이 없나?</span><span class="q">데이터 vs 정보</span></a>
  <a href="#e2"><span class="n">2화 · 2쪽</span><span class="t">기록에서 결정까지?</span><span class="q">DIKW 피라미드</span></a>
  <a href="#e3"><span class="n">3화 · 2쪽</span><span class="t">모양이 왜 제각각?</span><span class="q">정형·반정형·비정형</span></a>
  <a href="#e4"><span class="n">4화 · 2쪽</span><span class="t">숫자냐 말이냐?</span><span class="q">정량·정성, 수치·범주</span></a>
  <a href="#e5"><span class="n">5화 · 2쪽</span><span class="t">고참의 감은 어디에?</span><span class="q">암묵지 vs 형식지</span></a>
  <a href="#e6"><span class="n">6화 · 2쪽</span><span class="t">노하우는 어떻게 도나?</span><span class="q">SECI 공표연내</span></a>
</div>
<p class="maphint">1과목 줄거리: <b>1장 영수증(데이터)</b> → 2장 창고(DB) → 3장 홍수(빅데이터) → 4장 경고등(위기, 개인정보) → 5장 사람(데이터 사이언티스트). 앞 장의 고민이 다음 장의 출발점이에요.</p>

<!-- ============ 1 ============ -->
<section class="ep" id="e1">
  <div class="eph"><span class="no">1화</span><h2>영수증 한 장은 아무 말도 안 한다</h2><span class="pg">2쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>"삼각김밥 1개, 1,500원"은 그냥 <b>사실(데이터)</b>. 1,000장을 모아 세어 봐야 "점심에 제일 많이 팔린다"는 <b>의미(정보)</b>가 나온다. 가공을 거쳐야 말을 한다.</div>
  <div class="fig">
    <svg viewBox="0 0 520 178" style="max-width:540px" role="img" aria-label="영수증 더미(데이터)를 모아 세면 시간대별 판매 막대그래프(정보)가 되고, 점심 막대가 가장 높음">
      <rect x="20" y="28" width="130" height="112" rx="6" fill="var(--sunk)" stroke="var(--line)"/>
      <rect x="28" y="20" width="130" height="112" rx="6" fill="var(--sunk)" stroke="var(--line)"/>
      <rect x="36" y="12" width="130" height="112" rx="6" fill="var(--surface)" stroke="var(--muted)"/>
      <text class="svgtxt" x="101" y="32" text-anchor="middle" font-weight="700">영수증</text>
      <line x1="48" y1="40" x2="154" y2="40" stroke="var(--line)" stroke-dasharray="3 3"/>
      <text class="svgmut" x="48" y="58">삼각김밥 1 · 1,500</text>
      <text class="svgmut" x="48" y="76">컵라면 1 · 1,300</text>
      <text class="svgmut" x="48" y="94">12:10 · 카드</text>
      <text class="svgmut" x="48" y="112">…</text>
      <text class="svgtxt" x="93" y="158" text-anchor="middle" font-weight="700">데이터: 가공 전 사실</text>
      <text class="svgmut" x="93" y="173" text-anchor="middle">한 장으로는 아무 말도 안 함</text>

      <text class="svgmut" x="228" y="56" text-anchor="middle">1,000장 모아 세기</text>
      <line x1="186" y1="70" x2="262" y2="70" stroke="var(--ink)" stroke-width="2"/>
      <polygon points="262,64 274,70 262,76" fill="var(--ink)"/>
      <text class="svgtxt" x="228" y="90" text-anchor="middle" font-weight="700">가공</text>

      <line x1="300" y1="124" x2="505" y2="124" stroke="var(--ink)" stroke-width="1.5"/>
      <rect x="315" y="84" width="40" height="40" fill="var(--blue-soft)" stroke="var(--blue)"/>
      <rect x="380" y="34" width="40" height="90" fill="var(--omr)" stroke="var(--omr)"/>
      <rect x="445" y="69" width="40" height="55" fill="var(--blue-soft)" stroke="var(--blue)"/>
      <text class="svgmut" x="335" y="139" text-anchor="middle">아침</text>
      <text class="svgmut" x="400" y="139" text-anchor="middle">점심</text>
      <text class="svgmut" x="465" y="139" text-anchor="middle">저녁</text>
      <text class="svgtxt" x="400" y="158" text-anchor="middle" font-weight="700">정보: 점심에 제일 많이 팔린다</text>
      <text class="svgmut" x="400" y="173" text-anchor="middle">모아서 가공하니 의미가 생김</text>
    </svg>
  </div>
  <div class="link">
    <div class="row"><span class="term">데이터</span><span>있는 그대로의 <b>객관적 사실</b>, 가공 전 상태. 예: 주문 수량, 영수증 한 줄</span></div>
    <div class="row"><span class="term">정보</span><span>데이터를 <b>가공해서 의미를 부여</b>한 것. 예: 베스트셀러 목록, 시간대별 매출 순위</span></div>
    <div class="row"><span class="term">존재적 특성</span><span>데이터는 현실을 <b>있는 그대로 반영</b>해 존재한다. 영수증은 실제로 팔린 기록이니까.</span></div>
    <div class="row"><span class="term">당위적 특성</span><span>데이터는 맥락 속에서 <b>의미를 주고</b>, 추론과 예측의 <b>근거</b>로 쓰일 수 있다. 이 기록으로 내일 발주량을 정할 수 있으니까.</span></div>
  </div>
  <div class="trap">"베스트셀러 목록, 매출 순위표, 재구매율 분석 결과"는 이미 누군가 가공한 것이라 <b>정보</b>예요. "고객별 주문 수량 기록"처럼 손대지 않은 기록만 <b>데이터</b>.</div>
  <div class="memo"><b>존재</b>적 = "그냥 있다(있는 그대로)". <b>당위</b>적 = "쓸모가 있다(근거가 된다)".</div>
</section>

<!-- ============ 2 ============ -->
<section class="ep" id="e2">
  <div class="eph"><span class="no">2화</span><h2>영수증에서 결정까지 네 계단, DIKW</h2><span class="pg">2쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>정보에서 멈추면 아깝다. 정보로 <b>어떻게 할지 판단</b>하면 지식, 거기서 <b>안 본 것까지 추론</b>하면 지혜. 위로 갈수록 사람의 머리가 더 들어간다.</div>
  <div class="fig">
    <svg viewBox="0 0 520 220" style="max-width:540px" role="img" aria-label="DIKW 피라미드: 아래부터 데이터, 정보, 지식, 지혜와 각 단계의 편의점 예시">
      <polygon points="37.5,160 202.5,160 230,210 10,210" fill="var(--sunk)" stroke="var(--surface)" stroke-width="3"/>
      <polygon points="65,110 175,110 202.5,160 37.5,160" fill="var(--blue-soft)" stroke="var(--surface)" stroke-width="3"/>
      <polygon points="92.5,60 147.5,60 175,110 65,110" fill="var(--ok-soft)" stroke="var(--surface)" stroke-width="3"/>
      <polygon points="120,10 147.5,60 92.5,60" fill="var(--amber-soft)" stroke="var(--surface)" stroke-width="3"/>
      <text class="svgtxt" x="120" y="52" text-anchor="middle" font-weight="700">W</text>
      <text class="svgtxt" x="120" y="90" text-anchor="middle" font-weight="700">K 지식</text>
      <text class="svgtxt" x="120" y="140" text-anchor="middle" font-weight="700">I 정보</text>
      <text class="svgtxt" x="120" y="190" text-anchor="middle" font-weight="700">D 데이터</text>
      <g stroke="var(--line)" stroke-dasharray="3 3">
        <line x1="136" y1="35" x2="244" y2="35"/><line x1="163" y1="85" x2="244" y2="85"/><line x1="190" y1="135" x2="244" y2="135"/><line x1="218" y1="185" x2="244" y2="185"/>
      </g>
      <text class="svgtxt" x="250" y="31" font-weight="700">지혜 · 새 아이디어</text>
      <text class="svgmut" x="250" y="47">“비 오는 날엔 컵라면도 늘려 볼까?”</text>
      <text class="svgtxt" x="250" y="81" font-weight="700">지식 · 판단, 의사결정</text>
      <text class="svgmut" x="250" y="97">“점심 전에 삼각김밥을 더 채워 두자”</text>
      <text class="svgtxt" x="250" y="131" font-weight="700">정보 · 패턴 발견</text>
      <text class="svgmut" x="250" y="147">“점심에 삼각김밥이 제일 많이 팔린다”</text>
      <text class="svgtxt" x="250" y="181" font-weight="700">데이터 · 가공 전 사실</text>
      <text class="svgmut" x="250" y="197">“삼각김밥 1개 1,500원, 12:10”</text>
    </svg>
    <p class="cap">아래에서 위로: Data → Information → Knowledge → Wisdom</p>
  </div>
  <p class="linkh">시험에 나오는 교재 예시: "어느 단계인가?"는 신호 단어로</p>
  <div class="fig">
    <div class="tblwrap">
      <table class="act">
        <tr><th>단계</th><th>교재 예시 (대리점 휴대폰 가격)</th><th>신호 단어</th></tr>
        <tr><td>데이터</td><td>A대리점 100만 원, B대리점 200만 원</td><td>숫자, 사실 그대로</td></tr>
        <tr><td>정보</td><td>A대리점이 B보다 <b>싸다</b></td><td>비교 결과, 패턴</td></tr>
        <tr><td>지식</td><td>A에서 사면 이득이니 A에서 <b>사야겠다</b></td><td>판단, 결정</td></tr>
        <tr><td>지혜</td><td>A대리점은 <b>다른 기기도 쌀 것이다</b></td><td>안 본 것까지 추론, 창의</td></tr>
      </table>
    </div>
  </div>
  <div class="trap">"A가 B보다 <b>싸다</b>"를 지식으로 고르기 쉬워요. 두 숫자를 비교한 <b>결과</b>일 뿐 아직 아무 결정도 안 했으니 <b>정보</b>예요.</div>
  <div class="memo">질문 하나씩으로 구분해요. "뭐라고 찍혀 있나?" 데이터 → "그래서 뭐가 보이나?" 정보 → "그래서 어떻게 할까?" 지식 → "그럼 다른 것도?" 지혜.</div>
</section>

<!-- ============ 3 ============ -->
<section class="ep" id="e3">
  <div class="eph"><span class="no">3화</span><h2>영수증, 배달앱 주문, 인스타 리뷰: 모양이 다르다</h2><span class="pg">2쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>사장님 가게에 들어오는 데이터는 모양이 제각각. 칸이 딱 정해져 있으면 <b>정형</b>, 칸은 없어도 <b>이름표(태그)가 붙어 있으면 반정형</b>, 아무 틀도 없으면 <b>비정형</b>. 기준은 "구조가 얼마나 정해져 있나".</div>
  <div class="fig">
    <div class="three">
      <div class="box">
        <span class="tag blue">정형 · 칸이 정해짐</span>
        <h4>POS 판매 기록</h4>
        <p class="num" style="font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:4px 0 6px">상품 | 수량 | 금액<br>김밥 | 1 | 1500<br>라면 | 2 | 2600</p>
        <p>행과 열로 된 표. <b>관계형 DB, 엑셀, CSV</b></p>
      </div>
      <div class="box">
        <span class="tag green">반정형 · 이름표가 붙음</span>
        <h4>배달앱 주문 파일</h4>
        <p class="num" style="font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:4px 0 6px">{"상품": "김밥",<br>&nbsp;"수량": 1}</p>
        <p>데이터 옆에 "이건 상품, 이건 수량" 설명(<b>메타데이터</b>)이 붙음. <b>HTML, XML, JSON</b></p>
      </div>
      <div class="box">
        <span class="tag red">비정형 · 틀이 없음</span>
        <h4>인스타 리뷰, CCTV</h4>
        <p class="num" style="font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:4px 0 6px">"김밥 맛있어요ㅎㅎ<br>사장님 친절!"</p>
        <p>정해진 칸도 이름표도 없음. <b>SNS 글, 유튜브 영상, 음원</b></p>
      </div>
    </div>
    <p class="cap">왼쪽일수록 컴퓨터가 바로 계산하기 쉽고, 오른쪽일수록 사람의 해석이 필요해요.</p>
  </div>
  <div class="link">
    <div class="row"><span class="term">정형 (Structured)</span><span>구조가 정해진 데이터</span></div>
    <div class="row"><span class="term">반정형 (Semi-structured)</span><span>구조가 반쯤 있는 데이터. 핵심은 <b>"태그(설명)가 붙어 있다"</b></span></div>
    <div class="row"><span class="term">비정형 (Unstructured)</span><span>구조가 없는 데이터</span></div>
  </div>
  <div class="trap"><b>CSV</b>는 이름이 낯설어서 반정형으로 착각하기 쉬워요. 쉼표로 칸을 나눈 <b>표</b>라서 정형이에요. 반정형은 HTML, XML, JSON 셋으로 외우세요.</div>
  <div class="memo">HTML, XML은 &lt;꺾쇠&gt; 이름표, JSON은 {"중괄호"} 이름표가 눈에 보여요. <b>"이름표가 보이면 반정형."</b></div>
</section>

<!-- ============ 4 ============ -->
<section class="ep" id="e4">
  <div class="eph"><span class="no">4화</span><h2>숫자냐 말이냐, 재느냐 세느냐</h2><span class="pg">2쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>같은 데이터도 <b>표현</b>(숫자냐 말이냐)과 <b>분석 목적</b>(계산하냐, 종류로 나누냐)에 따라 또 나눈다. 시험은 "학점은 어느 유형?" 같은 분류 문제로 나온다.</div>
  <div class="fig">
    <div class="two">

    </div>
    <svg viewBox="0 0 540 200" style="max-width:560px;margin-top:14px" role="img" aria-label="분석 목적으로 나누면 수치형(연속형, 이산형)과 범주형(명목형, 순서형)">

      <text x="270" y="26" text-anchor="middle" fill="var(--bg)" font-size="12.5" font-weight="700">분석 목적으로 나누기</text>
      <line x1="240" y1="36" x2="135" y2="62" stroke="var(--muted)"/><line x1="300" y1="36" x2="405" y2="62" stroke="var(--muted)"/>
      <rect x="55" y="62" width="160" height="30" rx="8" fill="var(--blue-soft)" stroke="var(--blue)"/>
      <text class="svgtxt" x="135" y="82" text-anchor="middle" font-weight="700">수치형 (계산 가능)</text>

      <line x1="115" y1="92" x2="70" y2="118" stroke="var(--muted)"/><line x1="155" y1="92" x2="200" y2="118" stroke="var(--muted)"/>

<section class="ep" id="e5">
  <div class="eph"><span class="no">5화</span><h2>고참 알바생의 감은 어디에 있나</h2><span class="pg">2쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>고참 알바생은 "내일 비 오면 우산 몇 개" 감이 있지만 말로 설명을 못 한다(<b>암묵지</b>). 그 사람이 그만두면 감도 같이 사라진다. 그래서 글로 꺼내 둔 지식(<b>형식지</b>)이 필요하다.</div>
  <div class="fig">
    <div class="two">
      <div class="box"><span class="tag blue">머릿속 · 몸에 밴 지식</span><h4>암묵지 (Tacit Knowledge)</h4><p>개인에게 쌓여 <b>겉으로 드러나지 않는</b> 지식. 요리 고수의 손맛, 고참의 발주 감, 노하우.</p><p style="margin-top:6px;color:var(--muted);font-size:13.5px">약점: 남에게 전하기 어렵고, 사람이 떠나면 사라짐</p></div>
      <div class="box"><span class="tag green">글로 적힌 지식</span><h4>형식지 (Explicit Knowledge)</h4><p>문서, 매뉴얼, 레시피 책처럼 <b>겉으로 드러난</b> 지식. 가게의 발주 매뉴얼.</p><p style="margin-top:6px;color:var(--muted);font-size:13.5px">장점: 누구나 읽고, 복사하고, 고칠 수 있음</p></div>
    </div>
  </div>
  <div class="say"><p>둘 중 하나가 좋은 게 아니에요. 사장님 가게에서는 고참의 감(암묵지)이 글(형식지)이 되고, 그 글이 다시 신입의 감(암묵지)이 되면서 <b>가게 전체의 지식이 커져요</b>. 이 돌고 도는 4단계가 다음 화예요.</p></div>
</section>

<section class="ep" id="qz">
  <div class="eph"><span class="no">끝</span><h2>확인 8문제</h2></div>
  <p style="margin:0 0 10px;color:var(--muted)">답을 떠올려 본 뒤 눌러서 확인하세요. 5개 이상 떠오르면 오늘은 충분해요.</p>
  <div class="quiz">
    <details><summary>"고객별 주문 수량 기록"과 "이번 달 베스트셀러 목록", 데이터는 어느 쪽?</summary><div class="in"><p><b>주문 수량 기록</b>. 가공 전 사실이에요. 목록, 순위표, 분석 결과는 가공된 정보.</p></div></details>
    <details><summary>"A대리점 휴대폰이 B대리점보다 싸다"는 DIKW 중 어디?</summary><div class="in"><p><b>정보(Information)</b>. 비교해서 패턴을 찾았을 뿐, 아직 판단(지식)은 안 했어요.</p></div></details>
    <details><summary>"A대리점의 다른 기기도 B보다 쌀 것이다"는?</summary><div class="in"><p><b>지혜(Wisdom)</b>. 본 적 없는 것까지 추론한 창의적 아이디어예요.</p></div></details>
    <details><summary>JSON, XML, HTML, CSV 중 반정형이 아닌 것은?</summary><div class="in"><p><b>CSV</b>. 쉼표로 칸을 나눈 표라 정형이에요. 나머지 셋은 태그(메타데이터)가 붙은 반정형.</p></div></details>
    <details><summary>유튜브 동영상은 어떤 형태의 데이터?</summary><div class="in"><p><b>비정형</b>. 정해진 칸도 이름표도 없어요. DB 테이블, 엑셀은 정형, JSON은 반정형.</p></div></details>
    <details><summary>학점(A, B, C)이나 만족도 등급은 어떤 데이터?</summary><div class="in"><p><b>순서형</b>(범주형). 종류인데 줄을 세울 수 있어요. 성별, 혈액형은 순서 없는 명목형.</p></div></details>
    <details><summary>노하우를 매뉴얼로 쓰는 것, 매뉴얼을 보고 몸에 익히는 것은 각각?</summary><div class="in"><p>앞은 <b>표출화</b>(암묵지 → 형식지), 뒤는 <b>내면화</b>(형식지 → 암묵지). 전체 순서는 공통화 → 표출화 → 연결화 → 내면화, <b>공표연내</b>.</p></div></details>
    <details><summary>데이터가 현실을 그대로 반영한다는 특성은?</summary><div class="in"><p><b>존재적 특성</b>. 판단과 예측의 근거로 쓰일 수 있다는 쪽은 당위적 특성.</p></div></details>

  <div class="end">
    <h3>1장 한 문장</h3>
    <p>사장님은 영수증(<b>데이터</b>)을 모아 패턴(<b>정보</b>)을 찾고, 발주를 정하고(<b>지식</b>), 새 아이디어를 떠올린다(<b>지혜</b>). 데이터는 모양(<b>정형, 반정형, 비정형</b>)과 쓰임(<b>수치형, 범주형</b>)으로 나뉘고, 고참의 감은 <b>공표연내</b>로 가게의 재산이 된다. 그런데 2호점, 3호점을 내자 영수증과 엑셀이 감당이 안 되기 시작하는데… 다음 장, <b>창고(데이터베이스)</b>.</p>

<section class="ep" id="e1">
  <div class="eph"><span class="no">1화</span><h2>지점마다 엑셀이 따로 노는 지옥</h2><span class="pg">3쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>1호점 파일엔 단골 김씨가 "010-1234", 2호점 파일엔 "010-9999". 어느 게 맞지? 이 혼란을 끝내려면 창고가 <b>같이 쓰이고, 하나로 합쳐 있고, 저장돼 있고, 바뀌어도 정확</b>해야 한다. 이게 DB의 4특징.</div>

      <table class="act">
        <tr><th>DB 특징</th><th>뜻</th><th>사장님 가게에서</th></tr>
        <tr><td>공용 데이터</td><td>여러 사용자가 <b>다른 목적으로 같이</b> 씀</td><td>점장은 재고, 사장님은 매출, 본사는 회계를 같은 창고에서</td></tr>
        <tr><td>통합된 데이터</td><td>같은 데이터가 <b>중복되지 않음</b></td><td>김씨 기록은 딱 한 줄</td></tr>
        <tr><td>저장된 데이터</td><td>컴퓨터가 접근할 수 있는 <b>저장 매체에</b> 저장</td><td>공책이 아니라 서버에</td></tr>
        <tr><td>변화되는 데이터</td><td>추가, 수정, 삭제가 있어도 <b>정확한 현재 상태</b> 유지</td><td>새 손님, 번호 변경, 탈퇴가 매일 있어도 정확</td></tr>
      </table>
    </div>
  </div>
  <div class="link">
    <div class="row"><span class="term">무결성 (Integrity)</span><span>데이터가 <b>틀림없이 정확하게</b> 유지되는 성질. "변화되는 데이터"의 목표.</span></div>
    <div class="row"><span class="term">정보 축적·전달 측면 가치</span><span><b>기계가독성</b>(컴퓨터가 읽을 수 있음), <b>검색가독성</b>(원하는 것을 바로 찾음), <b>원격조작성</b>(멀리서도 다룸). 공책 장부엔 없는 장점 3가지.</span></div>
  </div>
  <div class="trap">"휘발성 데이터"는 DB 특징이 <b>아니에요</b>. 5화의 데이터 웨어하우스는 오히려 <b>비휘발성</b>이 특징이라, 둘을 섞은 보기가 나와요.</div>
  <div class="memo"><b>공통저변</b> (공통의 저변): <b>공</b>용, <b>통</b>합, <b>저</b>장, <b>변</b>화.</div>
</section>

<!-- ============ 2 ============ -->
<section class="ep" id="e2">
  <div class="eph"><span class="no">2화</span><h2>창고는 어떤 순서로 짓나</h2><span class="pg">3쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>집 짓기와 같다. 뭘 원하는지 듣고 → 스케치 → 상세 도면 → 실제 공사. 머릿속 그림에서 <b>점점 기계 쪽으로 구체화</b>되는 순서라서 거꾸로 할 수가 없다.</div>
  <div class="fig">
    <div class="pipe">
      <div class="st"><span class="nm">요구조건 분석</span><span class="rg">무엇이 필요?</span><span class="ex">"손님, 상품, 주문을 관리하고 싶어요" 듣기</span></div>
      <div class="st hi"><span class="nm">① 개념적 설계</span><span class="rg">스케치</span><span class="ex">손님이 주문을 한다, 주문에 상품이 담긴다 → <b>ERD</b>, 개념 스키마</span></div>
      <div class="st hi"><span class="nm">② 논리적 설계</span><span class="rg">상세 도면</span><span class="ex">손님 표, 주문 표의 칸(열)과 연결 규칙 정하기 → 논리 모델링</span></div>
      <div class="st hi"><span class="nm">③ 물리적 설계</span><span class="rg">실제 공사</span><span class="ex">어느 디스크에, 어떤 저장 구조로, 인덱스는 어디에</span></div>
    </div>
    <p class="arrowline">요구조건 분석 → 개념 → 논리 → 물리 &nbsp;·&nbsp; 사람의 말에서 기계의 저장 구조로</p>
  </div>
  <div class="link">
    <div class="row"><span class="term">ERD</span><span>Entity Relationship Diagram. "손님", "주문" 같은 대상(개체)과 그 사이 관계를 그린 <b>스케치 그림</b>. 개념적 설계의 결과물.</span></div>
    <div class="row"><span class="term">논리 모델링</span><span>스케치를 표(테이블) 구조로 옮기는 작업</span></div>
    <div class="row"><span class="term">물리적 설계</span><span>실제 저장 장치에 <b>어떻게 저장할지</b>(저장 구조, 접근 방법) 정하기</span></div>
  </div>
  <div class="memo"><b>개논물</b> (개가 논물을 마신다). 그리고 맨 앞엔 늘 <b>요구조건 분석</b>. "듣고, 스케치하고, 도면 그리고, 공사한다."</div>
</section>

<!-- ============ 3 ============ -->
<section class="ep" id="e3">
  <div class="eph"><span class="no">3화</span><h2>창고지기와 창고에 말 거는 언어</h2><span class="pg">3쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>창고를 관리하는 프로그램이 <b>DBMS</b>, 창고에 일을 시키는 말이 <b>SQL</b>. SQL은 "창고 틀을 만들어"(DDL), "물건 넣고 빼"(DML), "출입 권한 줘"(DCL)로 나뉜다.</div>
  <div class="fig">
    <div class="two">
      <div class="box"><span class="tag blue">표로 정리하는 창고</span><h4>관계형 DBMS</h4><p>모든 걸 행과 열의 <b>표(테이블)</b>로 저장하고 표끼리 연결.</p><p style="margin-top:6px"><b>MySQL, MariaDB, Oracle</b></p></div>
      <div class="box"><span class="tag green">표에 안 맞는 것도 담는 창고</span><h4>NoSQL</h4><p>리뷰, 사진 정보처럼 <b>비정형 데이터</b>를 저장, 처리. 표 규칙이 느슨함.</p><p style="margin-top:6px"><b>HBase, MongoDB, Redis, Cassandra</b></p></div>
    </div>
    <div class="flows" style="margin-top:12px">
      <div class="flow">
        <div class="fh"><b>DDL</b><span class="tag blue">정의어 · 틀</span></div>
        <div class="fl"><span class="hi">CREATE</span><span>ALTER</span><span>DROP</span></div>
        <p>"손님 표를 <b>만들어</b>, 칸 하나 <b>바꿔</b>, 표를 <b>없애</b>." 표 자체를 다룸.</p>
      </div>
      <div class="flow">
        <div class="fh"><b>DML</b><span class="tag green">조작어 · 내용물</span></div>
        <div class="fl"><span class="hi">SELECT</span><span>INSERT</span><span>UPDATE</span><span>DELETE</span></div>
        <p>"김씨 기록 <b>찾아</b>, 새 손님 <b>넣어</b>, 번호 <b>고쳐</b>, 탈퇴 손님 <b>지워</b>." 표 안의 줄(행)을 다룸.</p>
      </div>
      <div class="flow">
        <div class="fh"><b>DCL</b><span class="tag red">제어어 · 권한</span></div>
        <div class="fl"><span class="hi">GRANT</span><span>REVOKE</span></div>
        <p>"2호점 점장에게 열람 권한 <b>줘</b>, 그만둔 알바 권한 <b>뺏어</b>."</p>
      </div>
    </div>
  </div>
  <p class="linkh">창고 안내판들: 헷갈리는 네 단어</p>
  <div class="link">
    <div class="row"><span class="term">스키마</span><span>창고의 <b>설계도</b>. DB 구조와 제약조건(규칙)을 적은 명세.</span></div>
    <div class="row"><span class="term">메타데이터</span><span><b>데이터를 설명하는 데이터</b>. 예: 사진의 촬영 날짜, "이 칸은 전화번호, 11자리".</span></div>
    <div class="row"><span class="term">데이터 사전</span><span>메타데이터를 모아 둔 <b>저장소</b>.</span></div>
    <div class="row"><span class="term">인덱스</span><span>책 뒤 색인처럼 <b>빨리 찾게(정렬, 탐색)</b> 돕는 보조 도구.</span></div>
  </div>
  <div class="trap"><b>SELECT</b>는 "조회"라서 DML이 아닐 것 같지만 <b>DML</b>이에요. <b>CREATE</b>는 표 자체를 만드니 DDL. COMMIT, ROLLBACK(작업 확정, 되돌리기)은 <b>TCL</b>로 따로 나누기도 하고 DCL에 넣는 교재도 있어요. 권한 GRANT, REVOKE는 어디서나 DCL.</div>
  <div class="memo">DDL은 <b>틀</b>(Definition, 정의), DML은 <b>내용물</b>(Manipulation, 조작), DCL은 <b>권한</b>(Control, 제어). 가운데 글자만 보면 돼요.</div>
</section>

<p class="part">PART 2 · 창고를 목적별로 나눠 쓰기 (3~4쪽)</p>

<!-- ============ 4 ============ -->
<section class="ep" id="e4">
  <div class="eph"><span class="no">4화</span><h2>계산대 창고와 사무실 창고는 다르다</h2><span class="pg">3쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>지점이 10개가 되자 문제가 생겼다. 사장님이 무거운 분석을 돌리면 <b>계산대 결제가 느려진다</b>. 그래서 "지금 거래 처리용"(OLTP)과 "쌓인 걸 분석용"(OLAP)을 나눈다. 회사 안 다른 시스템들도 결국 <b>무엇을 관리하느냐</b>로 이름이 붙었다.</div>
  <div class="fig">
    <div class="two">
      <div class="box"><span class="tag blue">계산대 · 지금 이 순간</span><h4>OLTP</h4><p>Online <b>Transaction</b> Processing. <b>다량의 짧은 거래</b>를 실시간 처리.</p><p style="margin-top:6px">결제, 주문, 포인트 적립. 한 건은 작지만 쉴 새 없이 많음.</p></div>
      <div class="box"><span class="tag green">사무실 · 쌓인 기록</span><h4>OLAP</h4><p>Online <b>Analytical</b> Processing. <b>다차원 데이터를 대화식으로</b> 분석.</p><p style="margin-top:6px">"지점별 × 월별 × 상품별 매출"을 이리저리 돌려 보기.</p></div>
    </div>
    <div class="tblwrap" style="margin-top:12px">
      <table class="act">
        <tr><th>이름</th><th>무엇을 관리하나</th><th>사장님 가게에서</th></tr>
        <tr><td>CRM</td><td><b>고객</b> 관계 관리</td><td>단골 포인트, 생일 쿠폰</td></tr>
        <tr><td>SCM</td><td><b>공급망</b> 관리</td><td>납품업체, 물류, 재고 흐름</td></tr>
        <tr><td>ERP</td><td><b>전사</b> 자원 관리</td><td>회계, 인사, 재고, 구매를 하나로</td></tr>
        <tr><td>RTE</td><td><b>실시간</b> 기업</td><td>본사가 모든 지점 상황을 실시간으로</td></tr>
        <tr><td>KMS</td><td><b>지식</b> 관리 시스템</td><td>1장의 발주 매뉴얼을 모아 공유</td></tr>
        <tr><td>BI</td><td><b>리포트</b> 중심 도구</td><td>"지난달 매출 보고서" (무슨 일이 있었나)</td></tr>
        <tr><td>BA</td><td><b>통계 기반 통찰</b>, 예측까지</td><td>"다음 달 어디가 잘 팔릴까" (BI보다 한 걸음 앞)</td></tr>
        <tr><td>블록체인</td><td>참여자 모두가 정보를 <b>분산 저장</b></td><td>장부를 한 곳이 아니라 모두가 나눠 들고 있음</td></tr>
      </table>
    </div>
  </div>
  <div class="memo">OLTP의 <b>T = Transaction(거래)</b>, OLAP의 <b>A = Analytical(분석)</b>. 글자 하나로 끝나요. BI는 "<b>과거</b> 보고서", BA는 "<b>미래</b>까지 분석".</div>
</section>

<!-- ============ 5 ============ -->
<section class="ep" id="e5">
  <div class="eph"><span class="no">5화</span><h2>본사의 기록 보관소, 데이터 웨어하우스</h2><span class="pg">4쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>지점 DB, 납품 DB, 고객 DB가 다 따로라 "지난 3년 전체 흐름"을 볼 수가 없다. 그래서 <b>분석용으로 한곳에 모아 정리해 둔 중앙 창고</b>(DW)를 만든다. 넣는 과정이 ETL, 넣기 전 잠깐 쌓아 두는 곳이 ODS.</div>
  <div class="fig">
    <svg viewBox="0 0 520 180" style="max-width:540px" role="img" aria-label="지점 DB, 고객 DB, 납품 DB에서 추출한 데이터가 ODS에 임시 저장되고 변환, 적재를 거쳐 데이터 웨어하우스로 들어감">
      <g fill="var(--surface)" stroke="var(--line)">
        <rect x="10" y="14" width="100" height="36" rx="8"/><rect x="10" y="64" width="100" height="36" rx="8"/><rect x="10" y="114" width="100" height="36" rx="8"/>
      </g>
      <text class="svgtxt" x="60" y="37" text-anchor="middle">지점 판매 DB</text>
      <text class="svgtxt" x="60" y="87" text-anchor="middle">고객 DB</text>
      <text class="svgtxt" x="60" y="137" text-anchor="middle">납품 DB</text>
      <g stroke="var(--muted)" stroke-width="1.5"><line x1="110" y1="32" x2="180" y2="76"/><line x1="110" y1="82" x2="180" y2="82"/><line x1="110" y1="132" x2="180" y2="88"/></g>
      <text class="svgmut" x="145" y="22" text-anchor="middle">E 추출</text>
      <rect x="180" y="58" width="110" height="48" rx="8" fill="var(--amber-soft)" stroke="var(--amber)"/>
      <text class="svgtxt" x="235" y="79" text-anchor="middle" font-weight="700">ODS</text>
      <text class="svgmut" x="235" y="95" text-anchor="middle">임시 저장소</text>
      <line x1="290" y1="82" x2="366" y2="82" stroke="var(--ink)" stroke-width="2"/>
      <polygon points="366,76 378,82 366,88" fill="var(--ink)"/>
      <text class="svgmut" x="334" y="70" text-anchor="middle">T 변환</text>
      <text class="svgmut" x="334" y="102" text-anchor="middle">L 적재</text>
      <rect x="380" y="40" width="130" height="84" rx="10" fill="var(--ink)"/>
      <text x="445" y="76" text-anchor="middle" fill="var(--bg)" font-size="14" font-weight="700">데이터</text>
      <text x="445" y="96" text-anchor="middle" fill="var(--bg)" font-size="14" font-weight="700">웨어하우스</text>
      <text class="svgmut" x="260" y="172" text-anchor="middle">ETL = 뽑고(Extract), 모양 맞추고(Transform), 싣는(Load) 이동 과정 전체</text>
    </svg>
  </div>
  <div class="fig">
    <div class="two">
      <div class="box"><h4>주제지향성</h4><p>"매출", "고객"처럼 <b>분석 주제별로</b> 정리. 계산대처럼 업무 순서대로가 아님.</p></div>
      <div class="box"><h4>통합성</h4><p>지점마다 "남/여", "M/F"로 다르던 표기를 <b>하나로 맞춰</b> 모음.</p></div>
      <div class="box"><h4>시계열성</h4><p>지난 3년, 5년의 <b>과거 이력</b>을 시간 순으로 보관.</p></div>
      <div class="box"><h4>비휘발성</h4><p>한 번 넣으면 수시로 고치지 않는 <b>읽기 전용</b> 기록 보관소.</p></div>
    </div>
  </div>
  <div class="link">
    <div class="row"><span class="term">ETL</span><span>Extract(추출) Transform(변환) Load(적재). 데이터를 옮기는 <b>과정</b>.</span></div>
    <div class="row"><span class="term">ODS</span><span>Operational Data Store. 여러 DB에서 뽑은 데이터를 DW에 넣기 전 <b>임시로 저장</b>하는 <b>곳</b>.</span></div>
  </div>
  <div class="trap">ETL은 <b>과정</b>, ODS는 <b>장소</b>. "임시로 저장하는 곳은?" 하면 ODS예요. 그리고 DW는 <b>비휘발성</b>. "휘발성"이 들어간 보기는 오답.</div>
  <div class="memo"><b>주통시비</b>: 주제, 통합, 시계열, 비휘발. 1화 DB 특징 <b>공통저변</b>과 짝으로 외워요. DB는 매일 바뀌는 "변화", DW는 안 바뀌는 "비휘발".</div>
</section>

<!-- ============ 6 ============ -->
<section class="ep" id="e6">
  <div class="eph"><span class="no">6화</span><h2>사진, 리뷰, 영상은 어디에 담나</h2><span class="pg">4쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>웨어하우스는 정리해서 넣느라 손이 많이 가고, 리뷰 사진이나 CCTV 영상은 표에 맞지도 않는다. 그래서 <b>모양 상관없이 원본 그대로 일단 다 붓는 호수</b>(데이터 레이크)가 생겼다. 너무 커서 컴퓨터 한 대로 못 다루니 <b>여러 대를 묶는 하둡</b>.</div>
  <div class="fig">
    <div class="two">
      <div class="box"><span class="tag blue">정리된 창고</span><h4>데이터 웨어하우스</h4><p>정형 데이터를 <b>정리, 변환해서</b> 주제별로 보관. 분석 준비 완료 상태.</p></div>
      <div class="box"><span class="tag green">모든 걸 받는 호수</span><h4>데이터 레이크</h4><p>정형, 반정형, 비정형을 <b>원본 그대로 모두</b> 저장. 쓸 때 꺼내서 가공.</p></div>
    </div>

<section class="ep" id="qz">
  <div class="eph"><span class="no">끝</span><h2>확인 8문제</h2></div>
  <p style="margin:0 0 10px;color:var(--muted)">답을 떠올려 본 뒤 눌러서 확인하세요. 5개 이상 떠오르면 오늘은 충분해요.</p>
  <div class="quiz">
    <details><summary>DB의 4특징은? "휘발성"은 들어가나?</summary><div class="in"><p><b>공용, 통합, 저장, 변화</b>(공통저변). 휘발성은 없어요. DW는 반대로 비휘발성.</p></div></details>
    <details><summary>같은 데이터가 중복되지 않는다는 DB 특징은?</summary><div class="in"><p><b>통합된 데이터</b>. 김씨 기록은 딱 한 줄.</p></div></details>
    <details><summary>DB 설계 순서는?</summary><div class="in"><p><b>요구조건 분석 → 개념적 → 논리적 → 물리적</b>(개논물). 듣고, 스케치, 도면, 공사.</p></div></details>
    <details><summary>SELECT, INSERT, UPDATE, CREATE 중 DML이 아닌 것은? GRANT는?</summary><div class="in"><p><b>CREATE</b>는 틀을 만드는 DDL. GRANT는 권한이라 <b>DCL</b>.</p></div></details>
    <details><summary>MongoDB, Redis, Oracle, Cassandra 중 NoSQL이 아닌 것은?</summary><div class="in"><p><b>Oracle</b>. 관계형 DBMS예요.</p></div></details>
    <details><summary>결제, 주문 같은 짧은 거래를 실시간 처리하는 시스템은?</summary><div class="in"><p><b>OLTP</b>(T = Transaction). 분석은 OLAP.</p></div></details>
    <details><summary>DW의 4특징과, 넣기 전 임시 저장소의 이름은?</summary><div class="in"><p><b>주제지향, 통합, 시계열, 비휘발</b>(주통시비). 임시 저장소는 <b>ODS</b>. ETL은 옮기는 과정.</p></div></details>
    <details><summary>데이터 레이크의 정확한 설명과, 하둡에서 병렬 처리를 맡는 기술은?</summary><div class="in"><p>레이크 = <b>정형, 반정형, 비정형 모두 원본 그대로</b>. 병렬 처리는 <b>MapReduce</b>(저장은 HDFS).</p></div></details>
  </div>
  <div class="end">
    <h3>2장 한 문장</h3>
    <p>흩어진 엑셀을 <b>공통저변</b>의 창고(DB)로 바꾸고, <b>개논물</b> 순서로 설계해 <b>SQL</b>(DDL 틀, DML 내용물, DCL 권한)로 다룬다. 커지면 계산대용 <b>OLTP</b>와 분석용 <b>OLAP</b>을 나누고, <b>주통시비</b> 보관소(DW)와 뭐든 받는 호수(레이크, 하둡)를 둔다. 그런데 앱 주문, SNS 리뷰, 매장 센서까지 데이터가 홍수처럼 밀려오는데… 다음 장, <b>빅데이터</b>.</p>
  </div>
</section>

      <div class="box"><span class="tag blue">연료</span><h4>21세기의 원유</h4><p>원유처럼 정제해 쓰면 <b>생산성 향상</b>, 새 산업의 연료.</p></div>
      <div class="box"><span class="tag green">보는 도구</span><h4>렌즈</h4><p>현미경이 생물학을 바꿨듯 <b>세상을 보는 방식</b>을 바꿈.<br>예: <b>구글 Ngram Viewer</b> (수백 년 책 속 단어 빈도를 들여다봄)</p></div>
      <div class="box"><span class="tag green">올라타는 판</span><h4>플랫폼</h4><p>공동 활용을 위한 구조물. <b>제3자(써드파티)</b> 회사가 그 위에서 사업.<br>예: <b>카카오톡, 페이스북</b></p></div>
    </div>
  </div>
  <div class="link">
    <div class="row"><span class="term">써드파티 (Third Party)</span><span>원천 기술(플랫폼)을 활용해 <b>파생 상품을 만드는 제3자 회사</b>. 카카오톡 위에서 게임, 선물하기를 파는 회사들.</span></div>
  </div>
  <div class="memo">짝으로 외우기: <b>Ngram Viewer = 렌즈</b>(들여다봄), <b>카카오, 페이스북 = 플랫폼</b>(올라탐). 석탄·철과 원유는 "산업의 재료와 연료"라 사례 문제가 거의 없어요.</div>
</section>

<!-- ============ 4 ============ -->
<section class="ep" id="e4">
  <div class="eph"><span class="no">4화</span><h2>사장님의 일하는 방식이 바뀌었다</h2><span class="pg">5쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>예전엔 저장이 비싸서 <b>필요한 것만 골라, 일부만 조사하고, 깔끔한 데이터로, 원인을 따졌다</b>. 이제 다 담을 수 있으니 <b>일단 다 모아 두고, 전부 보고, 양으로 밀어붙이고, 같이 움직이는 패턴만 알아도 된다</b>.</div>
  <div class="fig">
    <div class="tblwrap">
      <table class="act">
        <tr><th>예전 (데이터가 귀할 때)</th><th>→</th><th>지금 (빅데이터)</th><th>사장님 가게에서</th></tr>
        <tr><td>사전처리</td><td>→</td><td><b>사후처리</b></td><td>미리 필요한 칸만 정해 저장하던 걸, 일단 다 저장하고 필요할 때 가공</td></tr>
        <tr><td>표본조사</td><td>→</td><td><b>전수조사</b></td><td>손님 100명 설문 대신 전체 결제 기록을 다 봄</td></tr>
        <tr><td>질</td><td>→</td><td><b>양</b></td><td>몇 건 틀린 기록이 섞여도 수백만 건이면 전체 흐름은 맞음</td></tr>
        <tr><td>인과관계</td><td>→</td><td><b>상관관계</b></td><td>"치킨 사는 손님은 맥주도 산다". 이유는 몰라도 옆에 진열하면 매출이 오름</td></tr>
      </table>
    </div>
  </div>
  <div class="link">
    <div class="row"><span class="term">상관관계 (Correlation)</span><span>둘이 <b>같이 움직이는</b> 관계</span></div>
    <div class="row"><span class="term">인과관계 (Causation)</span><span>하나가 <b>원인</b>, 다른 하나가 <b>결과</b>인 관계</span></div>
  </div>
  <div class="trap">"<b>양 → 질</b>", "상관 → 인과"처럼 <b>화살표를 뒤집은</b> 보기가 단골 함정이에요. 빅데이터는 늘 오른쪽(사후, 전수, 양, 상관)으로 갔어요.</div>
  <div class="memo"><b>전후양상</b>: <b>전</b>수, 사<b>후</b>, <b>양</b>, <b>상</b>관. 넷 다 "빅데이터 쪽" 단어만 모은 거예요.</div>
</section>

<!-- ============ 5 ============ -->
<section class="ep" id="e5">
  <div class="eph"><span class="no">5화</span><h2>이 데이터, 값을 얼마로 매기지?</h2><span class="pg">5쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>본사가 "가게 데이터 얼마에 팔래요?" 묻자 사장님은 답을 못 한다. <b>누가 어디에 쓸지 모르고</b>, <b>없던 가치가 새로 생기고</b>, <b>오늘 쓸모없던 게 내일 새 기술로 쓸모 있어지니까</b>.</div>
  <div class="fig">
    <div class="three">
      <div class="box"><h4>활용 방식</h4><p>언제, 어디서, 누가 쓸지 <b>알 수 없음</b>. 재사용, 재조합, 다목적 활용이 계속 생김. 결제 기록이 날씨 회사에 팔릴 수도.</p></div>
      <div class="box"><h4>새로운 가치 창출</h4><p>기존에 <b>없던 가치</b>를 만듦. 처음 보는 가치는 값을 비교할 대상이 없음.</p></div>
      <div class="box"><h4>분석 기술 발전</h4><p>지금 가치 없는 데이터도 <b>새 기법이 나오면</b> 가치가 생김. CCTV 영상이 동선 분석 재료가 되는 식.</p></div>
    </div>
  </div>
  <div class="trap">"데이터 저장 비용이 계속 비싸지고 있다"는 가치 산정이 어려운 이유가 <b>아니에요</b>. 사실도 틀렸고(값은 싸졌어요), 가치 산정과도 관계없어요.</div>
</section>

<!-- ============ 6 ============ -->
<section class="ep" id="e6">
  <div class="eph"><span class="no">6화</span><h2>홍수 속에서 무엇을 건지나: 분석기법</h2><span class="pg">5~6쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>기법 이름은 몰라도 <b>"사장님이 던진 질문"</b>을 보면 고를 수 있다. 같이 팔리나? 어느 쪽인가? 얼마나 영향? 가장 좋은 배치는? 질문 모양이 곧 기법이다.</div>
  <div class="fig">
    <div class="tblwrap">
      <table class="act">
        <tr><th>기법</th><th>사장님의 질문</th><th>교재 예시</th></tr>
        <tr><td>연관규칙</td><td>뭐랑 뭐가 <b>같이</b> 팔리지?</td><td>치킨 사는 고객은 맥주도 산다 (장바구니 분석)</td></tr>
        <tr><td>분류분석</td><td>이건 <b>어느 그룹</b>이지?</td><td>스팸메일인지 아닌지 판별</td></tr>
        <tr><td>회귀분석</td><td>이게 저기에 <b>얼마나 영향</b>을 주지?</td><td>나이가 매출에 미치는 영향</td></tr>
        <tr><td>유전자 알고리즘</td><td><b>가장 좋은</b> 조합은 뭐지? (최적화)</td><td>택배차 배치, 최대 시청률 편성</td></tr>
        <tr><td>기계학습</td><td>배운 걸로 <b>예측</b>하면?</td><td>넷플릭스 추천</td></tr>
        <tr><td>감정분석</td><td>리뷰가 <b>좋은 말이야 나쁜 말이야</b>?</td><td>글의 긍정, 부정</td></tr>
        <tr><td>소셜 네트워크 분석</td><td>누가 <b>영향력</b>이 크지?</td><td>SNS 관계망 속 영향력자 찾기</td></tr>
        <tr><td>텍스트 마이닝</td><td>글 속에 숨은 <b>의미</b>는?</td><td>자연어 처리로 리뷰 속 주제 발견</td></tr>
      </table>
    </div>
  </div>
  <div class="link">
    <div class="row"><span class="term">유전자 알고리즘</span><span>생물이 진화하듯 <b>좋은 답끼리 섞고 조금씩 바꿔 가며</b> 최적의 답을 찾는 방법</span></div>
  </div>
  <div class="memo">"<b>최적의</b> 배치", "<b>최대</b> 시청률"처럼 "가장 좋은 것 찾기"가 보이면 <b>유전자 알고리즘</b>. "같이"가 보이면 <b>연관규칙</b>, "영향력자"가 보이면 <b>소셜 네트워크 분석</b>.</div>
</section>

  <p style="margin:0 0 10px;color:var(--muted)">답을 떠올려 본 뒤 눌러서 확인하세요. 5개 이상 떠오르면 오늘은 충분해요.</p>

    <details><summary>구글 Ngram Viewer는 어느 비유? 카카오톡은?</summary><div class="in"><p>Ngram Viewer는 <b>렌즈</b>(세상을 들여다보는 도구), 카카오톡은 <b>플랫폼</b>(써드파티가 올라타는 판).</p></div></details>

    <details><summary>"치킨 사는 손님은 맥주도 산다"를 찾는 기법은?</summary><div class="in"><p><b>연관규칙</b>(장바구니 분석). 같이 일어나는 패턴.</p></div></details>
    <details><summary>SNS에서 영향력 큰 사용자를 찾는 기법은?</summary><div class="in"><p><b>소셜 네트워크 분석</b>. 사람 사이 관계망을 봐요.</p></div></details>
    <details><summary>빅데이터 출현 배경이나 가치 산정이 어려운 이유와 거리가 먼 것은?</summary><div class="in"><p>"저장 장치 가격 <b>상승</b>", "저장 비용이 <b>비싸짐</b>". 실제로는 <b>싸져서</b> 빅데이터가 가능해졌어요.</p></div></details>
  </div>
  <div class="end">
    <h3>3장 한 문장</h3>
    <p>스마트폰, SNS, 센서가 쏟아낸 데이터를 클라우드와 하둡이 싸게 감당하면서 <b>3V</b>(많고, 다양하고, 빠른) 빅데이터가 생겼고, 석탄·철, 원유, <b>렌즈, 플랫폼</b>처럼 쓰이며, 일하는 방식을 <b>전후양상</b>(전수, 사후, 양, 상관)으로 바꿨다. 그런데 손님 동선, 결제, 위치까지 다 모으다 보니 "이거 괜찮은 건가?" 경고등이 켜지는데… 다음 장, <b>위기와 개인정보</b>.</p>
  </div>
</section>

  <h1>편의점 사장님, 데이터의 경고등을 보다</h1>
  <p>3장에서 사장님은 결제, 앱 주문, 위치, 리뷰까지 몽땅 모았어요. 그러다 어느 날 단골손님이 항의해요. "내가 매일 몇 시에 오는지 왜 알아요?" 4장은 빅데이터의 <b>부작용 3가지와 각각의 해결책</b>, 그리고 <b>개인정보를 가려서 안전하게 쓰는 법</b>이에요.</p>

<section class="ep" id="e1">

<!-- ============ 2 ============ -->
<section class="ep" id="e2">
  <div class="eph"><span class="no">2화</span><h2>경고등마다 짝이 되는 해결책</h2><span class="pg">6쪽</span></div>

<!-- ============ 3 ============ -->
<section class="ep" id="e3">
  <div class="eph"><span class="no">3화</span><h2>법이 바뀌었다: 데이터 3법</h2><span class="pg">6쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>예전엔 개인정보를 쓰려면 매번 동의가 필요해 연구도 통계도 막혔다. 2020년 개정으로 <b>"가린 정보(가명정보)"라는 중간 단계</b>를 만들어, 통계, 연구, 공익 기록 목적이면 <b>동의 없이</b> 쓸 수 있게 했다.</div>
  <div class="fig">
    <div class="three">
      <div class="box"><span class="tag blue">개</span><h4>개인정보보호법</h4><p>개인정보 보호의 기본법</p></div>
      <div class="box"><span class="tag blue">정</span><h4>정보통신망법</h4><p>인터넷, 통신 서비스의 개인정보</p></div>
      <div class="box"><span class="tag blue">신</span><h4>신용정보법</h4><p>금융, 신용 거래 정보</p></div>

    <div class="box" style="margin-top:10px;border-color:var(--ink);border-width:2px"><h4>2020 개정의 핵심: 가명정보 도입</h4><p><b>통계 작성, 과학적 연구, 공익적 기록 보존</b> 목적이면 정보 주체의 <b>동의 없이</b> 가명정보를 활용 가능.</p></div>
  </div>
  <div class="trap">"데이터 3법이 아닌 것은?" 보기에 <b>전자정부법</b> 같은 비슷한 이름이 나와요. 3법은 <b>개, 정, 신</b> 셋뿐. 그리고 개정으로 새로 생긴 건 <b>가명정보</b>예요. 익명정보는 원래부터 제한 없이 쓸 수 있었어요.</div>

<section class="ep" id="e4">

<!-- ============ 5 ============ -->
<section class="ep" id="e5">
  <div class="eph"><span class="no">5화</span><h2>어떻게 가리나: 비식별화 5가지 기법</h2><span class="pg">6쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>사장님이 본사에 손님 기록을 넘기기 전에 가리는 방법이 다섯 가지. <b>이름을 바꾸거나, 평균으로 뭉치거나, 지우거나, 구간으로 묶거나, 일부를 O으로 덮는다</b>. 시험은 "예시 보고 기법 이름 고르기".</div>
  <div class="fig">
    <div class="tblwrap">
      <table class="act">
        <tr><th>기법</th><th>무엇을 하나</th><th>전</th><th>후</th></tr>
        <tr><td>가명처리</td><td><b>다른 이름</b>으로 바꿈</td><td>홍길동</td><td>임꺽정</td></tr>
        <tr><td>총계처리</td><td><b>합계, 평균</b>으로 뭉침</td><td>키 170, 180</td><td>평균 175</td></tr>
        <tr><td>데이터 삭제</td><td>식별 값을 <b>지움</b></td><td>주민번호 900101-1…</td><td>90년대생 남자</td></tr>
        <tr><td>범주화</td><td><b>구간</b>으로 묶음</td><td>35세</td><td>30~40세</td></tr>
        <tr><td>마스킹</td><td>일부를 <b>O으로 가림</b></td><td>홍길동</td><td>홍OO</td></tr>
      </table>
    </div>
  </div>
  <div class="trap"><b>홍길동 → 홍OO</b>는 이름을 바꾼 게 아니라 <b>일부를 가린</b> 거라 마스킹이에요. 가명처리는 <b>홍길동 → 임꺽정</b>처럼 아예 다른 이름. 둘을 바꿔 내는 문제가 단골이에요.</div>
  <div class="memo">신호 단어로: "<b>OO</b>로 가림" = 마스킹, "<b>~</b>(구간)" = 범주화, "<b>평균, 합계</b>" = 총계처리, "<b>다른 이름</b>" = 가명처리, "<b>지움</b>" = 데이터 삭제.</div>

  <div class="core"><small>한 줄 핵심</small>경고등을 다 끄고 나서 사장님이 깨달은 것: 데이터를 제대로 쓰려면 <b>데이터(자원)</b>, 그걸 담고 돌리는 <b>기술</b>, 그리고 무엇보다 <b>그걸 다룰 사람(인력)</b>이 있어야 한다.</div>

    </div>

  <div class="memo"><b>인자기</b>: <b>인</b>력, <b>자</b>원(데이터), <b>기</b>술.</div>

    <details><summary>"35세 → 30~40세", "키 170, 180 → 평균 175"는 각각?</summary><div class="in"><p>앞은 <b>범주화</b>(구간), 뒤는 <b>총계처리</b>(평균, 합계).</p></div></details>

<header id="e0">
  <span class="k">ADsP 5장 · 7쪽 · 이야기로 읽기</span>
  <h1>편의점 사장님, 데이터를 다룰 사람을 뽑다</h1>
  <p>4장 끝에서 사장님은 깨달았어요. 데이터도 기술도 있는데, 결국 <b>그걸 다룰 사람</b>이 없다는 걸요. 5장은 "어떤 사람을 뽑아야 하나"를 고민하며 채용공고를 쓰는 이야기이자, 1과목 전체의 마무리예요.</p>
</header>

<div class="core"><small>이 단원 전체를 한 문장으로</small>데이터는 <b>많다고 좋은 게 아니라</b> 목적에 맞아야 하고, 그걸 사업의 답으로 바꾸는 사람(데이터 사이언티스트)은 <b>분석, IT, 비즈니스</b>를 다 알고, 특히 <b>설득하고 통찰하는 능력(소프트 스킬)</b>이 중요하다.</div>

<section class="ep" id="e1">
  <div class="eph"><span class="no">1화</span><h2>다 모았는데 왜 답이 안 나오지?</h2><span class="pg">7쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>3장에서 사장님은 "많이 모을수록 좋다"고 믿었다. 그런데 전국 날씨, 전 세계 SNS까지 모아 봐도 <b>"내일 우리 가게 발주"</b>라는 질문엔 답이 안 나온다. 크기가 아니라 <b>질문(목적)에 맞는 데이터와 기법</b>이 먼저다.</div>
  <div class="fig">
    <div class="two">
      <div class="box"><span class="tag red">크기부터</span><h4>"일단 다 모으자"</h4><p>전 세계 날씨, 모든 SNS 글, 경쟁사 뉴스까지<br>→ 저장비만 들고 정작 쓸 데이터를 못 찾음</p></div>
      <div class="box"><span class="tag green">목적부터</span><h4>"무엇을 알고 싶지?"</h4><p>질문: 비 오는 날 무엇을 더 들여놓을까<br>→ 우리 동네 날씨 + 우리 가게 판매 기록이면 충분</p></div>
    </div>
  </div>
  <div class="link">
    <div class="row"><span class="term">Big에 초점을 맞추지 마라</span><span>전략 인사이트 확보의 <b>첫 원칙</b>. 데이터 크기보다 <b>분석 목적에 맞는 데이터와 기법</b>이 중요.</span></div>
  </div>
  <div class="trap">"데이터의 크기(Big)를 최우선으로 확보한다"는 <b>틀린</b> 방향이에요. 이름이 빅데이터라서 크기가 중요할 것 같지만, 교재의 답은 정반대.</div>
</section>

<section class="ep" id="e5">

  <div class="core"><small>한 줄 핵심</small>손으로 적던 장부를 컴퓨터로 옮기고(<b>디지털화</b>), 지점, 본사, 앱이 서로 이어지고(<b>연결</b>), 이제는 시스템이 알아서 발주까지 한다(<b>에이전시</b>). 빅데이터 가치의 흐름이 이 세 단계다.</div>

  </div>
  <div class="memo">"<b>디지털 → 연결 → 에이전시</b>". 사장님 가게 순서 그대로: 장부를 컴퓨터로 옮겨야 이을 수 있고, 이어져야 맡길 수 있어요.</div>

<section class="ep" id="qz">
  <div class="eph"><span class="no">끝</span><h2>확인 7문제</h2></div>
  <p style="margin:0 0 10px;color:var(--muted)">답을 떠올려 본 뒤 눌러서 확인하세요. 4개 이상 떠오르면 오늘은 충분해요.</p>
  <div class="quiz">
    <details><summary>전략 인사이트 확보의 첫 원칙은?</summary><div class="in"><p><b>Big에 초점을 맞추지 마라</b>. 크기보다 목적에 맞는 데이터와 기법.</p></div></details>
    <details><summary>데이터 사이언스의 핵심 구성요소 셋은? 하드웨어 제조는?</summary><div class="in"><p><b>Analytics, IT, 비즈니스 분석</b>(AI비). 하드웨어 제조는 아니에요.</p></div></details>
    <details><summary>통계 이론, 가설검정, 스토리텔링, 분석 기술 숙련 중 소프트 스킬은?</summary><div class="in"><p><b>스토리텔링</b>. 설득력 있는 전달이에요. 나머지는 하드 스킬.</p></div></details>
    <details><summary>창의적 사고, 커뮤니케이션, 빅데이터 이론 지식, 호기심 중 하드 스킬은?</summary><div class="in"><p><b>빅데이터 관련 이론 지식</b>. 나머지는 소프트 스킬.</p></div></details>
    <details><summary>빅데이터 가치 패러다임의 순서는?</summary><div class="in"><p><b>Digitalization → Connection → Agency</b>. 옮기고, 잇고, 맡긴다.</p></div></details>
    <details><summary>연결된 정보가 스스로 판단하고 행동하는 단계는?</summary><div class="in"><p><b>Agency</b>(대리인). Automation은 함정 보기.</p></div></details>
    <details><summary>데이터 사이언스에 대한 옳은 설명은?</summary><div class="in"><p><b>정형, 비정형을 막론하고 분석하는 총체적 접근</b>. 통계학보다 넓고, IT만 필요한 것도 아니에요.</p></div></details>
  </div>
  <div class="end">
    <h3>5장 한 문장</h3>
    <p><b>Big에 초점을 맞추지 말고</b> 목적에 맞게 분석해 <b>전략적 인사이트</b>를 얻으려면, <b>AI비</b>(분석, IT, 비즈니스)를 아우르고 <b>하드 스킬</b> 위에 <b>소프트 스킬</b>(통찰, 설득, 협력)을 갖춘 데이터 사이언티스트가 필요하다. 데이터의 가치는 <b>디지털화 → 연결 → 에이전시</b>로 나아간다.</p>
  </div>
  <div class="end" style="margin-top:12px">
    <h3>1과목 전체 줄거리</h3>
    <p>편의점 사장님이 영수증(<b>데이터</b>)에서 의미(<b>정보</b>)를 찾고(1장), 지점이 늘자 창고(<b>DB, DW, 레이크</b>)를 짓고(2장), 앱과 SNS로 데이터 홍수(<b>3V 빅데이터</b>)를 맞고(3장), 손님 사생활 경고등에 <b>가명정보, 비식별화</b>로 대응하고(4장), 마지막으로 이 모든 걸 사업의 답으로 바꿀 <b>사람(데이터 사이언티스트)</b>을 뽑는다(5장).</p>
  </div>
</section>

  <h1>인사팀장, "데이터로 뭘 좀 해 봐"라는 지시를 받다</h1>
  <p>1과목에서 데이터가 뭔지, 데이터 사이언티스트가 누군지 봤다면, 2과목은 <b>"그래서 회사에서 분석 프로젝트를 어떻게 시작하나"</b>예요. 커피 프랜차이즈 본사(가맹점 300곳)의 김 팀장이 6·7·8장 내내 주인공이에요.</p>
  <div class="speed">
    <div><b>시간 없을 때 10분</b>검은 상자 + 그림만</div>
    <div><b>보통 25분</b>필기 연결 칸까지</div>
    <div><b>여유 있을 때</b>회색 칸(+)도 펼치기</div>
  </div>
</header>

<div class="core"><small>이 단원 전체를 한 문장으로</small>막연한 지시를 받은 김 팀장이 <b>"우리가 뭘 알고 뭘 모르나"</b>부터 따져 보고(4유형), <b>남들이 다듬어 둔 표준 순서</b>(방법론: KDD, CRISP-DM, 빅데이터 분석 방법론)를 빌려 와 프로젝트를 시작하는 이야기.</div>

<!-- ============ 1 ============ -->
<section class="ep" id="e1">
  <div class="eph"><span class="no">1화</span><h2>대표님 지시: "데이터로 뭘 좀 해 봐"</h2><span class="pg">8쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>분석은 <b>무엇을(대상, What)</b>과 <b>어떻게(방법, How)</b>를 아느냐 모르느냐로 4가지. 대표님의 막연한 지시는 둘 다 모르는 <b>발견</b> 칸에서 시작해요.</div>
  <div class="fig">
    <svg viewBox="0 0 470 300" style="max-width:500px" role="img" aria-label="분석 4유형 사분면. 대상과 방법을 모두 알면 최적화, 대상만 알면 솔루션, 방법만 알면 통찰, 둘 다 모르면 발견">
      <text class="svgtxt" x="275" y="16" text-anchor="middle" font-weight="700">분석 방법 (How)</text>
      <text class="svgmut" x="185" y="38" text-anchor="middle">Known (앎)</text>
      <text class="svgmut" x="365" y="38" text-anchor="middle">Unknown (모름)</text>
      <text class="svgtxt" x="22" y="160" text-anchor="middle" font-weight="700" transform="rotate(-90 22 160)">분석 대상 (What)</text>
      <text class="svgmut" x="62" y="105" text-anchor="middle">Known</text>
      <text class="svgmut" x="62" y="215" text-anchor="middle">Unknown</text>
      <rect x="95" y="48" width="178" height="110" rx="8" fill="var(--ok-soft)" stroke="var(--ok)"/>
      <rect x="279" y="48" width="178" height="110" rx="8" fill="var(--blue-soft)" stroke="var(--blue)"/>
      <rect x="95" y="164" width="178" height="110" rx="8" fill="var(--amber-soft)" stroke="var(--amber)"/>
      <rect x="279" y="164" width="178" height="110" rx="8" fill="var(--omr-soft)" stroke="var(--omr)"/>
      <text class="svgtxt" x="184" y="76" text-anchor="middle" font-size="15" font-weight="700">최적화</text>
      <text class="svgmut" x="184" y="92" text-anchor="middle">Optimization</text>
      <text class="svgtxt" x="184" y="118" text-anchor="middle">근무표를 인건비</text>
      <text class="svgtxt" x="184" y="134" text-anchor="middle">가장 적게 짜기</text>
      <text class="svgtxt" x="368" y="76" text-anchor="middle" font-size="15" font-weight="700">솔루션</text>
      <text class="svgmut" x="368" y="92" text-anchor="middle">Solution</text>
      <text class="svgtxt" x="368" y="118" text-anchor="middle">신입 퇴사 줄이기,</text>
      <text class="svgtxt" x="368" y="134" text-anchor="middle">방법은 찾아야 함</text>
      <text class="svgtxt" x="184" y="192" text-anchor="middle" font-size="15" font-weight="700">통찰</text>
      <text class="svgmut" x="184" y="208" text-anchor="middle">Insight</text>
      <text class="svgtxt" x="184" y="234" text-anchor="middle">늘 하던 분석을 돌리다</text>
      <text class="svgtxt" x="184" y="250" text-anchor="middle">"오픈조 퇴사↑" 깨달음</text>
      <text class="svgtxt" x="368" y="192" text-anchor="middle" font-size="15" font-weight="700">발견</text>
      <text class="svgmut" x="368" y="208" text-anchor="middle">Discovery</text>
      <text class="svgtxt" x="368" y="234" text-anchor="middle">"데이터로 뭘 좀 해 봐"</text>
      <text class="svgtxt" x="368" y="250" text-anchor="middle">(지금 김 팀장)</text>
      <text class="svgmut" x="275" y="294" text-anchor="middle">한 회사 안에서도 과제마다 칸이 다르고, 칸을 넘나들며 분석해요</text>
    </svg>
  </div>
  <div class="link">
    <div class="row"><span class="term">최적화</span><span>대상도 방법도 앎. 이미 아는 문제를 <b>더 잘</b> 푸는 것</span></div>
    <div class="row"><span class="term">솔루션</span><span>대상은 앎, 방법을 모름. <b>해결 방법을 찾아내는</b> 것</span></div>
    <div class="row"><span class="term">통찰</span><span>방법은 앎, 대상을 모름. 하던 분석으로 들여다보다 <b>새로 깨닫는</b> 것</span></div>
    <div class="row"><span class="term">발견</span><span>둘 다 모름. 대상부터 <b>새로 찾아내는</b> 것</span></div>

  <div class="memo">위 줄(대상을 앎)은 <b>해결 계열</b>(최적화, 솔루션), 아래 줄(대상을 모름)은 <b>깨달음 계열</b>(통찰, 발견). "방법을 모르면 솔루션(해결책)을 찾는다"로 하나만 잡으면 나머지가 자리 잡혀요.</div>
  <div class="trap"><b>통찰</b>과 <b>솔루션</b>이 자주 뒤바뀌어 나와요. 통찰은 "방법(How)은 아는데 대상(What)을 모름", 솔루션은 그 반대예요.</div>
</section>

<!-- ============ 2 ============ -->
<section class="ep" id="e2">
  <div class="eph"><span class="no">2화</span><h2>급한 불부터? 긴 계획부터?</h2><span class="pg">8쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>당장 성과를 보여 줄 <b>과제 중심 접근(빨리)</b>과, 회사에 분석 문화를 심는 <b>장기 마스터플랜(길게, 정확하게)</b>. 실제로는 둘을 같이 가져가요.</div>
  <div class="fig">
    <div class="two">
      <div class="box">
        <span class="tag red">과제 중심적 접근</span>
        <h4>"이번 분기 퇴사율부터 잡자"</h4>
        <p>1차 목표 <b>Speed &amp; Test</b><br>과제 유형 <b>Quick &amp; Win</b><br>접근 방식 <b>Problem Solving</b></p>
        <p style="margin-top:6px;color:var(--muted);font-size:13.5px">빨리 해 보고, 빨리 이겨서, 눈앞 문제를 해결</p>
      </div>
      <div class="box">
        <span class="tag blue">장기적 마스터플랜</span>
        <h4>"3년 뒤엔 모든 부서가 데이터로 결정"</h4>
        <p>1차 목표 <b>Accuracy &amp; Deploy</b><br>과제 유형 <b>Long Term View</b><br>접근 방식 <b>Problem Definition</b></p>
        <p style="margin-top:6px;color:var(--muted);font-size:13.5px">정확하게, 현장에 깔고, 근본 원인부터 정의</p>
      </div>
    </div>
  </div>
  <div class="say"><p>대표님은 "다음 달 회의 때 뭐라도 보여 줘"와 "우리도 데이터 회사가 돼야지"를 동시에 말해요. 그래서 김 팀장은 <b>빠른 성과(Quick Win)로 신뢰를 얻으면서 장기 계획을 함께</b> 세우기로 해요.</p></div>
  <p class="linkh">시작 전에 따져 볼 3가지 (분석 기획 시 고려사항)</p>
  <div class="fig">
    <div class="three">
      <div class="box"><h4>① 가용 데이터</h4><p>지금 쓸 수 있는 데이터가 뭔가? 근태, 급여, POS는 있고, 퇴사 면담 기록은 종이뿐.</p></div>
      <div class="box"><h4>② 유스케이스</h4><p>비슷한 성공 사례(유사 시나리오)가 있나? 다른 프랜차이즈의 퇴사 예측 사례 찾기.</p></div>
      <div class="box"><h4>③ 장애요소 대비</h4><p>막힐 곳을 미리 계획. 개인정보 동의, 점주 반발, 담당자 교육.</p></div>
    </div>
  </div>
  <div class="trap">"Accuracy &amp; Deploy"를 과제 중심 쪽 보기로 섞어 내요. <b>Speed, Quick, Solving</b> = 과제 중심 / <b>Accuracy, Long, Definition</b> = 마스터플랜.</div>
</section>

<p class="part">PART 2 · 표준 순서 빌려 오기 (8~10쪽)</p>

<!-- ============ 3 ============ -->
<section class="ep" id="e3">
  <div class="eph"><span class="no">3화</span><h2>사람마다 제멋대로면 곤란하다: 방법론</h2><span class="pg">8쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>순서가 없으면 경험 많은 사람만 분석할 수 있고, 매번 결과물 모양이 달라요. 그래서 <b>절차, 방법, 도구, 양식을 묶은 표준 순서</b>(방법론)를 쓴다. 그 뼈대가 <b>단계 → 태스크 → 스텝</b>.</div>
  <div class="fig">
    <svg viewBox="0 0 460 210" style="max-width:500px" role="img" aria-label="계층적 프로세스 모델: 큰 상자 단계 안에 태스크, 태스크 안에 스텝이 들어 있음">

      <rect x="30" y="60" width="400" height="126" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
      <text class="svgtxt" x="44" y="82" font-weight="700" font-size="13.5">태스크 (Task)</text>
      <text class="svgmut" x="44" y="98">예: 프로젝트 위험 계획 수립 · 단계를 이루는 단위 활동</text>
      <rect x="50" y="110" width="170" height="62" rx="7" fill="var(--hl)"/>
      <text class="svgtxt" x="135" y="134" text-anchor="middle" font-weight="700">스텝 (Step)</text>
      <text class="svgmut" x="135" y="152" text-anchor="middle">위험 목록 작성 (3일)</text>

      <text class="svgtxt" x="325" y="134" text-anchor="middle" font-weight="700">스텝 (Step)</text>
      <text class="svgmut" x="325" y="152" text-anchor="middle">대응 방법 정하기 (2일)</text>
    </svg>
    <p class="cap">큰 상자부터: 단계 ⊃ 태스크 ⊃ 스텝. 스텝은 며칠 안에 끝나는 작업 묶음(Work Package).</p>
  </div>
  <p class="linkh">필기 용어 연결</p>
  <div class="link">
    <div class="row"><span class="term">방법론 구성요소</span><span><b>절차, 방법, 도구와 기법, 템플릿과 산출물</b>. 요리책으로 치면 순서, 조리법, 조리도구, 완성 사진.</span></div>
    <div class="row"><span class="term">계층적 프로세스 모델</span><span>방법론을 <b>단계 → 태스크 → 스텝</b> 3층으로 쪼갠 뼈대. 7화의 빅데이터 분석 방법론이 이 모양.</span></div>
    <div class="row"><span class="term">기준선 (Baseline)</span><span>단계가 끝날 때 확정해 두는 결과물. 이후 변경은 정식 절차로만.</span></div>
    <div class="row"><span class="term">Work Package</span><span>스텝 = 짧은 기간에 끝내는 작업 묶음 (WBS의 맨 아래 칸)</span></div>
  </div>
  <div class="trap">구성요소 "아닌 것"으로 <b>예산, 인력</b> 같은 그럴듯한 보기가 나와요. 방법론은 일하는 <b>순서와 양식</b>이지 자원이 아니에요.</div>
</section>

<!-- ============ 4 ============ -->
<section class="ep" id="e4">
  <div class="eph"><span class="no">4화</span><h2>한 번에 쭉? 조금씩 돌며?: 개발 모델 4가지</h2><span class="pg">8~9쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>요구사항이 확실하면 계단처럼 한 번에(<b>폭포수</b>), 뭘 원하는지 모르면 시안부터(<b>프로토타입</b>), 위험이 크면 돌며 위험 제거(<b>나선형</b>), 현장 의견이 자주 바뀌면 짧게 자주(<b>애자일</b>).</div>

        <rect x="10" y="14" width="40" height="18" rx="4"/><rect x="34" y="40" width="40" height="18" rx="4"/><rect x="58" y="66" width="40" height="18" rx="4"/><rect x="82" y="92" width="34" height="18" rx="4"/>
      </g>
      <g stroke="var(--muted)" stroke-width="1.5" fill="none"><path d="M50 23 H56 V38"/><path d="M74 49 H80 V64"/><path d="M98 75 H104 V90"/></g>

      <div class="box"><span class="tag blue">폭포수 (Waterfall)</span><h4>앞 단계가 끝나야 다음 단계</h4><p>위에서 아래로(Top-Down) 한 방향. 요구사항이 확실한 <b>급여 시스템 교체</b>에 맞음. 중간에 바꾸기 어려움.</p></div>
      <div class="box"><span class="tag green">프로토타입 (Prototype)</span><h4>일부를 먼저 만들고 보완</h4><p>대표님도 뭘 원하는지 모를 때 <b>대시보드 시안</b>부터 보여 주고 고침. 7장 상향식과 연결.</p></div>
      <div class="box"><span class="tag red">나선형 (Spiral)</span><h4>반복하며 점진 완성, 위험 제거</h4><p>돌 때마다 <b>위험을 점검</b>. 전국 300곳 시스템처럼 크고 위험한 사업.</p></div>
      <div class="box"><span class="tag green">애자일 (Agile)</span><h4>짧은 주기, 고객 피드백 반복</h4><p>2주마다 점장들 의견을 받아 바로 반영. 민첩하게.</p></div>
    </div>
  </div>
  <div class="trap">"반복"은 나선형과 애자일 둘 다 해요. <b>위험요소 제거</b>가 보이면 <b>나선형</b>, <b>짧은 주기·고객 피드백</b>이 보이면 <b>애자일</b>.</div>
</section>

<!-- ============ 5 ============ -->
<section class="ep" id="e5">
  <div class="eph"><span class="no">5화</span><h2>데이터 더미에서 지식을 캐는 순서: KDD</h2><span class="pg">9쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>KDD는 이름 그대로 <b>데이터베이스에서 지식 발견</b>(Knowledge Discovery in Databases). 데이터를 고르고, 청소하고, 줄이고, 캐고, 평가하는 5단계.</div>
  <div class="fig">
    <div class="flows">
      <div class="flow">
        <div class="fh"><b>KDD 5단계</b><span class="tag blue">선전변마평</span></div>
        <div class="fl"><span>① 데이터<br>선택</span><i>→</i><span class="hi">② 전처리</span><i>→</i><span class="hi">③ 변환</span><i>→</i><span>④ 데이터<br>마이닝</span><i>→</i><span>⑤ 결과<br>평가</span></div>
      </div>
    </div>
    <div class="tblwrap" style="margin-top:10px">
    <table class="act">
      <tr><th>단계</th><th>김 팀장 프로젝트에서</th><th>한 단어로</th></tr>
      <tr><td>① 데이터 선택</td><td>근태, 급여, 매장 데이터 중 바리스타 1년치를 골라 목표 데이터 만들기</td><td>고르기</td></tr>
      <tr><td>② 전처리</td><td>빈칸(결측), 튀는 값(이상값), 잡음 정리</td><td>청소</td></tr>
      <tr><td>③ 변환</td><td>변수 50개 중 쓸 것만 고르기(변수 선택), 비슷한 것끼리 합치기(차원 축소)</td><td>다이어트</td></tr>
      <tr><td>④ 데이터 마이닝</td><td>분류, 군집 같은 기법으로 퇴사 패턴 찾기</td><td>캐기</td></tr>
      <tr><td>⑤ 결과 평가</td><td>찾은 패턴이 쓸 만한 지식인지 해석하고 평가</td><td>감정</td></tr>
    </table>
    </div>
  </div>
  <div class="trap">"변수 선택, 차원 축소"는 <b>변환</b>, "잡음, 이상값, 결측 처리"는 <b>전처리</b>. 둘 다 데이터를 손보는 단계라 서로 바꿔서 출제돼요. 청소(전처리) 다음에 다이어트(변환).</div>
</section>

<!-- ============ 6 ============ -->
<section class="ep" id="e6">
  <div class="eph"><span class="no">6화</span><h2>업무에서 출발해 현장에 까는 순서: CRISP-DM</h2><span class="pg">9쪽</span></div>

    <tr><th>단계</th><th>하는 일 (교재 키워드)</th><th>김 팀장 버전</th></tr>
    <tr><td>업무 이해</td><td>목적 파악, 상황 파악, 목표 설정, 계획 수립</td><td>"6개월 내 퇴사를 30% 줄이자"</td></tr>
    <tr><td>데이터 이해</td><td>초기 수집, 기술 분석, <b>EDA</b>, <b>품질 확인</b></td><td>근태 파일을 열어 보니 빈칸이 많네</td></tr>
    <tr><td>데이터 준비</td><td>데이터셋 선택, 정제, 통합 (분석용 데이터 만들기)</td><td>근태 + 급여 + 매장 매출을 한 표로</td></tr>
    <tr><td>모델링</td><td>기법 선택, 테스트 계획, 모델 작성과 평가</td><td>퇴사 예측 모델 만들기</td></tr>
    <tr><td>평가</td><td>분석 결과 평가, 모델링 과정 평가, 적용성 평가</td><td>"이걸로 진짜 퇴사가 줄겠나?"</td></tr>
    <tr><td>전개</td><td>전개 계획, 모니터링·유지보수 계획, 종료 보고서, 리뷰</td><td>전국 점장 화면에 위험 알림 띄우기</td></tr>

  <div class="link">
    <div class="row"><span class="term">CRISP-DM</span><span>Cross Industry Standard Process for Data Mining. 업종 가리지 않는 데이터 마이닝 표준 순서</span></div>
    <div class="row"><span class="term">전개 (Deployment)</span><span>만든 모델을 실제 업무에 까는 것</span></div>
  </div>
  <div class="memo"><b>업데데모평전</b> ("업데이트 모델 평가전"). 데이터 두 번(이해, 준비)은 "열어 보고 → 다듬고" 순서.</div>
  <div class="trap">EDA와 품질 확인은 <b>데이터 이해</b> 단계예요. "데이터를 손보는" 데이터 준비와 헷갈리지 않게: 이해 = 들여다보기, 준비 = 손보기.</div>
</section>

<!-- ============ 7 ============ -->
<section class="ep" id="e7">
  <div class="eph"><span class="no">7화</span><h2>우리 교재의 표준 순서: 빅데이터 분석 방법론</h2><span class="pg">9~10쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>국내 교재가 정리한 5단계: <b>기획 → 준비 → 분석 → 구현 → 평가</b>. 3화의 단계-태스크-스텝 뼈대 위에 세운 순서이고, <b>위험 계획은 맨 처음 기획 단계</b>에서 세워요.</div>
  <div class="fig">
    <div class="flows">
      <div class="flow">
        <div class="fh"><b>빅데이터 분석 방법론 5단계</b><span class="tag blue">기준분구평</span></div>
        <div class="fl"><span class="hi">① 분석<br>기획</span><i>→</i><span>② 데이터<br>준비</span><i>→</i><span>③ 데이터<br>분석</span><i>→</i><span>④ 시스템<br>구현</span><i>→</i><span>⑤ 평가 및<br>전개</span></div>
      </div>
    </div>
    <div class="tblwrap" style="margin-top:10px">
    <table class="act">
      <tr><th>단계</th><th>태스크 (교재 키워드)</th></tr>
      <tr><td>① 분석 기획</td><td>비즈니스 이해 및 범위 설정(<b>SOW</b> 작성), 프로젝트 정의, <b>프로젝트 위험 계획</b> 수립</td></tr>
      <tr><td>② 데이터 준비</td><td>필요 데이터 정의, 데이터 스토어 설계, 데이터 수집 및 정합성 점검</td></tr>
      <tr><td>③ 데이터 분석</td><td>분석용 데이터 준비, 텍스트 분석, <b>탐색적 분석(EDA)</b>, 모델링, 모델 평가</td></tr>
      <tr><td>④ 시스템 구현</td><td>설계 및 구현, 시스템 테스트 및 운영</td></tr>
      <tr><td>⑤ 평가 및 전개</td><td>모델 발전 계획, 프로젝트 평가 보고</td></tr>
    </table>
    </div>
  </div>
  <p class="linkh">위험 대응 4가지 (회전완수)</p>
  <div class="fig">
    <div class="two">
      <div class="box"><span class="tag red">회피</span><h4>위험한 일을 아예 안 함</h4><p>개인정보 문제가 큰 "직원 SNS 분석"은 범위에서 뺌</p></div>
      <div class="box"><span class="tag blue">전이</span><h4>위험을 남에게 넘김</h4><p>보안 사고 책임을 전문 업체 계약이나 보험으로 넘김</p></div>
      <div class="box"><span class="tag green">완화</span><h4>위험의 크기나 확률을 줄임</h4><p>데이터가 늦게 올 위험에 대비해 샘플을 미리 받아 둠</p></div>
      <div class="box"><span class="tag green">수용</span><h4>알고도 받아들임</h4><p>며칠 정도의 일정 지연은 감수하기로 함</p></div>
    </div>
  </div>
  <p class="linkh">세 방법론 나란히 (순서 섞기 문제 대비)</p>
  <div class="tblwrap">
  <table class="act">
    <tr><th>방법론</th><th>단계</th><th>시작 → 끝</th></tr>
    <tr><td>KDD</td><td>5: 선택, 전처리, 변환, 마이닝, 결과 평가</td><td>데이터 선택 → 결과 평가</td></tr>
    <tr><td>CRISP-DM</td><td>6: 업무 이해, 데이터 이해, 데이터 준비, 모델링, 평가, 전개</td><td>업무 이해 → 전개</td></tr>
    <tr><td>빅데이터</td><td>5: 분석 기획, 데이터 준비, 데이터 분석, 시스템 구현, 평가 및 전개</td><td>분석 기획 → 평가 및 전개</td></tr>
  </table>
  </div>
  <div class="trap">위험 계획은 문제가 생긴 뒤가 아니라 <b>시작할 때(분석 기획)</b> 세워요. 또 "EDA"는 CRISP-DM에선 <b>데이터 이해</b>, 빅데이터 방법론에선 <b>데이터 분석</b> 단계예요. 어느 방법론을 묻는지 먼저 보세요.</div>
  <div class="memo">요약노트에는 ③까지만 글로 적혀 있어요. <b>④ 시스템 구현, ⑤ 평가 및 전개</b>까지 "기준분구평" 다섯 글자로.</div>
</section>

  <p style="margin:0 0 10px;color:var(--muted)">답을 떠올려 본 뒤 눌러서 확인하세요.</p>
  <div class="quiz">
    <details><summary>대상은 아는데 방법을 모르면? 방법은 아는데 대상을 모르면?</summary><div class="in"><p>앞은 <b>솔루션</b>(방법을 찾아야 함), 뒤는 <b>통찰</b>(하던 분석으로 들여다보다 깨달음). 둘 다 모르면 발견, 둘 다 알면 최적화.</p></div></details>
    <details><summary>Quick &amp; Win은 과제 중심? 마스터플랜?</summary><div class="in"><p><b>과제 중심</b>(Speed &amp; Test, Problem Solving). 마스터플랜은 Accuracy &amp; Deploy, Long Term View, Problem Definition.</p></div></details>
    <details><summary>방법론 구성요소 4가지는?</summary><div class="in"><p><b>절차, 방법, 도구와 기법, 템플릿과 산출물</b>. 예산, 인력은 아님.</p></div></details>
    <details><summary>계층적 프로세스 모델을 큰 것부터?</summary><div class="in"><p><b>단계 → 태스크 → 스텝</b>. 단계는 기준선(Baseline)으로 관리, 스텝은 Work Package.</p></div></details>
    <details><summary>반복하며 위험요소 제거에 초점을 둔 모델은?</summary><div class="in"><p><b>나선형</b>. 짧은 주기와 고객 피드백이면 애자일.</p></div></details>
    <details><summary>KDD에서 차원 축소는 어느 단계?</summary><div class="in"><p><b>변환</b>(다이어트). 결측·이상값 처리는 전처리(청소). 순서 "선전변마평".</p></div></details>
    <details><summary>CRISP-DM에서 EDA와 품질 확인은 어느 단계?</summary><div class="in"><p><b>데이터 이해</b>. 순서 "업데데모평전", 업무 이해로 시작해 전개로 끝.</p></div></details>
    <details><summary>빅데이터 분석 방법론에서 위험 계획은 어느 단계? 대응 4가지는?</summary><div class="in"><p><b>분석 기획</b> 단계(SOW 작성과 함께). 대응은 <b>회피, 전이, 완화, 수용</b>. "확대"는 없음.</p></div></details>
  </div>
  <div class="end">
    <h3>6장 한 문장</h3>
    <p>"데이터로 뭘 해 봐"라는 막연한 지시(<b>발견</b>)를 받은 김 팀장이 <b>빠른 성과와 장기 계획</b>을 함께 잡고, 사람마다 제각각이 되지 않게 <b>표준 순서(방법론)</b>를 빌려 온다: 데이터에서 캐는 <b>KDD</b>(선전변마평), 업무에서 시작하는 <b>CRISP-DM</b>(업데데모평전), 교재 표준 <b>빅데이터 분석 방법론</b>(기준분구평, 위험은 기획 단계에서).</p>
  </div>

<p class="part">PART 2 · 상향식과 혼합 (10~11쪽)</p>

<!-- ============ 4 ============ -->
<section class="ep" id="e4">
  <div class="eph"><span class="no">4화</span><h2>상향식: 뭐가 문제인지 모를 때는 데이터부터</h2><span class="pg">10쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>"요즘 매장 분위기가 안 좋다는데 이유를 모르겠다." 이럴 땐 질문부터 세우기 어려우니 <b>데이터를 있는 그대로 보며 "무엇(What)이 보이나"</b>를 찾아요. 정답 없이 끼리끼리 묶는 <b>비지도학습</b>, 일단 만들어 보는 <b>프로토타이핑</b>이 무기.</div>

    </div>

      <text class="svgtxt" x="320" y="136" text-anchor="middle" font-weight="700">주말 오픈 혼자 근무 무리</text>

  <div class="link">
    <div class="row"><span class="term">비지도학습</span><span>정답 없이 데이터끼리의 패턴(묶음, 함께 나타나는 것)을 찾는 방법. 15장 군집분석, 연관규칙</span></div>

    <p>그래서 대충이라도 "주말 오픈조 위험 알림" 화면을 만들어 보여 주면 "이거 좋네, 근데 마감조도 보고 싶어"처럼 진짜 요구가 나와요. 6장의 <b>프로토타입 모델</b>과 같은 생각이에요.</p>

  <div class="core"><small>한 줄 핵심</small>실제로는 둘을 섞어요. 데이터를 보며 아이디어를 <b>넓게 펼치는 발산 = 상향식</b>, 그중 쓸 만한 걸 <b>골라 검증하는 수렴 = 하향식</b>. 대표 예가 디자인 싱킹.</div>

      <text class="svgtxt" x="325" y="80" text-anchor="middle" font-weight="700" font-size="14">수렴 = 하향식</text>

  </div>
  <div class="fig">

<p class="part">PART 3 · 과제를 프로젝트로 (10~11쪽)</p>

<!-- ============ 6 ============ -->
<section class="ep" id="e6">
  <div class="eph"><span class="no">6화</span><h2>찾은 과제를 종이 한 장에, 그리고 따져 볼 5가지</h2><span class="pg">10~11쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>여러 방식으로 찾은 과제는 <b>분석과제 정의서</b>로 정리해 계획서의 재료로 쓰고, 결과를 어디에 쓸지는 <b>분석 활용 시나리오</b>로 적어요. 과제를 관리할 땐 <b>데이터 양, 속도, 데이터 복잡성, 분석 복잡성, 정확도와 정밀도</b> 5가지를 따져요.</div>

    </div>
  </div>

  <p>7장까지 김 팀장은 과제 하나(퇴사 예측)를 찾아 굴렸어요. 소문이 나자 마케팅, 구매, 매장운영팀까지 과제를 들고 와요. 8장은 <b>여러 과제 중 무엇부터 할지(우선순위)</b>, <b>몇 년짜리 계획(마스터플랜)</b>, 그리고 <b>회사가 분석할 체력이 되는지 진단하고 관리 체계(거버넌스)를 세우는</b> 이야기예요. 2과목의 마지막 단원이에요.</p>

      <text class="svgtxt" x="378" y="110" text-anchor="middle">6개 요소를 모두 갖추고</text>
      <text class="svgtxt" x="378" y="126" text-anchor="middle">부서마다 분석을 씀</text>
      <text class="svgmut" x="378" y="148" text-anchor="middle">→ 지속적 확산 (목표)</text>
      <text class="svgtxt" x="196" y="194" text-anchor="middle" font-size="15" font-weight="700">준비형</text>
      <text class="svgmut" x="196" y="214" text-anchor="middle">준비도 낮음 · 성숙도 낮음</text>
      <text class="svgtxt" x="196" y="240" text-anchor="middle">엑셀뿐, 분석하는 사람도</text>
      <text class="svgtxt" x="196" y="256" text-anchor="middle">없음 (작년 우리 회사)</text>
      <text class="svgmut" x="196" y="278" text-anchor="middle">→ 사전 준비 필요</text>
      <text class="svgtxt" x="378" y="194" text-anchor="middle" font-size="15" font-weight="700">도입형</text>
      <text class="svgmut" x="378" y="214" text-anchor="middle">준비도 높음 · 성숙도 낮음</text>
      <text class="svgtxt" x="378" y="240" text-anchor="middle">BI 도구, 분석가 다 들였는데</text>
      <text class="svgtxt" x="378" y="256" text-anchor="middle">현업은 아직 안 씀</text>
      <text class="svgmut" x="378" y="278" text-anchor="middle">→ 바로 도입 가능</text>

        <circle cx="266" cy="186" r="11" fill="var(--omr)"/><text x="266" y="190" fill="#fff">1</text>
        <circle cx="448" cy="186" r="11" fill="var(--omr)"/><text x="448" y="190" fill="#fff">2</text>
        <circle cx="448" cy="56" r="11" fill="var(--omr)"/><text x="448" y="60" fill="#fff">3</text>
      </g>
    </svg>
    <p class="cap">빨간 번호 = 김 팀장 회사의 길: ① 준비형 → (도구·인력 투자) ② 도입형 → (현업 활용) ③ 확산형</p>
  </div>
  <div class="two">
    <div class="box"><span class="tag blue">도입형</span><h4>체력은 좋은데 실력은 아직</h4><p>준비도 <b>높음</b>, 성숙도 <b>낮음</b>. 장비 다 갖춘 헬스 초보. 바로 도입(운동 시작)만 하면 됨.</p></div>
    <div class="box"><span class="tag red">정착형</span><h4>체력은 약한데 실력은 있음</h4><p>준비도 <b>낮음</b>, 성숙도 <b>높음</b>. 맨몸으로 몇 가지 운동을 잘하는 사람. 기반을 다져 정착시켜야 함.</p></div>
  </div>
  <div class="trap"><b>도입형</b>이 제일 헷갈려요. 이름이 "도입"이라 준비도가 낮을 것 같지만 반대예요. "준비가 다 돼서 <b>바로 도입할 수 있는</b> 회사" = 준비도 높음, 성숙도 낮음.</div>
  <div class="memo">축부터: <b>가로 = 준비도, 세로 = 성숙도</b>. 대각선 짝: 둘 다 낮음 <b>준비형</b> ↔ 둘 다 높음 <b>확산형</b>. 나머지 둘은 "도입형 = 준비도만 높음", "정착형 = 성숙도만 높음".</div>
</section>

<section class="ep" id="e8">
  <div class="eph"><span class="no">8화</span><h2>분석가들을 어디에 앉히나: 분석 조직 3유형</h2><span class="pg">13쪽</span></div>
  <div class="core"><small>한 줄 핵심</small>분석 전담 조직(DSCoE)을 <b>한곳에 모으거나(집중형)</b>, <b>따로 두지 않고 부서마다 알아서 하거나(기능형)</b>, <b>전문가를 부서에 보내거나(분산형)</b>. 인사 담당자에겐 익숙한 조직 설계 문제예요.</div>
